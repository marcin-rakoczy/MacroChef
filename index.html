<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MacroChef - Calorie & Meal Planner PWA</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10b981" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MacroChef" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Dexie.js for IndexedDB -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <!-- Supabase JS client (pinned) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/app.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            emerald: {
              50: 'rgb(var(--color-primary-50) / <alpha-value>)',
              100: 'rgb(var(--color-primary-100) / <alpha-value>)',
              200: 'rgb(var(--color-primary-200) / <alpha-value>)',
              300: 'rgb(var(--color-primary-300) / <alpha-value>)',
              400: 'rgb(var(--color-primary-400) / <alpha-value>)',
              500: 'rgb(var(--color-primary-500) / <alpha-value>)',
              600: 'rgb(var(--color-primary-600) / <alpha-value>)',
              700: 'rgb(var(--color-primary-700) / <alpha-value>)',
              800: 'rgb(var(--color-primary-800) / <alpha-value>)',
              900: 'rgb(var(--color-primary-900) / <alpha-value>)',
              950: 'rgb(var(--color-primary-950) / <alpha-value>)',
            },
            teal: {
              50: 'rgb(var(--color-secondary-50) / <alpha-value>)',
              100: 'rgb(var(--color-secondary-100) / <alpha-value>)',
              200: 'rgb(var(--color-secondary-200) / <alpha-value>)',
              300: 'rgb(var(--color-secondary-300) / <alpha-value>)',
              400: 'rgb(var(--color-secondary-400) / <alpha-value>)',
              500: 'rgb(var(--color-secondary-500) / <alpha-value>)',
              600: 'rgb(var(--color-secondary-600) / <alpha-value>)',
              700: 'rgb(var(--color-secondary-700) / <alpha-value>)',
              800: 'rgb(var(--color-secondary-800) / <alpha-value>)',
              900: 'rgb(var(--color-secondary-900) / <alpha-value>)',
              950: 'rgb(var(--color-secondary-950) / <alpha-value>)',
            }
          },
        },
      },
    };
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen">
  
  <div id="root"></div>

  <!-- Non-JSX Core Scripts (Fast Native Execution) -->
  <script src="js/data/appVersion.js"></script>
  <script src="js/data/lidlProducts.js"></script>
  <script src="js/data/starterRecipes.js"></script>
  <script src="js/data/defaultPlan.js"></script>
  <script src="js/i18n/translations.js"></script>
  <script src="js/i18n/days.js"></script>
  <script src="js/i18n/context.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/recipeCsv.js"></script>
  <script src="js/utils/productCatalogCsv.js"></script>
  <script src="src/core/nutrition/calculations.js"></script>
  <script src="js/utils/shoppingAggregator.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/db.js"></script>
  <script src="js/session/repositoryScope.js"></script>
  <script src="js/sync/AppSyncManager.js"></script>
  <script src="js/hooks/useRepositoryQuery.js"></script>

  <!-- JSX React Components (Transpiled by Babel Standalone) -->
  <script type="text/babel" src="js/components/Icon.js"></script>
  <script type="text/babel" src="js/components/AuthGate.js"></script>
  <script type="text/babel" src="js/components/LoginScreen.js"></script>
  <script type="text/babel" src="js/components/AdBanner.js"></script>
  <script type="text/babel" src="js/components/AuthModal.js"></script>
  <script type="text/babel" src="js/components/Header.js"></script>
  <script type="text/babel" src="js/components/Navigation.js"></script>
  <script type="text/babel" src="js/components/RecipePickerModal.js"></script>
  <script type="text/babel" src="js/components/MealPlanner.js"></script>
  <script type="text/babel" src="js/components/RecipeLibrary.js"></script>
  <script type="text/babel" src="js/components/BatchCooking.js"></script>
  <script type="text/babel" src="js/components/ShoppingList.js"></script>
  <script type="text/babel" src="js/components/MacroTracker.js"></script>
  <script type="text/babel" src="js/components/RecipeModal.js"></script>

  <!-- App Component & Main Bootstrapper -->
  <script type="text/babel" src="js/app.js"></script>
  <script type="text/babel" src="js/components/SessionApp.js"></script>
  <script type="text/babel" src="js/main.js"></script>
</body>
</html>
