<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MacroChef - Calorie & Meal Planner PWA</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10b981" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MacroChef" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Dexie.js for IndexedDB -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/app.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen">
  
  <div id="root"></div>

  <!-- Non-JSX Core Scripts (Fast Native Execution) -->
  <script src="js/data/starterRecipes.js"></script>
  <script src="js/data/defaultPlan.js"></script>
  <script src="js/i18n/translations.js"></script>
  <script src="js/i18n/days.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/macroCalculations.js"></script>
  <script src="js/utils/shoppingAggregator.js"></script>
  <script src="js/db.js"></script>

  <!-- JSX React Components (Transpiled by Babel Standalone) -->
  <script type="text/babel" src="js/components/Icon.js"></script>
  <script type="text/babel" src="js/components/Header.js"></script>
  <script type="text/babel" src="js/components/Navigation.js"></script>
  <script type="text/babel" src="js/components/MealPlanner.js"></script>
  <script type="text/babel" src="js/components/RecipeLibrary.js"></script>
  <script type="text/babel" src="js/components/BatchCooking.js"></script>
  <script type="text/babel" src="js/components/ShoppingList.js"></script>
  <script type="text/babel" src="js/components/MacroTracker.js"></script>
  <script type="text/babel" src="js/components/RecipeModal.js"></script>

  <!-- App Component & Main Bootstrapper -->
  <script type="text/babel" src="js/app.js"></script>
  <script type="text/babel" src="js/main.js"></script>
</body>
</html>
