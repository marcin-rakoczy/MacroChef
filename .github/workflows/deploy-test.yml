name: Deploy to TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-test
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          fi

      - name: Build application
        run: npm run build

      - name: Verify Cloudflare production branch
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Cloudflare credentials are missing or the account ID is invalid."
            exit 1
          fi
          if ! curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/macrochef-3wo" \
            | jq -e '.success == true and .result.production_branch == "main"' > /dev/null; then
            echo "::error::Could not verify that the Cloudflare project's production branch is main."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=macrochef-3wo --branch=main

      - name: Report deployment
        run: echo 'TEST: https://test.macrochef.pl' >> "$GITHUB_STEP_SUMMARY"
