name: Deploy to PROD

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-prod
  cancel-in-progress: false

jobs:
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::PROD deployment must be run from the main branch."
            exit 1
          fi

  ci:
    needs: validate-main
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tested revision
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after this release was started; run the workflow again."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          fi

      - name: Bump version and build
        run: |
          node scripts/bump-version.js
          npm run build
          node tests/sw.test.js
          test "$(tr -d '\r\n' < CNAME)" = "macrochef.pl"

      - name: Commit version and build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json sw.js js/data/appVersion.js dist/ macrochef_calorie_meal_planner_pwa.html
          git commit -m "chore(release): bump version [skip ci]" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:refs/heads/main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: .

  deploy:
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
