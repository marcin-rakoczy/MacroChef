name: Build & Deploy (GitHub Pages + Cloudflare Pages)

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # TESTS - Run on all branches and PRs
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: |
          node tests/nutrition.test.js
          node tests/sw.test.js
          node tests/environment.test.js

  # ============================================================================
  # CLOUDFLARE PAGES DEPLOY - For all branches (test.macrochef.pl + branch previews)
  # ============================================================================
  deploy-cloudflare:
    # Deploy to Cloudflare Pages on every push (except [skip ci])
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build application
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: macrochef-test
          directory: .
          branch: ${{ github.ref_name }}
          # Production branch routes to test.macrochef.pl
          # Other branches route to branch-name.test.macrochef.pl

  # ============================================================================
  # GITHUB PAGES DEPLOY - Only for main branch on workflow_dispatch or non-[skip ci] push
  # ============================================================================
  deploy-github-pages:
    # Only deploy to GitHub Pages:
    # 1. On manual workflow_dispatch from main
    # 2. On push to main without [skip ci]
    # 3. NOT on feature branches
    # 4. NOT on pull requests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')))
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run full test suite
        run: |
          node tests/nutrition.test.js
          node tests/sw.test.js
          node tests/environment.test.js
          node tests/version.test.js

      - name: Bump version and build
        run: |
          node scripts/bump-version.js
          npm run build
          node tests/sw.test.js
          test "$(tr -d '\r\n' < CNAME)" = "macrochef.pl"

      - name: Commit version and build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json sw.js js/data/appVersion.js dist/ macrochef_calorie_meal_planner_pwa.html
          git commit -m "chore: bump version [skip ci]" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:refs/heads/main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

