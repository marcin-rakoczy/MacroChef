name: Build & Deploy (GitHub Pages + Cloudflare Pages)

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # TESTS - Run on all branches and PRs
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        shell: bash
        run: |
          node tests/deployPipeline.test.js
          for test in tests/*.test.js; do
            case "$test" in
              tests/deployPipeline.test.js|tests/*.browser.test.js|tests/admin-panel.integration.test.js|tests/admin-panel.test.js|tests/admin-panel.ui.test.js|tests/db.test.js|tests/i18n.test.js|tests/recipe-import.test.js|tests/rls-policies.test.js)
                continue ;;
            esac
            node "$test"
          done

  # ============================================================================
  # PREVIEW BUILD - For pushes (Cloudflare Pages deploys automatically)
  # ============================================================================
  build-preview:
    # Build on every push (except [skip ci])
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build application
        run: npm run build
      
      # Note: Cloudflare Pages automatically deploys from GitHub repository.
      # No explicit deploy step needed here.
      # Cloudflare Pages is configured to build from main branch and all feature/* branches.

  # ============================================================================
  # PRODUCTION BUILD - Manual only (workflow_dispatch from main branch)
  # ============================================================================
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version and build
        run: |
          node scripts/bump-version.js
          npm run build
          node tests/sw.test.js
          test "$(tr -d '\r\n' < CNAME)" = "macrochef.pl"

      - name: Commit version and build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json sw.js js/data/appVersion.js dist/ macrochef_calorie_meal_planner_pwa.html
          git commit -m "chore: bump version [skip ci]" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:refs/heads/main

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: .

  # ============================================================================
  # GITHUB PAGES DEPLOY - Manual only (workflow_dispatch from main branch)
  # ============================================================================
  deploy-github-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.test.result == 'success' && needs.build.result == 'success'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

