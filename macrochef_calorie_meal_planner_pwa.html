// Pure calculations for macros and daily goals
window.MacroChef = window.MacroChef || {};

(function () {
const macroCalculations = {
  calculateMaintenanceCalories(goals) {
    const age = Number(goals.age);
    const weight = Number(goals.weight);
    const height = Number(goals.height);
    const activity = String(goals.activityPal);
    if (!Number.isFinite(age) || age < 18 || age > 120 ||
        !Number.isFinite(weight) || weight <= 0 || weight > 500 ||
        !Number.isFinite(height) || height < 50 || height > 300 ||
        (goals.sex !== 'female' && goals.sex !== 'male') ||
        !['1.25', '1.45', '1.65', '1.85', '2.2'].includes(activity)) {
      return null;
    }
    return Math.round((10 * weight + 6.25 * height - 5 * age +
      (goals.sex === 'female' ? -161 : 5)) * Number(activity));
  },

  calculateRecommendedCalories(cpm, userGoal) {
    if (cpm === null) return null;
    const adjustments = { weightLoss: -500, muscleGain: 300, maintenance: 0, healthyHabits: 0 };
    return Math.max(500, cpm + (adjustments[userGoal] || 0));
  },

  getDailyTotals(dayKey, plan, recipes) {
    const dayPlan = (plan && plan[dayKey]) || {};
    const totals = { calories: 0, protein: 0, carbs: 0, fats: 0 };

    Object.values(dayPlan).forEach((recipeId) => {
      if (!recipeId) return;
      const rec = (recipes || []).find((r) => r.id === recipeId);
      if (rec) {
        totals.calories += Number(rec.calories) || 0;
        totals.protein += Number(rec.protein) || 0;
        totals.carbs += Number(rec.carbs) || 0;
        totals.fats += Number(rec.fats) || 0;
      }
    });

    return totals;
  },

  calculateMacrosForGoal(goals, cpm) {
    const calories = Number(goals.calories) || 2000;
    const weight = Number(goals.weight) || 70;
    const sex = goals.sex || 'male';
    const userGoal = goals.userGoal || '';

    let protein = 0;
    let fats = 0;
    let carbs = 0;

    if (userGoal === 'weightLoss') {
      // Weight loss: protein 2g/kg, fats 30% of calories, carbs fill remainder
      protein = Math.round(weight * 2);
      fats = Math.round((calories * 0.30) / 9);
      
      // Safety check for women: minimum 0.8g/kg
      if (sex === 'female' && fats < weight * 0.8) {
        fats = Math.round(weight * 0.8);
      }
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else if (userGoal === 'maintenance') {
      // Maintenance: protein 1.6-1.8g/kg (use 1.7), fats 30%, carbs fill remainder
      protein = Math.round(weight * 1.7);
      fats = Math.round((calories * 0.30) / 9);
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else if (userGoal === 'muscleGain') {
      // Muscle gain: protein 1.8g/kg, fats 20-25% (use 22%), carbs 50-55% (use 53%)
      protein = Math.round(weight * 1.8);
      fats = Math.round((calories * 0.22) / 9);
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else {
      // Healthy habits: no automatic adjustment, use input values
      protein = Number(goals.protein) || 0;
      carbs = Number(goals.carbs) || 0;
      fats = Number(goals.fats) || 0;
    }

    // Ensure sum equals calorie goal (adjust carbs for rounding)
    const calculatedCalories = protein * 4 + carbs * 4 + fats * 9;
    if (calculatedCalories !== calories && userGoal !== 'healthyHabits') {
      const difference = calories - (protein * 4 + fats * 9);
      carbs = Math.round(difference / 4);
    }

    return { protein, carbs, fats };
  },

  calculateDistribution(goals, cpm) {
    const calories = Number(goals.calories) || 2000;
    let protein = Number(goals.protein) || 0;
    let carbs = Number(goals.carbs) || 0;
    let fats = Number(goals.fats) || 0;

    // If a goal is selected and we have CPM, recalculate macros
    if (goals.userGoal && goals.userGoal !== 'healthyHabits' && cpm) {
      const calculated = macroCalculations.calculateMacrosForGoal(goals, cpm);
      protein = calculated.protein;
      carbs = calculated.carbs;
      fats = calculated.fats;
    }

    const proteinKcal = protein * 4;
    const carbsKcal = carbs * 4;
    const fatsKcal = fats * 9;

    return {
      protein,
      carbs,
      fats,
      proteinKcal,
      carbsKcal,
      fatsKcal,
      proteinPercent: calories > 0 ? Math.round((proteinKcal / calories) * 100) : 0,
      carbsPercent: calories > 0 ? Math.round((carbsKcal / calories) * 100) : 0,
      fatsPercent: calories > 0 ? Math.round((fatsKcal / calories) * 100) : 0,
      totalKcal: proteinKcal + carbsKcal + fatsKcal
    };
  }
};
window.MacroChef.macroCalculations = Object.freeze(macroCalculations);
})();

// Aggregation engine for whole-package shopping lists & food waste reduction
window.MacroChef = window.MacroChef || {};

window.MacroChef.shoppingAggregator = {
  getRecipePlanCounts(plan) {
    const counts = {};
    if (!plan) return counts;
    Object.values(plan).forEach((dayMeals) => {
      if (!dayMeals) return;
      Object.values(dayMeals).forEach((recipeId) => {
        if (recipeId) {
          counts[recipeId] = (counts[recipeId] || 0) + 1;
        }
      });
    });
    return counts;
  },

  calculateShoppingList(plan, recipes, lang) {
    const { getLocalized } = window.MacroChef.helpers;
    const recipePlanCounts = this.getRecipePlanCounts(plan);
    const map = {};

    Object.entries(recipePlanCounts).forEach(([recipeId, timesPlanned]) => {
      const rec = (recipes || []).find((r) => r.id === recipeId);
      if (!rec || !rec.ingredients) return;

      const scaleFactor = timesPlanned / (rec.servings || 1);

      rec.ingredients.forEach((ing) => {
        const ingName = getLocalized(ing.name, lang);
        const key = ingName.toLowerCase().trim();
        const requiredAmount = (Number(ing.amount) || 0) * scaleFactor;
        const pkgSize = Number(ing.packageSize) || Number(ing.amount) || 1;

        if (!map[key]) {
          map[key] = {
            name: ingName,
            totalRequired: 0,
            unit: ing.unit || 'g',
            packageSize: pkgSize,
            packageUnit: ing.packageUnit || ing.unit || 'g',
            recipesUsedIn: new Set()
          };
        }

        map[key].totalRequired += requiredAmount;
        map[key].recipesUsedIn.add(getLocalized(rec.name, lang));
      });
    });

    return Object.values(map).map((item) => {
      const packagesNeeded = Math.ceil(item.totalRequired / item.packageSize) || 1;
      const totalBoughtAmount = packagesNeeded * item.packageSize;
      const leftoverAmount = Math.max(0, totalBoughtAmount - item.totalRequired);

      return {
        ...item,
        packagesNeeded,
        totalBoughtAmount,
        leftoverAmount,
        recipesUsedIn: Array.from(item.recipesUsedIn)
      };
    });
  }
};

// Dexie-backed implementation of MacroChef's data repository contract
window.MacroChef = window.MacroChef || {};

(function () {
  class ICalorieRepository {
    initialize() { throw new Error('initialize() must be implemented'); }
    watchAppData() { throw new Error('watchAppData() must be implemented'); }
    watchProducts() { throw new Error('watchProducts() must be implemented'); }
    getAllRecipes() { throw new Error('getAllRecipes() must be implemented'); }
    saveRecipe(recipeData) { throw new Error('saveRecipe() must be implemented'); }
    deleteRecipe(id) { throw new Error('deleteRecipe() must be implemented'); }
    savePlannerSlot(dayKey, currentDayPlan, mealType, recipeId) {
      throw new Error('savePlannerSlot() must be implemented');
    }
    clearPlanner() { throw new Error('clearPlanner() must be implemented'); }
    saveGoals(goals) { throw new Error('saveGoals() must be implemented'); }
    saveProduct(productData) { throw new Error('saveProduct() must be implemented'); }
    deleteProduct(id) { throw new Error('deleteProduct() must be implemented'); }
  }

  const slots = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];

  const createId = (prefix) => {
    const cryptoApi = window.crypto;
    if (cryptoApi && typeof cryptoApi.randomUUID === 'function') {
      return `${prefix}-${cryptoApi.randomUUID()}`;
    }
    if (cryptoApi && typeof cryptoApi.getRandomValues === 'function') {
      const bytes = new Uint8Array(16);
      cryptoApi.getRandomValues(bytes);
      return `${prefix}-${Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('')}`;
    }
    throw new Error('Secure random number generation is required for database IDs');
  };

  const assertStringKey = (key, entity) => {
    if (typeof key !== 'string' || key.length === 0) {
      throw new TypeError(`${entity} primary key must be a non-empty string`);
    }
  };

  // Repository writes and their offline journal entries share one transaction.
  class OfflineMutationDecorator {
    constructor(db) {
      this.db = db;
    }

    transaction(tables, mutate) {
      const offline = navigator.onLine === false;
      return this.db.transaction('rw', ...tables, this.db.OutboxQueue, () => mutate({
        put: async (table, value) => {
          assertStringKey(value.id, table.name);
          const exists = await table.get(value.id);
          await table.put(value);
          if (offline) {
            await this.enqueue(table.name, exists ? 'update' : 'create',
              exists ? { id: value.id, value } : value);
          }
        },
        update: async (table, id, changes) => {
          assertStringKey(id, table.name);
          const count = await table.update(id, changes);
          if (count && offline) {
            await this.enqueue(table.name, 'update', { id, changes });
          }
        },
        delete: async (table, id) => {
          assertStringKey(id, table.name);
          const exists = await table.get(id);
          if (exists === undefined) return;
          await table.delete(id);
          if (offline) {
            await this.enqueue(table.name, 'delete', { id });
          }
        }
      }));
    }

    enqueue(table, action, payload) {
      return this.db.OutboxQueue.add({
        id: createId('outbox'),
        table,
        action,
        payload: Dexie.deepClone(payload),
        timestamp: Date.now()
      });
    }
  }

  class DexieCalorieRepository extends ICalorieRepository {
    constructor(databaseName = 'MacroChefDB') {
      super();
      this.db = new Dexie(databaseName);

      this.db.version(1).stores({
        recipes: 'id',
        planner: 'dayKey',
        goals: 'id'
      });
      this.db.version(2).stores({
        recipes: 'id',
        planner: 'dayKey',
        goals: 'id',
        products: 'id, name, category'
      });
      this.db.version(3).stores({
        recipes: 'id',
        planner: 'dayKey',
        plannerEntries: 'id, dayKey',
        goals: 'id',
        products: 'id, name, category',
        OutboxQueue: 'id, timestamp'
      }).upgrade(async (tx) => {
        const recipeIds = new Map();
        const recipes = await tx.table('recipes').toArray();
        await tx.table('recipes').clear();
        for (const recipe of recipes) {
          const id = createId('rec');
          recipeIds.set(recipe.id, id);
          await tx.table('recipes').add({ ...recipe, id });
        }

        const plans = await tx.table('planner').toArray();
        for (const plan of plans) {
          const migrated = { ...plan, id: createId('plan') };
          slots.forEach((slot) => {
            if (recipeIds.has(migrated[slot])) migrated[slot] = recipeIds.get(migrated[slot]);
          });
          await tx.table('plannerEntries').add(migrated);
        }

        const goals = await tx.table('goals').toArray();
        await tx.table('goals').clear();
        for (const goal of goals) {
          await tx.table('goals').add({ ...goal, id: createId('goal') });
        }
        const products = await tx.table('products').toArray();
        await tx.table('products').clear();
        for (const product of products) {
          await tx.table('products').add({ ...product, id: createId('product') });
        }
      });
      this.db.version(4).stores({ planner: null });
      this.mutations = new OfflineMutationDecorator(this.db);

      this.db.on('populate', async () => {
        await this.seedInitialData();
        await this.seedProducts();
      });
    }

    async seedInitialData() {
      const recipes = window.MacroChef.STARTER_RECIPES || [];
      const recipeIds = new Map();
      const seededRecipes = recipes.map((recipe) => {
        const id = createId('rec');
        recipeIds.set(recipe.id, id);
        return { ...recipe, id };
      });
      if (seededRecipes.length) await this.db.recipes.bulkAdd(seededRecipes);

      if (window.MacroChef.DEFAULT_PLAN && await this.db.plannerEntries.count() === 0) {
        const plans = window.MacroChef.DEFAULT_PLAN.map((plan) => {
          const seeded = { ...plan, id: createId('plan') };
          slots.forEach((slot) => {
            if (recipeIds.has(seeded[slot])) seeded[slot] = recipeIds.get(seeded[slot]);
          });
          return seeded;
        });
        await this.db.plannerEntries.bulkAdd(plans);
      }
      if (window.MacroChef.DEFAULT_GOALS && await this.db.goals.count() === 0) {
        await this.db.goals.add({ ...window.MacroChef.DEFAULT_GOALS, id: createId('goal') });
      }
    }

    async seedProducts() {
      if (window.MacroChef.LIDL_PRODUCTS) {
        await this.db.products.bulkAdd(window.MacroChef.LIDL_PRODUCTS.map(
          (product) => ({ ...product, id: createId('product') })
        ));
      }
    }

    async initialize() {
      await this.db.open();
      if (await this.db.recipes.count() === 0) {
        await this.db.transaction('rw', this.db.recipes, this.db.plannerEntries, this.db.goals, () => this.seedInitialData());
      }
      if (await this.db.products.count() === 0) {
        await this.seedProducts();
      }
    }

    watchAppData() {
      return Dexie.liveQuery(async () => {
        const [recipes, plannerRows, storedGoals] = await Promise.all([
          this.db.recipes.toArray(),
          this.db.plannerEntries.toArray(),
          this.db.goals.toCollection().first()
        ]);
        const plan = {};
        plannerRows.forEach((item) => {
          plan[item.dayKey] = {
            Breakfast: item.Breakfast || '',
            Lunch: item.Lunch || '',
            Dinner: item.Dinner || '',
            Snack: item.Snack || ''
          };
        });
        return { recipes, plan, goals: storedGoals || window.MacroChef.DEFAULT_GOALS };
      });
    }

    watchProducts() {
      return Dexie.liveQuery(() => this.db.products.toArray());
    }

    async getAllRecipes() {
      return await this.db.recipes.toArray();
    }

    async saveRecipe(recipeData) {
      const recipe = { ...recipeData };
      if (recipe.id === undefined || recipe.id === null || recipe.id === '') recipe.id = createId('rec');
      assertStringKey(recipe.id, 'Recipe');
      await this.mutations.transaction([this.db.recipes], ({ put }) => put(this.db.recipes, recipe));
      return recipe;
    }

    async deleteRecipe(id) {
      assertStringKey(id, 'Recipe');
      await this.mutations.transaction([this.db.recipes, this.db.plannerEntries], async ({ update, delete: remove }) => {
        await remove(this.db.recipes, id);
        const plans = await this.db.plannerEntries.toArray();
        for (const plan of plans) {
          const changes = {};
          slots.forEach((slot) => {
            if (plan[slot] === id) changes[slot] = undefined;
          });
          if (Object.keys(changes).length) await update(this.db.plannerEntries, plan.id, changes);
        }
      });
    }

    async savePlannerSlot(dayKey, currentDayPlan, mealType, recipeId) {
      assertStringKey(dayKey, 'Planner day');
      if (!slots.includes(mealType)) throw new TypeError('Invalid planner meal type');
      return await this.mutations.transaction([this.db.plannerEntries], async ({ put, update }) => {
        const current = await this.db.plannerEntries.where('dayKey').equals(dayKey).first();
        const updated = { ...(current || { id: createId('plan'), dayKey }), [mealType]: recipeId };
        if (current) {
          await update(this.db.plannerEntries, current.id, { [mealType]: recipeId });
        } else {
          await put(this.db.plannerEntries, updated);
        }
        const { id, dayKey: savedDay, ...plan } = updated;
        return plan;
      });
    }

    async clearPlanner() {
      const days = window.MacroChef.DAYS_KEYS || [
        'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'
      ];
      await this.mutations.transaction([this.db.plannerEntries], async ({ put, update, delete: remove }) => {
        const existing = await this.db.plannerEntries.toArray();
        for (const plan of existing) {
          if (!days.includes(plan.dayKey)) await remove(this.db.plannerEntries, plan.id);
        }
        for (const dayKey of days) {
          const plan = existing.find((item) => item.dayKey === dayKey);
          if (plan) {
            const changes = {};
            slots.forEach((slot) => { if (slot in plan) changes[slot] = undefined; });
            if (Object.keys(changes).length) await update(this.db.plannerEntries, plan.id, changes);
          } else {
            await put(this.db.plannerEntries, { id: createId('plan'), dayKey });
          }
        }
      });
      return Object.fromEntries(days.map((dayKey) => [dayKey, {}]));
    }

    async saveGoals(goals) {
      return await this.mutations.transaction([this.db.goals], async ({ put }) => {
        const current = await this.db.goals.toCollection().first();
        const toSave = { ...goals, id: current ? current.id : createId('goal') };
        await put(this.db.goals, toSave);
        return toSave;
      });
    }

    async saveProduct(productData) {
      const product = { ...productData };
      if (product.id === undefined || product.id === null || product.id === '') product.id = createId('product');
      assertStringKey(product.id, 'Product');
      await this.mutations.transaction([this.db.products], ({ put }) => put(this.db.products, product));
      return product;
    }

    async deleteProduct(id) {
      assertStringKey(id, 'Product');
      await this.mutations.transaction([this.db.products], ({ delete: remove }) => remove(this.db.products, id));
    }
  }

  window.MacroChef.ICalorieRepository = ICalorieRepository;
  window.MacroChef.DexieCalorieRepository = DexieCalorieRepository;
  window.MacroChef.repositories = new DexieCalorieRepository();
})();

// React 18 external-store hook for Dexie liveQuery observables
window.MacroChef = window.MacroChef || {};

(function () {
  const createExternalStore = (observable, initialData) => {
    let snapshot = { data: initialData, loading: true, error: null };
    let subscription = null;
    const listeners = new Set();

    const notify = () => {
      listeners.forEach((listener) => listener());
    };

    return {
      getSnapshot() {
        return snapshot;
      },

      subscribe(listener) {
        listeners.add(listener);
        if (!subscription) {
          try {
            subscription = observable.subscribe({
              next(data) {
                snapshot = { data, loading: false, error: null };
                notify();
              },
              error(error) {
                snapshot = { ...snapshot, loading: false, error };
                notify();
              }
            });
          } catch (error) {
            snapshot = { ...snapshot, loading: false, error };
            notify();
          }
        }

        return () => {
          listeners.delete(listener);
          if (listeners.size === 0 && subscription) {
            subscription.unsubscribe();
            subscription = null;
          }
        };
      }
    };
  };

  const useRepositoryQuery = (createObservable, dependencies, initialData) => {
    const observable = React.useMemo(createObservable, dependencies);
    const store = React.useMemo(
      () => createExternalStore(observable, initialData),
      [observable, initialData]
    );
    return React.useSyncExternalStore(store.subscribe, store.getSnapshot, store.getSnapshot);
  };

  window.MacroChef.useRepositoryQuery = useRepositoryQuery;
})();

    React.useEffect(() => {
      if (!spanRef.current) return;

      if (window.lucide && window.lucide.icons) {
        const { toPascalCase } = window.MacroChef.helpers;
        const pascalName = toPascalCase(name);
        const iconDef = window.lucide.icons[pascalName] || window.lucide.icons[name];

        if (iconDef && typeof iconDef.toSvg === 'function') {
          spanRef.current.innerHTML = iconDef.toSvg({ class: className });
          return;
        }
      }

      // Fallback with isolated createIcons root
      spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons({ root: spanRef.current });
      }
    }, [name, className]);

    return (
      <span
        ref={spanRef}
        className="inline-flex items-center justify-center shrink-0 pointer-events-none"
        {...props}
      />
    );
  }

  window.MacroChef.components.Icon = Icon;
})();

(function () {
  const { Icon } = window.MacroChef.components;
  const { getLocalized } = window.MacroChef.helpers;

  function matchesCategory(recipeCat, targetCatKey) {
    if (!targetCatKey || targetCatKey === 'all') return true;
    if (!recipeCat) return false;
    const enVal = (typeof recipeCat === 'object' ? recipeCat.en : recipeCat) || '';
    const plVal = (typeof recipeCat === 'object' ? recipeCat.pl : recipeCat) || '';
    const targetLower = targetCatKey.toLowerCase();
    return (
      enVal.toLowerCase() === targetLower ||
      plVal.toLowerCase() === targetLower ||
      (targetLower === 'breakfast' && (enVal.toLowerCase().includes('breakfast') || plVal.toLowerCase().includes('śniadanie') || plVal.toLowerCase().includes('sniadanie'))) ||
      (targetLower === 'lunch' && (enVal.toLowerCase().includes('lunch') || plVal.toLowerCase().includes('obiad'))) ||
      (targetLower === 'dinner' && (enVal.toLowerCase().includes('dinner') || plVal.toLowerCase().includes('kolacja'))) ||
      (targetLower === 'snack' && (enVal.toLowerCase().includes('snack') || plVal.toLowerCase().includes('przekąska') || plVal.toLowerCase().includes('przekaska')))
    );
  }

    ];

    // Determine initial category based on slot
    const [selectedCategory, setSelectedCategory] = React.useState(() => {
      if (slotInfo && slotInfo.slotKey) {
        const hasMatching = recipes.some((r) => matchesCategory(r.category, slotInfo.slotKey));
        if (hasMatching) {
          return slotInfo.slotKey;
        }
      }
      return 'all';
    });

    const [searchQuery, setSearchQuery] = React.useState('');

      const handleKeyDown = (e) => {

          onClose();

      };

      return () => window.removeEventListener('keydown', handleKeyDown);
    }, [onClose]);

    // Filter recipes
    const filteredRecipes = React.useMemo(() => {
      return (recipes || []).filter((rec) => {
        // Category check
        if (!matchesCategory(rec.category, selectedCategory)) {
          return false;
        }

        // Search check
        if (searchQuery.trim()) {
          const query = searchQuery.toLowerCase().trim();
          const nameEn = (typeof rec.name === 'object' ? rec.name.en : rec.name) || '';
          const namePl = (typeof rec.name === 'object' ? rec.name.pl : rec.name) || '';
          const categoryName = getLocalized(rec.category, lang).toLowerCase();

          const matchesName = nameEn.toLowerCase().includes(query) || namePl.toLowerCase().includes(query) || categoryName.includes(query);
          
          const matchesIngredients = (rec.ingredients || []).some((ing) => {
            const ingEn = (typeof ing.name === 'object' ? ing.name.en : ing.name) || '';
            const ingPl = (typeof ing.name === 'object' ? ing.name.pl : ing.name) || '';
            return ingEn.toLowerCase().includes(query) || ingPl.toLowerCase().includes(query);
          });

          return matchesName || matchesIngredients;
        }

        return true;
      });
    }, [recipes, selectedCategory, searchQuery, lang]);

// Weekly Meal Planner Tab Component
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { Icon, RecipePickerModal } = window.MacroChef.components;
  const { getLocalized } = window.MacroChef.helpers;
  const { getDailyTotals } = window.MacroChef.macroCalculations;

  function MealPlanner({
    daysKeys,
    plan,
    recipes,
    goals,
    onAssignMeal,
    onClearWeek,
    onCreateRecipe
  }) {
    const { t, lang, daysList } = window.MacroChef.useI18n();
    // Active slot being picked: { dayKey, dayName, slotKey, slotLabel, currentId }
    const [pickerSlot, setPickerSlot] = React.useState(null);

    const mealSlots = [
      { key: 'Breakfast', label: t.breakfast },
      { key: 'Lunch', label: t.lunch },
      { key: 'Dinner', label: t.dinner },
      { key: 'Snack', label: t.snack }
    ];

    const handleOpenPicker = (dayKey, dayName, slotKey, slotLabel, currentId) => {
      setPickerSlot({
        dayKey,
        dayName,
        slotKey,
        slotLabel,
        currentId: currentId || ''
      });
    };

    return (
      <div className="space-y-6">
        {/* Header Controls */}
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <div>
            <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <Icon name="calendar" className="w-5 h-5 text-emerald-500" />
              <span>{t.weeklySchedule}</span>
            </h2>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
              {t.weeklySub}
            </p>
          </div>

          <button
            onClick={onClearWeek}
            className="flex items-center gap-1.5 text-xs text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 px-3 py-2 rounded-xl border border-rose-200 dark:border-rose-900/50 transition-colors"
          >
            <Icon name="rotate-ccw" className="w-3.5 h-3.5" />
            <span>{t.clearWeek}</span>
          </button>
        </div>

        {/* Weekly Grid */}
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
          {daysKeys.map((dayKey, idx) => {
            const dayNameDisplay = daysList[idx];
            const totals = getDailyTotals(dayKey, plan, recipes);
            const calPercent = Math.min(100, Math.round((totals.calories / (goals.calories || 2000)) * 100));

            return (
              <div
                key={dayKey}
                className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700/80 p-4 shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow"
              >
                <div>
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700/60 mb-3">
                    <span className="font-bold text-slate-800 dark:text-slate-100">{dayNameDisplay}</span>
                    <div className="text-right">
                      <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400">
                        {totals.calories} / {goals.calories} kcal
                      </span>
                    </div>
                  </div>

                  {/* Progress bar */}
                  <div className="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden mb-4">
                    <div
                      className={`h-full transition-all duration-300 ${
                        calPercent > 105
                          ? 'bg-amber-500'
                          : calPercent > 90
                          ? 'bg-emerald-500'
                          : 'bg-teal-400'
                      }`}
                      style={{ width: `${calPercent}%` }}
                    />
                  </div>

                  {/* Meal Slots */}
                  <div className="space-y-3">
                    {mealSlots.map((slot) => {
                      const assignedId = plan[dayKey]?.[slot.key];
                      const recipe = recipes.find((r) => r.id === assignedId);

                      return (
                        <div
                          key={slot.key}
                          className="bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800/80"
                        >
                          <div className="flex items-center justify-between text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1.5">
                            <span>{slot.label}</span>
                            {recipe && (
                              <span className="text-emerald-600 dark:text-emerald-400 font-bold">
                                {recipe.calories} kcal
                              </span>
                            )}
                          </div>

                          {!recipe ? (
                            /* Empty Slot: Clickable button to open Recipe Library */
                            <button
                              type="button"
                              onClick={() => handleOpenPicker(dayKey, dayNameDisplay, slot.key, slot.label, '')}
                              className="w-full group py-2 px-3 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 hover:border-emerald-500 dark:hover:border-emerald-400 bg-white/70 dark:bg-slate-800/60 hover:bg-emerald-50/50 dark:hover:bg-emerald-950/20 text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all flex items-center justify-center gap-2 text-xs font-semibold cursor-pointer shadow-none hover:shadow-sm"
                            >
                              <div className="w-5 h-5 rounded-lg bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                                <Icon name="plus" className="w-3.5 h-3.5" />
                              </div>
                              <span className="truncate">{t.selectFromLibrary || 'Wybierz z biblioteki'}</span>
                            </button>
                          ) : (
                            /* Filled Slot: Card displaying recipe with change & remove options */
                            <div className="bg-white dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:border-emerald-400 dark:hover:border-emerald-500 transition-colors">
                              <div className="flex items-start justify-between gap-1.5 mb-1.5">
                                <button
                                  type="button"
                                  onClick={() => handleOpenPicker(dayKey, dayNameDisplay, slot.key, slot.label, assignedId)}
                                  className="text-left font-bold text-xs text-slate-800 dark:text-slate-100 hover:text-emerald-600 dark:hover:text-emerald-400 line-clamp-1 transition-colors"
                                  title={getLocalized(recipe.name, lang)}
                                >
                                  {getLocalized(recipe.name, lang)}
                                </button>
                                <div className="flex items-center gap-0.5 shrink-0">
                                  <button
                                    type="button"
                                    onClick={() => handleOpenPicker(dayKey, dayNameDisplay, slot.key, slot.label, assignedId)}
                                    className="p-1 text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 rounded-md hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                                    title={t.changeRecipe || 'Zmień'}
                                  >
                                    <Icon name="book-open" className="w-3.5 h-3.5" />
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => onAssignMeal(dayKey, slot.key, '')}
                                    className="p-1 text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 rounded-md hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors"
                                    title={t.removeMeal || 'Usuń'}
                                  >
                                    <Icon name="trash-2" className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>

                              <div className="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
                                <span className="text-[10px] text-slate-400 dark:text-slate-500 font-medium">
                                  B: {recipe.protein}g | W: {recipe.carbs}g | T: {recipe.fats}g
                                </span>
                                <span className="flex items-center gap-1 text-teal-600 dark:text-teal-400 shrink-0">
                                  <Icon name="clock" className="w-3 h-3" />
                                  <span>{recipe.prepTime}</span>
                                </span>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                  <span>{t.macrosTotal}:</span>
                  <span className="font-semibold text-slate-700 dark:text-slate-300">
                    B:{totals.protein}g | W:{totals.carbs}g | T:{totals.fats}g
                  </span>
                </div>
              </div>
            );
          })}
        </div>

        {/* Recipe Picker Modal from Recipe Library */}
        {pickerSlot && (
          <RecipePickerModal
            slotInfo={pickerSlot}
            recipes={recipes}
            onSelectRecipe={(recipeId) => {
              onAssignMeal(pickerSlot.dayKey, pickerSlot.slotKey, recipeId);
              setPickerSlot(null);
            }}
            onClearSlot={() => {
              onAssignMeal(pickerSlot.dayKey, pickerSlot.slotKey, '');
              setPickerSlot(null);
            }}
            onClose={() => setPickerSlot(null)}
            onCreateRecipe={onCreateRecipe}
          />
        )}
      </div>
    );
  }

  window.MacroChef.components.MealPlanner = MealPlanner;
})();

                {isCatalogOpen && (

                        >

                        </button>

                  ))

                <span className="text-xs font-bold text-slate-700 dark:text-slate-300">

                    <input

                      placeholder={lang === 'pl' ? 'Opis kroku...' : 'Step description...'}
                      className="flex-1 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                    />
                    {formData.steps.length > 1 && (
                      <button

                        className="text-rose-500 hover:text-rose-700 p-1"
                      >
                        <Icon name="trash-2" className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            </div>

            {/* Footer Buttons */}
            <div className="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl"
              >
                {t.cancel}

              <button
                type="submit"
                className="px-6 py-2.5 text-xs font-bold bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl shadow-md shadow-emerald-500/20 transition-all"
              >
                {t.saveRecipe}

          </form>

          {/* ======================================================== */}
          {/* Sub-Modal: Add New Ingredient / Product to Catalog (Lidl) */}
          {/* ======================================================== */}
          {showNewProductModal && (
            <div className="fixed inset-0 z-60 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700 mb-4">
                  <h4 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">

                  <button
                    onClick={() => setShowNewProductModal(false)}

                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>

                <div className="space-y-4">
                  {/* Product Name */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">

                    <input

                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs font-medium text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                      autoFocus
                    />

                  {/* Unit & Package Size */}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">

                      <select

                      >

                    >

// Main MacroChef React Application Controller
window.MacroChef = window.MacroChef || {};

(function () {
  const { useState, useEffect, useMemo } = React;
  const {
    Header,
    Navigation,
    MealPlanner,
    RecipeLibrary,
    BatchCooking,
    ShoppingList,
    MacroTracker,
    RecipeModal
  } = window.MacroChef.components;

  const { repositories } = window.MacroChef;
  const { shoppingAggregator } = window.MacroChef;
  const { DAYS_KEYS } = window.MacroChef;
  const { useRepositoryQuery } = window.MacroChef;

  function App() {
    const [activeTab, setActiveTab] = useState('planner');
    const [darkMode, setDarkMode] = useState(() => {
      return localStorage.getItem('macrochef_dark') === 'true';
    });
    const { lang } = window.MacroChef.useI18n();
    const [colorTheme, setColorTheme] = useState(() => {
      return localStorage.getItem('macrochef_color_theme') || 'emerald';
    });

    const appData = useRepositoryQuery(
      () => repositories.watchAppData(),
      [repositories],
      null
    );
    const recipes = appData.data ? appData.data.recipes : [];
    const plan = appData.data ? appData.data.plan : {};
    const goals = appData.data
      ? {
          ...window.MacroChef.DEFAULT_GOALS,
          ...appData.data.goals,
          age: appData.data.goals.age ?? '',
          weight: appData.data.goals.weight ?? '',
          height: appData.data.goals.height ?? '',
          sex: appData.data.goals.sex ?? '',
          activityPal: appData.data.goals.activityPal ?? '',
          userGoal: appData.data.goals.userGoal ?? ''
        }
      : window.MacroChef.DEFAULT_GOALS;
    const [checkedShopping, setCheckedShopping] = useState(() => {
      try {
        const saved = localStorage.getItem('macrochef_checked');
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    });

    const [selectedBatchRecipe, setSelectedBatchRecipe] = useState(null);
    const [batchStep, setBatchStep] = useState(0);
    const [showRecipeModal, setShowRecipeModal] = useState(false);
    const [editingRecipe, setEditingRecipe] = useState(null);

    useEffect(() => {
      localStorage.setItem('macrochef_dark', String(darkMode));
    }, [darkMode]);

    useEffect(() => {
      localStorage.setItem('macrochef_color_theme', colorTheme);
      document.documentElement.setAttribute('data-color-theme', colorTheme);

      // Update mobile status bar theme-color
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        if (colorTheme === 'violet') {
          metaTheme.setAttribute('content', darkMode ? '#1e1b4b' : '#6366f1');
        } else if (colorTheme === 'mono') {
          metaTheme.setAttribute('content', darkMode ? '#18181b' : '#27272a');
        } else {
          metaTheme.setAttribute('content', darkMode ? '#022c22' : '#10b981');
        }
      }
    }, [colorTheme, darkMode]);

    useEffect(() => {
      if (darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }, [darkMode]);

    useEffect(() => {
      localStorage.setItem('macrochef_checked', JSON.stringify(checkedShopping));
    }, [checkedShopping]);

    useEffect(() => {
      repositories.initialize().catch((err) => {
        console.error('Data repository initialization error:', err);
      });
    }, []);

    useEffect(() => {
      if (appData.error) {
        console.error('Data repository subscription error:', appData.error);
      }
    }, [appData.error]);

    // Aggregated Smart Shopping List
    const aggregatedShoppingList = useMemo(() => {
      return shoppingAggregator.calculateShoppingList(plan, recipes, lang);
    }, [plan, recipes, lang]);

    // Handlers
    const handleAssignMeal = async (dayKey, mealType, recipeId) => {
      await repositories.savePlannerSlot(
        dayKey,
        plan[dayKey],
        mealType,
        recipeId
      );
    };

    const handleClearWeek = async () => {
      await repositories.clearPlanner();
    };

    const handleSaveRecipe = async (recipeData) => {
      await repositories.saveRecipe(recipeData);
      setShowRecipeModal(false);
      setEditingRecipe(null);
    };

    const handleDeleteRecipe = async (id) => {
      await repositories.deleteRecipe(id);
      if (selectedBatchRecipe && selectedBatchRecipe.id === id) {
        setSelectedBatchRecipe(null);
      }
    };

    const handleSaveGoals = async (newGoals) => {
      await repositories.saveGoals(newGoals);
    };

    const handleStartBatchCooking = (recipe) => {
      setSelectedBatchRecipe(recipe);
      setBatchStep(0);
      setActiveTab('batch');
    };

    const handleToggleShoppingCheck = (name) => {
      setCheckedShopping((prev) => ({
        ...prev,
        [name]: !prev[name]
      }));
    };

    return (
      <div className={darkMode ? 'dark' : ''}>
        <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 pb-24 md:pb-8">
          {/* Header */}
          <Header
            darkMode={darkMode}
            setDarkMode={setDarkMode}
            colorTheme={colorTheme}
            setColorTheme={setColorTheme}
          />

          {/* Main Layout Container */}
          <main className="max-w-7xl mx-auto px-4 pt-6">
            {/* Desktop Tabs */}
            <Navigation
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              isMobile={false}
            />

            {/* Tab 1: Weekly Planner */}
            {activeTab === 'planner' && (
              <MealPlanner
                daysKeys={DAYS_KEYS}
                plan={plan}
                recipes={recipes}
                goals={goals}
                onAssignMeal={handleAssignMeal}
                onClearWeek={handleClearWeek}
                onCreateRecipe={() => {
                  setEditingRecipe(null);
                  setShowRecipeModal(true);
                }}
              />
            )}

            {/* Tab 2: Recipe Library */}
            {activeTab === 'recipes' && (
              <RecipeLibrary
                recipes={recipes}
                onCreateRecipe={() => {
                  setEditingRecipe(null);
                  setShowRecipeModal(true);
                }}
                onEditRecipe={(rec) => {
                  setEditingRecipe(rec);
                  setShowRecipeModal(true);
                }}
                onDeleteRecipe={handleDeleteRecipe}
                onStartBatchCooking={handleStartBatchCooking}
              />
            )}

            {/* Tab 3: Batch Cooking */}
            {activeTab === 'batch' && (
              <BatchCooking
                recipes={recipes}
                selectedRecipe={selectedBatchRecipe}
                onSelectRecipe={setSelectedBatchRecipe}
                batchStep={batchStep}
                setBatchStep={setBatchStep}
              />
            )}

            {/* Tab 4: Smart Shopping List */}
            {activeTab === 'shopping' && (
              <ShoppingList
                shoppingList={aggregatedShoppingList}
                checkedShopping={checkedShopping}
                onToggleCheck={handleToggleShoppingCheck}
                onUncheckAll={() => setCheckedShopping({})}
              />
            )}

            {/* Tab 5: Macro & Goals Tracker */}
            {activeTab === 'tracker' && (
              <MacroTracker
                goals={goals}
                onSaveGoals={handleSaveGoals}
              />
            )}
          </main>

          {/* Modal Dialog */}
          {showRecipeModal && (
            <RecipeModal
              editingRecipe={editingRecipe}
              onClose={() => {
                setShowRecipeModal(false);
                setEditingRecipe(null);
              }}
              onSave={handleSaveRecipe}
            />
          )}

          {/* Mobile Bottom Navigation */}
          <Navigation
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            isMobile={true}
          />
        </div>
      </div>
    );
  }

  window.MacroChef.App = App;
})();

// Application Bootstrapper & Service Worker Registration
(function () {
  const { App, I18nProvider } = window.MacroChef;

  // Mount React App
  const rootElement = document.getElementById('root');
  if (rootElement && App) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(React.createElement(I18nProvider, null, React.createElement(App)));
  }

  // Register PWA Service Worker for offline capability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('./sw.js')
        .then((reg) => {
          console.log('[MacroChef PWA] Service Worker registered successfully:', reg.scope);
        })
        .catch((err) => {
          console.warn('[MacroChef PWA] Service Worker registration failed:', err);
        });
    });
  }
})();

  </script>
</body>
</html>
