(function () {
  const { createContext, createElement, useCallback, useContext, useEffect, useMemo, useRef, useState } = React;
  const I18nContext = createContext(null);

  function I18nProvider({ children, repository = window.MacroChef.repositories }) {
    const [settings, setSettings] = useState(null);
    const [loadError, setLoadError] = useState(false);
    const [saveError, setSaveError] = useState(false);
    const [saving, setSaving] = useState(false);
    const [attempt, setAttempt] = useState(0);
    const settingsRef = useRef(null);
    const queueRef = useRef(Promise.resolve());
    const versionRef = useRef(0);
    const pendingRef = useRef(false);

    useEffect(() => {
      let active = true;
      let subscription;
      async function load() {
        try {
          const defaults = {
            lang: localStorage.getItem('macrochef_lang') || 'pl',
            darkMode: localStorage.getItem('macrochef_dark') === 'true',
            colorTheme: localStorage.getItem('macrochef_color_theme') || 'emerald'
          };
          const initial = await repository.initializeSettings(defaults);
          if (!active) return;
          settingsRef.current = initial;
          setSettings(initial);
          setLoadError(false);
          subscription = repository.watchSettings().subscribe({
            next(value) {
              if (!active || pendingRef.current) return;
              if (!value) {
                console.error('Settings record is missing');
                setLoadError(true);
                return;
              }
              settingsRef.current = value;
              setSettings(value);
            },
            error(error) {
              console.error('Settings subscription error:', error);
              if (active) setLoadError(true);
            }
          });
        } catch (error) {
          console.error('Settings initialization error:', error);
          if (active) setLoadError(true);
        }
      }
      load();
      return () => {
        active = false;
        if (subscription) subscription.unsubscribe();
      };
    }, [repository, attempt]);

    const saveChanges = useCallback((changes) => {
      const next = { ...settingsRef.current, ...changes };
      settingsRef.current = next;
      setSettings(next);
      setSaveError(false);
      setSaving(true);
      pendingRef.current = true;
      const version = ++versionRef.current;
      queueRef.current = queueRef.current.then(async () => {
        try {
          const saved = await repository.saveSettings(next);
          if (version === versionRef.current) {
            settingsRef.current = saved;
            pendingRef.current = false;
            setSettings(saved);
            setSaving(false);
          }
        } catch (error) {
          console.error('Settings save error:', error);
          if (version === versionRef.current) {
            setSaveError(true);
            setSaving(false);
          }
        }
      });
    }, [repository]);
    const setLang = useCallback((lang) => saveChanges({ lang }), [saveChanges]);
    const setDarkMode = useCallback((darkMode) => saveChanges({ darkMode }), [saveChanges]);
    const setColorTheme = useCallback((colorTheme) => saveChanges({ colorTheme }), [saveChanges]);
    const lang = settings ? settings.lang : 'pl';
    const value = useMemo(() => ({
      lang,
      setLang,
      darkMode: settings && settings.darkMode,
      setDarkMode,
      colorTheme: settings && settings.colorTheme,
      setColorTheme,
      t: window.MacroChef.TRANSLATIONS[lang] || window.MacroChef.TRANSLATIONS.en,
      daysList: window.MacroChef.DAYS_TRANSLATED[lang] || window.MacroChef.DAYS_TRANSLATED.en
    }), [lang, setLang, settings && settings.darkMode, setDarkMode,
      settings && settings.colorTheme, setColorTheme]);

    if (loadError) {
      return createElement('div', { role: 'alert' },
        'Nie udało się wczytać ustawień / Could not load settings. ',
        createElement('button', { type: 'button', onClick: () => setAttempt((n) => n + 1) },
          'Spróbuj ponownie / Retry'));
    }
    if (!settings) return createElement('div', { role: 'status' }, 'Wczytywanie ustawień / Loading settings...');
    return createElement(I18nContext.Provider, { value },
      saving && createElement('div', { role: 'status', className: 'p-3 text-slate-500' },
        value.t.settingsSaving),
      saveError && createElement('div', {
        role: 'alert',
        className: 'p-3 text-red-600 dark:text-red-400'
      }, value.t.settingsSaveError, ' ',
      createElement('button', { type: 'button', className: 'underline', onClick: () => saveChanges({}) },
        value.t.retry)),
      children);
  }

  function useI18n() {
    const value = useContext(I18nContext);
    if (!value) throw new Error('useI18n must be used within I18nProvider');
    return value;
  }

  window.MacroChef.I18nProvider = I18nProvider;
  window.MacroChef.useI18n = useI18n;
})();

  getLocalized(val, lang = 'en') {
    if (!val) return '';
    if (typeof val === 'object' && val !== null) {
      return val[lang] || val.en || Object.values(val)[0] || '';

    return String(val);
  },

  toPascalCase(str) {
    if (!str) return '';
    return str
      .split('-')
      .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
      .join('');
  }
};

(function () {
const macroCalculations = {
  calculateBasalCalories(goals) {
    const age = Number(goals.age);
    const weight = Number(goals.weight);
    const height = Number(goals.height);
    if (!Number.isFinite(age) || age < 18 || age > 120 ||
        !Number.isFinite(weight) || weight <= 0 || weight > 500 ||
        !Number.isFinite(height) || height < 50 || height > 300 ||
        (goals.sex !== 'female' && goals.sex !== 'male')) {
      return null;
    }
    return 10 * weight + 6.25 * height - 5 * age + (goals.sex === 'female' ? -161 : 5);
  },

  calculateMaintenanceCalories(goals) {
    const basal = macroCalculations.calculateBasalCalories(goals);
    const activity = String(goals.activityPal);
    if (basal === null || !['1.25', '1.45', '1.65', '1.85', '2.2'].includes(activity)) {
      return null;
    }
    return Math.round(basal * Number(activity));
  },

  calculateRecommendedCalories(cpm, userGoal, goals) {
    if (cpm === null) return null;
    const adjustments = { weightLoss: -500, muscleGain: 300, maintenance: 0, healthyHabits: 0 };
    let minimum = 500;
    if (userGoal === 'weightLoss') {
      if (!goals) throw new TypeError('A valid profile is required for a weight-loss recommendation');
      const basal = macroCalculations.calculateBasalCalories(goals);
      if (basal === null) throw new TypeError('A valid profile is required for a weight-loss recommendation');
      minimum = Math.max(minimum, Math.ceil(basal));
    }
    return Math.max(minimum, cpm + (adjustments[userGoal] || 0));
  },

  getDailyTotals(dayKey, plan, recipes) {
    const dayPlan = (plan && plan[dayKey]) || {};
    const totals = { calories: 0, protein: 0, carbs: 0, fats: 0 };

    Object.values(dayPlan).forEach((recipeId) => {
      if (!recipeId) return;
      const rec = (recipes || []).find((r) => r.id === recipeId);
      if (rec) {
        totals.calories += Number(rec.calories) || 0;
        totals.protein += Number(rec.protein) || 0;
        totals.carbs += Number(rec.carbs) || 0;
        totals.fats += Number(rec.fats) || 0;
      }
    });

    return totals;
  },

  calculateMacrosForGoal(goals, cpm) {
    const calories = Number(goals.calories) || 2000;
    const weight = Number(goals.weight) || 70;
    const sex = goals.sex || 'male';
    const userGoal = goals.userGoal || '';

    let protein = 0;
    let fats = 0;
    let carbs = 0;

    if (userGoal === 'weightLoss') {
      // Weight loss: protein 2g/kg, fats 30% of calories, carbs fill remainder
      protein = Math.round(weight * 2);
      fats = Math.round((calories * 0.30) / 9);
      
      // Safety check for women: minimum 0.8g/kg
      if (sex === 'female' && fats < weight * 0.8) {
        fats = Math.round(weight * 0.8);
      }
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else if (userGoal === 'maintenance') {
      // Maintenance: protein 1.6-1.8g/kg (use 1.7), fats 30%, carbs fill remainder
      protein = Math.round(weight * 1.7);
      fats = Math.round((calories * 0.30) / 9);
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else if (userGoal === 'muscleGain') {

      protein = Math.round(weight * 1.8);
      fats = Math.round((calories * 0.22) / 9);
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else {

      protein = Number(goals.protein) || 0;
      carbs = Number(goals.carbs) || 0;
      fats = Number(goals.fats) || 0;

    // Adjust carbs for rounding without producing negative grams.
    const calculatedCalories = protein * 4 + carbs * 4 + fats * 9;
    if (calculatedCalories !== calories && userGoal !== 'healthyHabits') {

      carbs = calculated.carbs;
      fats = calculated.fats;

    const carbsKcal = carbs * 4;
    const fatsKcal = fats * 9;

      carbs,
      fats,
      proteinKcal,
      carbsKcal,
      fatsKcal,
      proteinPercent: calories > 0 ? Math.round((proteinKcal / calories) * 100) : 0,
      carbsPercent: calories > 0 ? Math.round((carbsKcal / calories) * 100) : 0,

// Aggregation engine for whole-package shopping lists & food waste reduction
window.MacroChef = window.MacroChef || {};

window.MacroChef.shoppingAggregator = {
  getRecipePlanCounts(plan) {
    const counts = {};
    if (!plan) return counts;
    Object.values(plan).forEach((dayMeals) => {
      if (!dayMeals) return;
      Object.values(dayMeals).forEach((recipeId) => {
        if (recipeId) {
          counts[recipeId] = (counts[recipeId] || 0) + 1;
        }
      });
    });
    return counts;
  },

  calculateShoppingList(plan, recipes, lang) {
    const { getLocalized } = window.MacroChef.helpers;
    const recipePlanCounts = this.getRecipePlanCounts(plan);
    const map = {};

    Object.entries(recipePlanCounts).forEach(([recipeId, timesPlanned]) => {
      const rec = (recipes || []).find((r) => r.id === recipeId);
      if (!rec || !rec.ingredients) return;

      const scaleFactor = timesPlanned / (rec.servings || 1);

      rec.ingredients.forEach((ing) => {
        const ingName = getLocalized(ing.name, lang);
        const key = ingName.toLowerCase().trim();
        const requiredAmount = (Number(ing.amount) || 0) * scaleFactor;
        const pkgSize = Number(ing.packageSize) || Number(ing.amount) || 1;

        if (!map[key]) {
          map[key] = {
            name: ingName,
            totalRequired: 0,
            unit: ing.unit || 'g',
            packageSize: pkgSize,
            packageUnit: ing.packageUnit || ing.unit || 'g',
            recipesUsedIn: new Set()
          };
        }

        map[key].totalRequired += requiredAmount;
        map[key].recipesUsedIn.add(getLocalized(rec.name, lang));
      });
    });

    return Object.values(map).map((item) => {
      const packagesNeeded = Math.ceil(item.totalRequired / item.packageSize) || 1;
      const totalBoughtAmount = packagesNeeded * item.packageSize;
      const leftoverAmount = Math.max(0, totalBoughtAmount - item.totalRequired);

      return {
        ...item,
        packagesNeeded,
        totalBoughtAmount,
        leftoverAmount,
        recipesUsedIn: Array.from(item.recipesUsedIn)
      };
    });
  }
};

// File: auth.js
// ==========================================
window.MacroChef = window.MacroChef || {};

(function () {
  const client = window.MacroChef.supabaseClient;
  const cacheKey = 'macrochef-verified-session';
  const sessionKey = 'macrochef-supabase-session';
  const logoutKey = 'macrochef-local-signout';
  const roles = ['Admin', 'Tester', 'UserWithAdvertisement'];
  const listeners = new Set();
  let generation = 0;
  let autoRefreshStopped = false;

  async function stopRefresh() {
    autoRefreshStopped = true;
    await client.auth.stopAutoRefresh();
  }

  async function resumeRefresh() {
    if (!autoRefreshStopped) return;
    await client.auth.startAutoRefresh();
    autoRefreshStopped = false;
  }

  function reportRefreshError(error) {
    console.error('Supabase session refresh configuration failed:', error);
  }

  function notify(event = 'refresh') {
    listeners.forEach((listener) => listener(event));
  }

  function readCache() {
    const raw = localStorage.getItem(cacheKey);
    if (!raw) return null;
    let value;
    try {
      value = JSON.parse(raw);
    } catch (error) {
      throw new Error('Invalid cached account data', { cause: error });
    }
    if (!value || typeof value.userId !== 'string' || typeof value.email !== 'string' ||
        value.issuer !== client.supabaseUrl || value.tenantId !== client.supabaseUrl ||
        !roles.includes(value.role)) {
      throw new Error('Invalid cached account data');
    }
    return value;
  }

  async function getSessionAndRole() {
    if (!client) return null;
    if (localStorage.getItem(logoutKey)) return null;
    if (navigator.onLine === false) {
      const cached = readCache();
      return cached ? { ...cached, offline: true } : null;
    }
    const started = generation;
    const { data: sessionData, error: sessionError } = await client.auth.getSession();
    if (sessionError) throw sessionError;
    if (started !== generation) throw new Error('Session changed during verification');
    if (!sessionData.session) {
      if (started === generation) localStorage.removeItem(cacheKey);
      return null;
    }
    const { data: userData, error: userError } = await client.auth.getUser();
    if (userError) {
      if (started === generation && (userError.status === 401 || userError.status === 403)) {
        localStorage.removeItem(cacheKey);
        return null;
      }
      throw userError;
    }
    if (!userData.user || !userData.user.id || !userData.user.email) {
      throw new Error('Verified user is missing an ID or email');
    }
    const { data: profile, error: profileError } = await client.from('user_profiles')
      .select('role').eq('user_id', userData.user.id).single();
    if (profileError) throw profileError;
    if (!profile || !roles.includes(profile.role)) throw new Error('Invalid account role');
    if (started !== generation) throw new Error('Session changed during verification');
    const result = {
      userId: userData.user.id,
      email: userData.user.email,
      role: profile.role,
      issuer: client.supabaseUrl,
      tenantId: client.supabaseUrl
    };
    localStorage.setItem(cacheKey, JSON.stringify(result));
    return { ...result, offline: false };
  }

  function requireClient() {
    if (!client) throw new Error('Online accounts are unavailable');
    if (navigator.onLine === false) throw new Error('Internet connection required');
  }

  async function signUp(email, password) {
    requireClient();
    const { data, error } = await client.auth.signUp({ email, password });
    if (error) throw error;
    if (data.session) {
      localStorage.removeItem(logoutKey);
      await resumeRefresh();
      await getSessionAndRole();
      notify();
    }
    return data;
  }

  async function signIn(email, password) {
    requireClient();
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    localStorage.removeItem(logoutKey);
    await resumeRefresh();
    await getSessionAndRole();
    notify();
    return data;
  }

  async function signOut() {
    if (!client) return;
    if (navigator.onLine === false) {
      await stopRefresh();
      localStorage.removeItem(sessionKey);
      localStorage.removeItem(`${sessionKey}-code-verifier`);
    } else {
      const { error } = await client.auth.signOut({ scope: 'local' });
      if (error) throw error;
    }
    generation++;
    localStorage.setItem(logoutKey, '1');
    localStorage.removeItem(cacheKey);
    notify('changing');
    notify();
  }

  function subscribe(listener) {
    listeners.add(listener);
    return () => listeners.delete(listener);
  }

  if (client) {
    if (localStorage.getItem(logoutKey)) stopRefresh().catch(reportRefreshError);
    client.auth.onAuthStateChange((event) => {
      if (event === 'INITIAL_SESSION') return;
      if (event === 'SIGNED_OUT' && navigator.onLine === false) return;
      if (event === 'TOKEN_REFRESHED') return;
      generation++;
      if (event === 'SIGNED_OUT') {
        localStorage.setItem(logoutKey, '1');
        localStorage.removeItem(cacheKey);
        stopRefresh().catch(reportRefreshError);
      }
      notify('changing');
      window.setTimeout(notify, 0);
    });
    window.addEventListener('online', () => {
      if (!localStorage.getItem(logoutKey)) resumeRefresh().catch(reportRefreshError);
      notify();
    });
    window.addEventListener('storage', (event) => {
      if (event.key === cacheKey || event.key === sessionKey || event.key === logoutKey) {
        generation++;
        if ((event.key === sessionKey && event.newValue === null) ||
            (event.key === logoutKey && event.newValue)) {
          stopRefresh().catch(reportRefreshError);
          localStorage.removeItem(cacheKey);
        }
        if (event.key === logoutKey && event.newValue === null && navigator.onLine !== false) {
          resumeRefresh().catch(reportRefreshError);
        }
        notify('changing');
        notify();
      }
    });
  }

  window.MacroChef.auth = { signUp, signIn, signOut, getSessionAndRole, subscribe };
})();

            for (const recipe of data.recipes) {
              const copied = { ...recipe, id: createId('rec') };

      ];
      await this.mutations.transaction([this.db.plannerEntries], async ({ put, update, delete: remove }) => {
        const existing = await this.db.plannerEntries.toArray();

window.MacroChef = window.MacroChef || {};

(function () {
  function validateScope(scope) {
    if (!scope || typeof scope !== 'object') throw new TypeError('Account scope is required');
    ['issuer', 'tenantId', 'userId'].forEach((key) => {
      if (typeof scope[key] !== 'string' || !scope[key].trim()) {
        throw new TypeError(`Account scope ${key} must be a non-empty string`);
      }
    });
  }

  async function createScopedRepository(scope) {
    validateScope(scope);
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error('Web Crypto is required to derive an account database name');
    }
    const identity = JSON.stringify([scope.issuer, scope.tenantId, scope.userId]);
    const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(identity));
    const suffix = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
    const databaseName = `MacroChef-account-${suffix}`;
    return {
      repository: new window.MacroChef.DexieCalorieRepository(databaseName, {
        seedDefaults: false, userId: scope.userId, role: scope.role
      }),
      shoppingStorageKey: `macrochef_checked_${suffix}`
    };
  }

  window.MacroChef.createScopedRepository = createScopedRepository;
})();

            await db.SyncState.delete(state.id);

          for (const row of rows) {
            this.checkActive();
            if (queued.some((item) => item.table === table && item.payload.id === row.id)) continue;
            const value = fromRemote(table, row);
            if (table === 'plannerEntries' && slots.some((slot) =>
              value[slot] && !remote.recipes.some((recipe) => recipe.id === value[slot]))) {
              conflicts.push(`Server plan references unavailable recipes: ${value.dayKey}`);
              continue;
            }
            if (table === 'plannerEntries' || table === 'goals') {
              const others = table === 'plannerEntries'
                ? await db.plannerEntries.where('dayKey').equals(value.dayKey).toArray()
                : await db.goals.toArray();
              if (others.some((item) => item.id !== row.id)) {
                conflicts.push(`Local and server records differ: ${table}/${row.id}`);
                continue;
              }
            }
            const existing = await db.table(table).get(row.id);
            const state = await db.SyncState.get(`${table}:${row.id}`);
            if (existing && !state && !same(existing, value)) {
              conflicts.push(`Local record has no server baseline: ${table}/${row.id}`);
              continue;
            }
            await db.table(table).put(value);
            await db.SyncState.put({ id: `${table}:${row.id}`, table, recordId: row.id, updatedAt: row.updated_at });
          }
        }
      });
    }
  }

  window.MacroChef.AppSyncManager = AppSyncManager;
})();

// React 18 external-store hook for Dexie liveQuery observables
window.MacroChef = window.MacroChef || {};

(function () {
  const createExternalStore = (observable, initialData) => {
    let snapshot = { data: initialData, loading: true, error: null };
    let subscription = null;
    const listeners = new Set();

    const notify = () => {
      listeners.forEach((listener) => listener());
    };

    return {
      getSnapshot() {
        return snapshot;
      },

      subscribe(listener) {
        listeners.add(listener);
        if (!subscription) {
          try {
            subscription = observable.subscribe({
              next(data) {
                snapshot = { data, loading: false, error: null };
                notify();
              },
              error(error) {
                snapshot = { ...snapshot, loading: false, error };
                notify();
              }
            });
          } catch (error) {
            snapshot = { ...snapshot, loading: false, error };
            notify();
          }
        }

        return () => {
          listeners.delete(listener);
          if (listeners.size === 0 && subscription) {
            subscription.unsubscribe();
            subscription = null;
          }
        };
      }
    };
  };

  const useRepositoryQuery = (createObservable, dependencies, initialData) => {
    const observable = React.useMemo(createObservable, dependencies);
    const store = React.useMemo(
      () => createExternalStore(observable, initialData),
      [observable, initialData]
    );
    return React.useSyncExternalStore(store.subscribe, store.getSnapshot, store.getSnapshot);
  };

  window.MacroChef.useRepositoryQuery = useRepositoryQuery;
})();

// Safe, reliable Lucide Icon React component
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  function Icon({ name, className = 'w-4 h-4', ...props }) {
    const spanRef = React.useRef(null);

    React.useEffect(() => {
      if (!spanRef.current) return;

      if (window.lucide && window.lucide.icons) {
        const { toPascalCase } = window.MacroChef.helpers;
        const pascalName = toPascalCase(name);
        const iconDef = window.lucide.icons[pascalName] || window.lucide.icons[name];

        if (iconDef && typeof iconDef.toSvg === 'function') {
          spanRef.current.innerHTML = iconDef.toSvg({ class: className });
          return;
        }
      }

      // Fallback with isolated createIcons root
      spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons({ root: spanRef.current });
      }
    }, [name, className]);

    return (
      <span
        ref={spanRef}
        className="inline-flex items-center justify-center shrink-0 pointer-events-none"
        {...props}
      />
    );
  }

  window.MacroChef.components.Icon = Icon;
})();

window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  function AuthModal({ session, onClose }) {
    const { t } = window.MacroChef.useI18n();
    const [register, setRegister] = React.useState(false);
    const [email, setEmail] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [error, setError] = React.useState('');
    const [message, setMessage] = React.useState('');
    const [busy, setBusy] = React.useState(false);

    async function submit(event) {
      event.preventDefault();
      setBusy(true);
      setError('');
      setMessage('');
      try {
        const result = register
          ? await window.MacroChef.auth.signUp(email.trim(), password)
          : await window.MacroChef.auth.signIn(email.trim(), password);
        setPassword('');
        if (register && !result.session) setMessage(t.authConfirmEmail);
      } catch (err) {
        console.error('Authentication failed:', err);
        if (!window.MacroChef.supabaseClient) setError(t.authUnavailable);
        else if (navigator.onLine === false) setError(t.authOfflineError);
        else if (err.code === 'invalid_credentials') setError(t.authInvalidCredentials);
        else if (err.code === 'user_already_exists') setError(t.authAlreadyRegistered);
        else if (err.code === 'email_not_confirmed') setError(t.authConfirmEmail);
        else setError(t.authError);
      } finally {
        setBusy(false);
      }
    }

    async function signOut() {
      setBusy(true);
      setError('');
      try {
        await window.MacroChef.auth.signOut();
      } catch (err) {
        console.error('Sign-out failed:', err);
        setError(t.authSignOutError);
        setBusy(false);
      }
    }

    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div role="dialog" aria-modal="true" aria-labelledby="auth-title" className="w-full max-w-md rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-xl">
          <div className="flex items-center justify-between mb-4">
            <h2 id="auth-title" className="text-xl font-bold">{t.authTitle}</h2>
            <button type="button" onClick={onClose} aria-label={t.authClose}>✕</button>
          </div>
          {session ? (
            <div className="space-y-4">
              <p>{t.authEmail}: {session.email}</p>
              <p>{t.authRole}: {t[`authRole${session.role}`]}</p>
              {session.offline && <p role="status">{t.authOfflineSession}</p>}
              <button type="button" disabled={busy} onClick={signOut} className="rounded-lg bg-emerald-600 px-4 py-2 text-white disabled:opacity-50">{t.authSignOut}</button>
            </div>
          ) : (
            <form onSubmit={submit} className="space-y-4">
              <label className="block">{t.authEmail}
                <input className="block w-full rounded-lg border p-2 text-slate-900" type="email" autoComplete="email" required value={email} onChange={(event) => setEmail(event.target.value)} />
              </label>
              <label className="block">{t.authPassword}
                <input className="block w-full rounded-lg border p-2 text-slate-900" type="password" autoComplete={register ? 'new-password' : 'current-password'} minLength="6" required value={password} onChange={(event) => setPassword(event.target.value)} />
              </label>
              <button type="submit" disabled={busy} className="rounded-lg bg-emerald-600 px-4 py-2 text-white disabled:opacity-50">{register ? t.authSignUp : t.authSignIn}</button>
              <button type="button" disabled={busy} className="block underline" onClick={() => { setRegister(!register); setError(''); setMessage(''); }}>
                {register ? t.authSwitchSignIn : t.authSwitchSignUp}
              </button>
            </form>
          )}
          {error && <p role="alert" className="mt-4 text-red-600">{error}</p>}
          {message && <p role="status" className="mt-4">{message}</p>}
        </div>
      </div>
    );
  }

  window.MacroChef.components.AuthModal = AuthModal;
})();

// Recipe Picker Modal Component for selecting recipes from the library into the meal schedule
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { Icon } = window.MacroChef.components;
  const { getLocalized } = window.MacroChef.helpers;

  function matchesCategory(recipeCat, targetCatKey) {
    if (!targetCatKey || targetCatKey === 'all') return true;
    if (!recipeCat) return false;
    const enVal = (typeof recipeCat === 'object' ? recipeCat.en : recipeCat) || '';
    const plVal = (typeof recipeCat === 'object' ? recipeCat.pl : recipeCat) || '';
    const targetLower = targetCatKey.toLowerCase();
    return (
      enVal.toLowerCase() === targetLower ||
      plVal.toLowerCase() === targetLower ||
      (targetLower === 'breakfast' && (enVal.toLowerCase().includes('breakfast') || plVal.toLowerCase().includes('śniadanie') || plVal.toLowerCase().includes('sniadanie'))) ||
      (targetLower === 'lunch' && (enVal.toLowerCase().includes('lunch') || plVal.toLowerCase().includes('obiad'))) ||
      (targetLower === 'dinner' && (enVal.toLowerCase().includes('dinner') || plVal.toLowerCase().includes('kolacja'))) ||
      (targetLower === 'snack' && (enVal.toLowerCase().includes('snack') || plVal.toLowerCase().includes('przekąska') || plVal.toLowerCase().includes('przekaska')))
    );
  }

  function RecipePickerModal({
    slotInfo,
    recipes,
    onSelectRecipe,
    onClearSlot,
    onClose,
    onCreateRecipe
  }) {
    const { t, lang } = window.MacroChef.useI18n();
    // Categories list for tabs
    const categoryOptions = [
      { key: 'all', label: t.allCategories || 'Wszystkie' },
      { key: 'Breakfast', label: t.breakfast || 'Śniadanie' },
      { key: 'Lunch', label: t.lunch || 'Obiad' },
      { key: 'Dinner', label: t.dinner || 'Kolacja' },
      { key: 'Snack', label: t.snack || 'Przekąska' }
    ];

    // Determine initial category based on slot
    const [selectedCategory, setSelectedCategory] = React.useState(() => {
      if (slotInfo && slotInfo.slotKey) {
        const hasMatching = recipes.some((r) => matchesCategory(r.category, slotInfo.slotKey));
        if (hasMatching) {
          return slotInfo.slotKey;
        }
      }
      return 'all';
    });

    const [searchQuery, setSearchQuery] = React.useState('');

    // Close on Escape key
    React.useEffect(() => {
      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          onClose();
        }
      };
      window.addEventListener('keydown', handleKeyDown);
      return () => window.removeEventListener('keydown', handleKeyDown);
    }, [onClose]);

    // Filter recipes
    const filteredRecipes = React.useMemo(() => {
      return (recipes || []).filter((rec) => {
        // Category check
        if (!matchesCategory(rec.category, selectedCategory)) {
          return false;
        }

        // Search check
        if (searchQuery.trim()) {
          const query = searchQuery.toLowerCase().trim();
          const nameEn = (typeof rec.name === 'object' ? rec.name.en : rec.name) || '';
          const namePl = (typeof rec.name === 'object' ? rec.name.pl : rec.name) || '';
          const categoryName = getLocalized(rec.category, lang).toLowerCase();

          const matchesName = nameEn.toLowerCase().includes(query) || namePl.toLowerCase().includes(query) || categoryName.includes(query);
          
          const matchesIngredients = (rec.ingredients || []).some((ing) => {
            const ingEn = (typeof ing.name === 'object' ? ing.name.en : ing.name) || '';
            const ingPl = (typeof ing.name === 'object' ? ing.name.pl : ing.name) || '';
            return ingEn.toLowerCase().includes(query) || ingPl.toLowerCase().includes(query);
          });

          return matchesName || matchesIngredients;
        }

        return true;
      });
    }, [recipes, selectedCategory, searchQuery, lang]);

    // Count per category
    const categoryCounts = React.useMemo(() => {
      const counts = { all: (recipes || []).length };
      categoryOptions.forEach((cat) => {
        if (cat.key !== 'all') {
          counts[cat.key] = (recipes || []).filter((r) => matchesCategory(r.category, cat.key)).length;
        }
      });
      return counts;
    }, [recipes]);

    return (
      <div
        className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-slate-900/60 backdrop-blur-sm animate-fade-in"
        onClick={(e) => {
          if (e.target === e.currentTarget) onClose();
        }}
      >
        <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
          {/* Header */}
          <div className="p-5 sm:p-6 border-b border-slate-100 dark:border-slate-700/80 flex items-start justify-between gap-4 bg-slate-50/50 dark:bg-slate-800/50">
            <div className="flex items-start gap-3.5">
              <div className="w-10 h-10 rounded-2xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0 mt-0.5">
                <Icon name="book-open" className="w-5 h-5" />
              </div>
              <div>
                <h2 className="text-lg sm:text-xl font-bold text-slate-900 dark:text-white flex flex-wrap items-center gap-2">
                  <span>{t.selectRecipeFor || 'Wybierz przepis dla:'}</span>
                  <span className="text-emerald-600 dark:text-emerald-400 font-extrabold">
                    {slotInfo.dayName} – {slotInfo.slotLabel}
                  </span>
                </h2>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  {t.selectRecipeSub || 'Przeglądaj bibliotekę przepisów i wybierz posiłek dla tego slotu.'}
                </p>
              </div>
            </div>

            <button
              onClick={onClose}
              className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60 rounded-xl transition-colors"
              title={t.cancel || 'Zamknij'}
            >
              <Icon name="x" className="w-5 h-5" />
            </button>
          </div>

          {/* Search & Categories Bar */}
          <div className="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-700/60 space-y-3 bg-white dark:bg-slate-800">
            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
              <div className="relative flex-1">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                  <Icon name="search" className="w-4 h-4" />
                </div>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder={t.searchRecipesPlaceholder || 'Szukaj po nazwie lub składnikach...'}
                  className="w-full pl-10 pr-4 py-2 text-xs sm:text-sm bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:text-slate-100 placeholder-slate-400"
                  autoFocus
                />
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery('')}
                    className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>

              {onCreateRecipe && (
                <button
                  type="button"
                  onClick={() => {
                    onClose();
                    onCreateRecipe();
                  }}
                  className="flex items-center justify-center gap-1.5 px-4 py-2 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 rounded-xl text-xs font-semibold transition-colors shrink-0"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>{t.createRecipe || '+ Nowy przepis'}</span>
                </button>
              )}
            </div>

            {/* Category Filter Pills */}
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
              {categoryOptions.map((cat) => {
                const isActive = selectedCategory === cat.key;
                const count = categoryCounts[cat.key] || 0;
                return (
                  <button
                    key={cat.key}
                    type="button"
                    onClick={() => setSelectedCategory(cat.key)}
                    className={`px-3 py-1.5 rounded-xl font-medium transition-all whitespace-nowrap flex items-center gap-1.5 ${
                      isActive
                        ? 'bg-emerald-500 text-white shadow-sm shadow-emerald-500/30'

                    }`}
                  >
                    <span>{cat.label}</span>
                    <span
                      className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                        isActive
                          ? 'bg-emerald-600 text-emerald-100'
                          : 'bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-300'
                      }`}
                    >
                      {count}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Recipe List / Grid */}
          <div className="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-50/50 dark:bg-slate-900/20">
            {filteredRecipes.length === 0 ? (
              <div className="text-center py-12 px-4">
                <div className="w-14 h-14 mx-auto mb-3 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400">

                <p className="text-xs text-slate-400 mb-4 max-w-sm mx-auto">

                <button

// Recipe Library Tab Component
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { Icon } = window.MacroChef.components;
  const { getLocalized } = window.MacroChef.helpers;

  const normalizeHeader = (value) => value
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');

  const parseCsvRows = (text) => {
    let delimiter;
    const separatorLine = text.match(/^sep=(,|;|\t)\r?\n/i);
    if (separatorLine) {
      delimiter = separatorLine[1];
      text = text.slice(separatorLine[0].length);
    } else {
      const firstLine = text.split(/\r?\n/, 1)[0] || '';
      delimiter = [',', ';', '\t'].reduce((selected, candidate) => {
        const count = (firstLine.match(new RegExp(candidate === '\t' ? '\\t' : `\\${candidate}`, 'g')) || []).length;
        const selectedCount = (firstLine.match(new RegExp(selected === '\t' ? '\\t' : `\\${selected}`, 'g')) || []).length;
        return count > selectedCount ? candidate : selected;
      }, ',');
    }

    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i += 1) {
      const character = text[i];
      if (inQuotes) {
        if (character === '"' && text[i + 1] === '"') {
          field += '"';
          i += 1;
        } else if (character === '"') {
          inQuotes = false;
        } else {
          field += character;
        }
      } else if (character === '"' && field.length === 0) {
        inQuotes = true;
      } else if (character === delimiter) {
        row.push(field);
        field = '';
      } else if (character === '\n' || character === '\r') {
        if (character === '\r' && text[i + 1] === '\n') i += 1;
        row.push(field);
        if (row.some((cell) => cell.trim())) rows.push(row);
        row = [];
        field = '';
      } else {
        field += character;
      }
    }
    if (inQuotes) throw new Error('The CSV file contains an unclosed quoted field.');
    row.push(field);
    if (row.some((cell) => cell.trim())) rows.push(row);
    return rows;
  };

  const parseRecipeCsv = (text) => {
    const rows = parseCsvRows(text.replace(/^\uFEFF/, ''));
    if (rows.length < 2) throw new Error('The CSV file must contain a header and at least one recipe.');

    const fields = {
      name: ['name', 'nazwa'],
      category: ['category', 'kategoria'],
      prepTime: ['preptime', 'preparationtime', 'czasprzygotowania'],
      servings: ['servings', 'portions', 'porcje', 'liczbaporcji'],
      calories: ['calories', 'kcal', 'kalorie', 'caloriesperserving', 'kalorienaporcje'],
      protein: ['protein', 'bialko', 'proteinperserving', 'bialkonaporcje'],
      carbs: ['carbs', 'carbohydrates', 'weglowodany', 'carbsperserving', 'weglowodanynaporcje'],
      fats: ['fats', 'fat', 'tluszcze', 'fatsperserving', 'tluszczenaporcje'],
      steps: ['steps', 'instructions', 'kroki']
    };
    const headerIndexes = new Map();
    const ingredientColumns = new Map();
    rows[0].forEach((header, index) => {
      const normalized = normalizeHeader(header);
      let field = Object.keys(fields).find((key) => fields[key].includes(normalized));
      const englishIngredient = normalized.match(/^ingredient(\d+)(name|amount|unit|packagesize|packageunit)$/);
      const polishIngredient = normalized.match(/^skladnik(\d+)(nazwa|ilosc|jednostka|rozmiaropakowania|jednostkaopakowania)$/);
      const match = englishIngredient || polishIngredient;
      if (match) {
        const ingredientField = englishIngredient
          ? { name: 'name', amount: 'amount', unit: 'unit', packagesize: 'packageSize', packageunit: 'packageUnit' }[match[2]]
          : { nazwa: 'name', ilosc: 'amount', jednostka: 'unit', rozmiaropakowania: 'packageSize', jednostkaopakowania: 'packageUnit' }[match[2]];
        const key = `${match[1]}-${ingredientField}`;
        if (ingredientColumns.has(key)) throw new Error(`Duplicate CSV column: ${header}`);
        ingredientColumns.set(key, index);
      } else if (field) {
        if (headerIndexes.has(field)) throw new Error(`Duplicate CSV column: ${header}`);
        headerIndexes.set(field, index);
      }
    });

    const requiredFields = ['name', 'category', 'prepTime', 'servings', 'calories', 'protein', 'carbs', 'fats', 'steps'];
    const missingFields = requiredFields.filter((field) => !headerIndexes.has(field));
    if (missingFields.length) {
      throw new Error(`Missing required CSV columns: ${missingFields.join(', ')}.`);
    }
    if (![...ingredientColumns.keys()].some((key) => key.endsWith('-name'))) {
      throw new Error('Add ingredient columns such as ingredient1Name, ingredient1Amount, and ingredient1Unit.');
    }

    const cell = (row, key) => {
      const index = headerIndexes.get(key);
      return index === undefined ? '' : (row[index] || '').trim();
    };
    const numberCell = (value, label, rowNumber, minimum = 0) => {
      const normalized = value.includes(',') && !value.includes('.')
        ? value.replace(',', '.')
        : value;
      const number = Number(normalized);
      if (!value || !Number.isFinite(number) || number < minimum) {
        throw new Error(`Row ${rowNumber}: "${label}" must be a number${minimum ? ` greater than or equal to ${minimum}` : ''}.`);
      }
      return number;
    };
    const categories = {
      breakfast: { en: 'Breakfast', pl: 'Śniadanie' },
      sniadanie: { en: 'Breakfast', pl: 'Śniadanie' },
      lunch: { en: 'Lunch', pl: 'Obiad' },
      obiad: { en: 'Lunch', pl: 'Obiad' },
      dinner: { en: 'Dinner', pl: 'Kolacja' },
      kolacja: { en: 'Dinner', pl: 'Kolacja' },
      snack: { en: 'Snack', pl: 'Przekąska' },
      przekaska: { en: 'Snack', pl: 'Przekąska' }
    };
    const unitValue = (value, label, rowNumber) => {
      const normalized = normalizeHeader(value);
      const unit = { g: 'g', ml: 'ml', pcs: 'pcs', szt: 'pcs', porcja: 'porcja', portion: 'porcja' }[normalized];
      if (!unit) throw new Error(`Row ${rowNumber}: "${label}" must be g, ml, pcs, or porcja.`);
      return unit;
    };

    return rows.slice(1).map((row, rowIndex) => {
      const rowNumber = rowIndex + 2;
      if (row.length > rows[0].length && row.slice(rows[0].length).some((value) => value.trim())) {
        throw new Error(`Row ${rowNumber}: there are more values than CSV headers.`);
      }
      if (row.length < rows[0].length) row.length = rows[0].length;

      const name = cell(row, 'name');
      if (!name) throw new Error(`Row ${rowNumber}: recipe name is required.`);
      const categoryKey = normalizeHeader(cell(row, 'category'));
      const category = categories[categoryKey];
      if (!category) {
        throw new Error(`Row ${rowNumber}: category must be Breakfast, Lunch, Dinner, or Snack.`);
      }
      const ingredients = [];
      const ingredientNumbers = [...new Set(
        [...ingredientColumns.keys()].map((key) => key.split('-')[0])
      )].sort((a, b) => Number(a) - Number(b));
      ingredientNumbers.forEach((ingredientNumber) => {
        const getIngredientCell = (field) => {
          const index = ingredientColumns.get(`${ingredientNumber}-${field}`);
          return index === undefined ? '' : (row[index] || '').trim();
        };
        const ingredientName = getIngredientCell('name');
        const ingredientAmount = getIngredientCell('amount');
        const ingredientUnitValue = getIngredientCell('unit');
        const packageSize = getIngredientCell('packageSize');
        const packageUnitValue = getIngredientCell('packageUnit');
        if (!ingredientName) {
          if ([ingredientAmount, ingredientUnitValue, packageSize, packageUnitValue].some(Boolean)) {
            throw new Error(`Row ${rowNumber}: ingredient ${ingredientNumber} needs a name.`);
          }
          return;
        }
        if (!ingredientUnitValue || !packageUnitValue) {
          throw new Error(`Row ${rowNumber}: ingredient ${ingredientNumber} needs both unit and package unit.`);
        }
        const ingredientUnit = unitValue(ingredientUnitValue, `ingredient ${ingredientNumber} unit`, rowNumber);
        const packageUnit = unitValue(packageUnitValue, `ingredient ${ingredientNumber} package unit`, rowNumber);
        if (packageUnit !== ingredientUnit) {
          throw new Error(`Row ${rowNumber}: ingredient ${ingredientNumber} package unit must match its unit.`);
        }
        const amount = numberCell(ingredientAmount, `ingredient ${ingredientNumber} amount`, rowNumber);
        ingredients.push({
          name: { en: ingredientName, pl: ingredientName },
          amount,
          unit: ingredientUnit,
          packageSize: numberCell(packageSize, `ingredient ${ingredientNumber} package size`, rowNumber),
          packageUnit: ingredientUnit
        });
      });
      if (ingredients.length === 0) {
        throw new Error(`Row ${rowNumber}: add at least one ingredient.`);
      }

      const stepsText = cell(row, 'steps');
      const steps = stepsText
        ? stepsText.split(/\|[\s]*|\r?\n/).map((step) => step.trim()).filter(Boolean)
        : [];
      if (steps.length === 0) throw new Error(`Row ${rowNumber}: add at least one cooking step.`);
      return {
        name: { en: name, pl: name },
        category,
        prepTime: cell(row, 'prepTime'),
        servings: numberCell(cell(row, 'servings'), 'servings', rowNumber, 1),
        calories: numberCell(cell(row, 'calories'), 'calories', rowNumber),
        protein: numberCell(cell(row, 'protein'), 'protein', rowNumber),
        carbs: numberCell(cell(row, 'carbs'), 'carbs', rowNumber),
        fats: numberCell(cell(row, 'fats'), 'fats', rowNumber),
        ingredients,
        steps: { en: steps, pl: steps }
      };
    });
  };
  window.MacroChef.recipeCsv.parse = parseRecipeCsv;

      ? getLocalized(selectedRecipe.steps, lang) || []
      : [];
    const totalSteps = stepsList.length || 1;

      100,

    );

      <div className="space-y-6 max-w-4xl mx-auto">

// Main MacroChef React Application Controller
window.MacroChef = window.MacroChef || {};

(function () {
  const { useState, useEffect, useMemo, useRef } = React;
  const {
    Header,
    Navigation,
    MealPlanner,
    RecipeLibrary,
    BatchCooking,
    ShoppingList,
    MacroTracker,
    RecipeModal,
    AuthModal,
    AdBanner
  } = window.MacroChef.components;

  const { shoppingAggregator } = window.MacroChef;
  const { DAYS_KEYS } = window.MacroChef;
  const { useRepositoryQuery } = window.MacroChef;

  function App({ repositories, shoppingStorageKey, session, syncManager }) {
    const [activeTab, setActiveTab] = useState('planner');
    const { lang, t, darkMode, setDarkMode, colorTheme, setColorTheme } = window.MacroChef.useI18n();
    const role = session ? session.role : 'Guest';
    const roleRef = useRef(role);
    roleRef.current = role;
    const canManageRecipes = window.MacroChef.permissions.canManageRecipes(role);
    const [syncStatus, setSyncStatus] = useState(() => syncManager ? syncManager.getStatus() : { state: 'local' });

    useEffect(() => {
      if (!syncManager) {
        setSyncStatus({ state: 'local' });
        return;
      }
      setSyncStatus(syncManager.getStatus());
      return syncManager.subscribe(setSyncStatus);
    }, [syncManager]);

    const appData = useRepositoryQuery(
      () => repositories.watchAppData(),
      [repositories],
      null
    );
    const recipes = appData.data ? appData.data.recipes : [];
    const plan = appData.data ? appData.data.plan : {};
    const storedGoals = appData.data
      ? {
          ...window.MacroChef.DEFAULT_GOALS,
          ...appData.data.goals,
          age: appData.data.goals.age ?? '',
          weight: appData.data.goals.weight ?? '',
          height: appData.data.goals.height ?? '',
          sex: appData.data.goals.sex ?? '',
          activityPal: appData.data.goals.activityPal ?? '',
          userGoal: appData.data.goals.userGoal ?? ''
        }
      : window.MacroChef.DEFAULT_GOALS;
    const [goalsDraft, setGoalsDraft] = useState(null);
    const [goalsSaveError, setGoalsSaveError] = useState(false);
    const [goalsSaving, setGoalsSaving] = useState(false);
    const goalsDraftRef = useRef(null);
    const goalsSaveQueue = useRef(Promise.resolve());
    const goalsSaveVersion = useRef(0);
    const [savedGoalsVersion, setSavedGoalsVersion] = useState(0);
    const goals = goalsDraft || storedGoals;
    const [checkedShopping, setCheckedShopping] = useState(() => {
      try {
        const saved = localStorage.getItem(shoppingStorageKey);
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        console.error('Could not load shopping checks:', e);
        return {};
      }
    });

    const [selectedBatchRecipe, setSelectedBatchRecipe] = useState(null);
    const [batchStep, setBatchStep] = useState(0);
    const [showRecipeModal, setShowRecipeModal] = useState(false);
    const [editingRecipe, setEditingRecipe] = useState(null);
    const [showAuthModal, setShowAuthModal] = useState(false);

    useEffect(() => {
      if (!canManageRecipes) {
        setShowRecipeModal(false);
        setEditingRecipe(null);
      }
    }, [canManageRecipes]);

    useEffect(() => {
      document.documentElement.setAttribute('data-color-theme', colorTheme);

      // Update mobile status bar theme-color
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        if (colorTheme === 'violet') {
          metaTheme.setAttribute('content', darkMode ? '#1e1b4b' : '#6366f1');
        } else if (colorTheme === 'mono') {
          metaTheme.setAttribute('content', darkMode ? '#18181b' : '#27272a');
        } else {
          metaTheme.setAttribute('content', darkMode ? '#022c22' : '#10b981');
        }
      }
    }, [colorTheme, darkMode]);

    useEffect(() => {
      if (darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }, [darkMode]);

    useEffect(() => {
      localStorage.setItem(shoppingStorageKey, JSON.stringify(checkedShopping));
    }, [checkedShopping, shoppingStorageKey]);

    useEffect(() => {
      if (appData.error) {
        console.error('Data repository subscription error:', appData.error);
      }
    }, [appData.error]);

    useEffect(() => {
      if (!goalsDraftRef.current || !appData.data ||
          savedGoalsVersion !== goalsSaveVersion.current || goalsSaveError) return;
      const saved = appData.data.goals;
      const draft = goalsDraftRef.current;
      if (Object.keys(draft).every((key) => key === 'id' || saved[key] === draft[key])) {
        goalsDraftRef.current = null;
        setGoalsDraft(null);
      }
    }, [appData.data, savedGoalsVersion, goalsSaveError]);

    // Aggregated Smart Shopping List
    const aggregatedShoppingList = useMemo(() => {
      return shoppingAggregator.calculateShoppingList(plan, recipes, lang);
    }, [plan, recipes, lang]);

    // Handlers
    const handleAssignMeal = async (dayKey, mealType, recipeId) => {
      await repositories.savePlannerSlot(
        dayKey,
        plan[dayKey],
        mealType,
        recipeId
      );
    };

    const handleClearWeek = async () => {
      await repositories.clearPlanner();
    };

    const requireRecipePermission = () => {
      if (!window.MacroChef.permissions.canManageRecipes(roleRef.current)) {
        throw new Error(t.recipesReadOnly);
      }
    };

    const handleCreateRecipe = () => {
      requireRecipePermission();
      setEditingRecipe(null);
      setShowRecipeModal(true);
    };

    const handleEditRecipe = (recipe) => {
      requireRecipePermission();
      setEditingRecipe(recipe);
      setShowRecipeModal(true);
    };

    const handleSaveRecipe = async (recipeData) => {
      requireRecipePermission();
      await repositories.saveRecipe(recipeData);
      setShowRecipeModal(false);
      setEditingRecipe(null);
    };

    const handleImportRecipes = async (recipeData) => {
      requireRecipePermission();
      await repositories.saveRecipes(recipeData);
    };

    const handleDeleteRecipe = async (id) => {
      requireRecipePermission();
      await repositories.deleteRecipe(id);
      if (selectedBatchRecipe && selectedBatchRecipe.id === id) {
        setSelectedBatchRecipe(null);
      }
    };

    const handleSaveGoals = (changes) => {
      const newGoals = { ...(goalsDraftRef.current || storedGoals), ...changes };
      goalsDraftRef.current = newGoals;
      setGoalsDraft(newGoals);
      setGoalsSaveError(false);
      setGoalsSaving(true);
      const version = ++goalsSaveVersion.current;
      goalsSaveQueue.current = goalsSaveQueue.current.then(async () => {
        try {
          await repositories.saveGoals(newGoals);
          if (version === goalsSaveVersion.current) {
            setSavedGoalsVersion(version);
            setGoalsSaving(false);
          }
        } catch (error) {
          console.error('Failed to save goals:', error);
          if (version === goalsSaveVersion.current) {
            setGoalsSaveError(true);
            setGoalsSaving(false);
          }
        }
      });
    };

    const handleStartBatchCooking = (recipe) => {
      setSelectedBatchRecipe(recipe);
      setBatchStep(0);
      setActiveTab('batch');
    };

    const handleToggleShoppingCheck = (name) => {
      setCheckedShopping((prev) => ({
        ...prev,
        [name]: !prev[name]
      }));
    };

    return (
      <div className={darkMode ? 'dark' : ''}>
        <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 pb-24 md:pb-8">
          {/* Header */}
          <Header
            darkMode={darkMode}
            setDarkMode={setDarkMode}
            colorTheme={colorTheme}
            setColorTheme={setColorTheme}
            onOpenAuth={() => setShowAuthModal(true)}
            syncStatus={syncStatus}
          />
          <AdBanner role={role} />

          {/* Main Layout Container */}
          <main className="max-w-7xl mx-auto px-4 pt-6">
            {/* Desktop Tabs */}
            <Navigation
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              isMobile={false}
            />

            {/* Tab 1: Weekly Planner */}
            {activeTab === 'planner' && (
              <MealPlanner
                daysKeys={DAYS_KEYS}
                plan={plan}
                recipes={recipes}
                goals={goals}
                onAssignMeal={handleAssignMeal}
                onClearWeek={handleClearWeek}
                onCreateRecipe={canManageRecipes ? handleCreateRecipe : undefined}
              />
            )}

            {/* Tab 2: Recipe Library */}
            {activeTab === 'recipes' && (
              <RecipeLibrary
                recipes={recipes}
                canManageRecipes={canManageRecipes}
                onCreateRecipe={handleCreateRecipe}
                onEditRecipe={handleEditRecipe}
                onDeleteRecipe={handleDeleteRecipe}
                onImportRecipes={handleImportRecipes}
                onStartBatchCooking={handleStartBatchCooking}
              />
            )}

            {/* Tab 3: Batch Cooking */}
            {activeTab === 'batch' && (
              <BatchCooking
                recipes={recipes}
                selectedRecipe={selectedBatchRecipe}
                onSelectRecipe={setSelectedBatchRecipe}
                batchStep={batchStep}
                setBatchStep={setBatchStep}
              />
            )}

            {/* Tab 4: Smart Shopping List */}
            {activeTab === 'shopping' && (
              <ShoppingList
                shoppingList={aggregatedShoppingList}
                checkedShopping={checkedShopping}
                onToggleCheck={handleToggleShoppingCheck}
                onUncheckAll={() => setCheckedShopping({})}
              />
            )}

            {/* Tab 5: Macro & Goals Tracker */}
            {activeTab === 'tracker' && (
              appData.error ? (
                <p role="alert" className="text-red-600 dark:text-red-400">{t.goalsLoadError}</p>
              ) : !appData.data ? (
                <p role="status">{t.goalsLoading}</p>
              ) : (
                <>
                  {goalsSaving && (
                    <p role="status" className="max-w-3xl mx-auto mb-4 text-slate-500">
                      {t.goalsSaving}
                    </p>
                  )}
                  {goalsSaveError && (
                    <div role="alert" className="max-w-3xl mx-auto mb-4 text-red-600 dark:text-red-400">
                      {t.goalsSaveError}{' '}
                      <button type="button" className="underline" onClick={() => handleSaveGoals({})}>
                        {t.retry}
                      </button>
                    </div>
                  )}
                  <MacroTracker
                    goals={goals}
                    onSaveGoals={handleSaveGoals}
                  />
                </>
              )
            )}
          </main>

          {/* Modal Dialog */}
          {showRecipeModal && canManageRecipes && (
            <RecipeModal
              repository={repositories}
              editingRecipe={editingRecipe}
              onClose={() => {
                setShowRecipeModal(false);
                setEditingRecipe(null);
              }}
              onSave={handleSaveRecipe}
            />
          )}
          {showAuthModal && <AuthModal session={session} onClose={() => setShowAuthModal(false)} />}

          {/* Mobile Bottom Navigation */}
          <Navigation
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            isMobile={true}
          />
        </div>
      </div>
    );
  }

  window.MacroChef.App = App;
})();

// ==========================================
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { useEffect, useRef, useState } = React;

  function SessionApp() {
    const [active, setActive] = useState(null);
    const [target, setTarget] = useState(null);
    const [error, setError] = useState(null);
    const [attempt, setAttempt] = useState(0);
    const activeRef = useRef(null);
    const wantedRef = useRef(null);
    const latestSession = useRef(null);
    const sequence = useRef(0);

    useEffect(() => {
      let disposed = false;
      async function refresh() {
        const request = ++sequence.current;
        try {
          const session = await window.MacroChef.auth.getSessionAndRole();
          if (disposed || request !== sequence.current) return;
          latestSession.current = session;
          setError(null);
          const key = session ? JSON.stringify([session.issuer, session.tenantId, session.userId]) : 'guest';
          if (wantedRef.current === key) {
            setActive((previous) => previous ? { ...previous, session } : previous);
            return;
          }
          wantedRef.current = key;
          setActive(null);
          setTarget({ key, session });
        } catch (err) {
          if (disposed || request !== sequence.current) return;
          console.error('Account verification failed:', err);
          setError('authLoadError');
        }
      }
      const unsubscribe = window.MacroChef.auth.subscribe((event) => {
        if (event === 'changing') {
          sequence.current++;
          wantedRef.current = null;
          if (activeRef.current && activeRef.current.syncManager) activeRef.current.syncManager.stop();
          setActive(null);
          setTarget({ suspended: true });
        } else {
          refresh();
        }
      });
      refresh();
      return () => {
        disposed = true;
        sequence.current++;
        unsubscribe();
      };
    }, [attempt]);

    useEffect(() => {
      if (!target) return;
      let cancelled = false;
      let next;
      const stale = () => cancelled || wantedRef.current !== target.key;
      async function open() {
        try {
          if (activeRef.current) {
            const previous = activeRef.current;
            activeRef.current = null;
            if (previous.syncManager) await previous.syncManager.stop();
            previous.repository.close();
          }
          if (target.suspended) return;
          next = target.session
            ? await window.MacroChef.createScopedRepository(target.session)
            : { repository: new window.MacroChef.DexieCalorieRepository(), shoppingStorageKey: 'macrochef_checked' };
          if (stale()) {
            next.repository.close();
            return;
          }
          await next.repository.initialize();
          if (stale()) {
            next.repository.close();
            return;
          }
          if (target.session) await next.repository.seedProducts();
          if (stale()) {
            next.repository.close();
            return;
          }
          if (target.session && !await next.repository.hasGuestMigrationDecision()) {
            if (stale()) {
              next.repository.close();
              return;
            }
            let data = { recipes: [], plans: [] };
            if (await window.MacroChef.guestDatabaseExists()) {
              const guest = new window.MacroChef.DexieCalorieRepository('MacroChefDB', { seedDefaults: false });
              try {
                await guest.initialize();
                data = await guest.getGuestMigrationData();
              } finally {
                guest.close();
              }
            }
            if (stale()) {
              next.repository.close();
              return;
            }
            const hasData = data.recipes.length > 0 || data.plans.some((plan) =>
              ['Breakfast', 'Lunch', 'Dinner', 'Snack'].some((slot) => plan[slot]));
            const lang = (data.lang || localStorage.getItem('macrochef_lang')) === 'en' ? 'en' : 'pl';
            const accepted = hasData && window.confirm(window.MacroChef.TRANSLATIONS[lang].authMigrationPrompt);
            await next.repository.finishGuestMigration(data, accepted);
          }
          if (stale()) {
            next.repository.close();
            return;
          }
          if (target.session) {
            next.syncManager = new window.MacroChef.AppSyncManager();
            next.syncManager.start({
              repository: next.repository,
              userId: target.session.userId,
              client: window.MacroChef.supabaseClient
            });
          }
          activeRef.current = next;
          setActive({ ...next, key: target.key, session: latestSession.current });
        } catch (err) {
          if (next) next.repository.close();
          if (!stale()) {
            console.error('Account repository initialization failed:', err);
            wantedRef.current = null;
            setError(err.message === 'Guest plan references a missing recipe'
              ? 'authGuestDataError'
              : 'authDataError');
          }
        }
      }
      open();
      return () => {
        cancelled = true;
        if (next && activeRef.current !== next) {
          if (next.syncManager) next.syncManager.stop().then(() => next.repository.close());
          else next.repository.close();
        }
      };
    }, [target]);

    useEffect(() => () => {
      if (activeRef.current) {
        const previous = activeRef.current;
        if (previous.syncManager) previous.syncManager.stop().then(() => previous.repository.close());
        else previous.repository.close();
      }
    }, []);

    if (!active) {
      const t = window.MacroChef.TRANSLATIONS[localStorage.getItem('macrochef_lang') === 'en' ? 'en' : 'pl'];
      return error
        ? <p role="alert">
            {t[error]} <button type="button" onClick={() => setAttempt((n) => n + 1)}>{t.retry}</button>
            {window.MacroChef.supabaseClient && <button type="button" onClick={async () => {
              try {
                await window.MacroChef.auth.signOut();
              } catch (err) {
                console.error('Sign-out failed:', err);
                setError('authSignOutError');
              }
            }}>{t.authSignOut}</button>}
          </p>
        : <p role="status">{t.authLoading}</p>;
    }

    return (
      <window.MacroChef.I18nProvider key={active.key} repository={active.repository}>
        {error && <p role="alert">Nie udało się zweryfikować sesji / Could not verify the session. <button type="button" onClick={() => setAttempt((n) => n + 1)}>Retry / Spróbuj ponownie</button></p>}
        <window.MacroChef.App repositories={active.repository} shoppingStorageKey={active.shoppingStorageKey} session={active.session} syncManager={active.syncManager} />
      </window.MacroChef.I18nProvider>
    );
  }

  window.MacroChef.components.SessionApp = SessionApp;
})();

// Application Bootstrapper & Service Worker Registration
(function () {
  const { SessionApp } = window.MacroChef.components;

  // Mount React App
  const rootElement = document.getElementById('root');
  if (rootElement && SessionApp) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(React.createElement(SessionApp));
  }

  // Register PWA Service Worker for offline capability
  if ('serviceWorker' in navigator) {
    const registerServiceWorker = () => {
      navigator.serviceWorker
        .register('./sw.js')
        .then((reg) => {
          console.log('[MacroChef PWA] Service Worker registered successfully:', reg.scope);
        })
        .catch((err) => {
          console.warn('[MacroChef PWA] Service Worker registration failed:', err);
        });
    };
    if (document.readyState === 'complete') {
      registerServiceWorker();
    } else {
      window.addEventListener('load', registerServiceWorker);
    }
  }
})();

  </script>
