    const DAYS_TRANSLATED = {

    const DAYS_KEYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('planner');

        const saved = localStorage.getItem('macrochef_checked');

      const [selectedBatchRecipe, setSelectedBatchRecipe] = useState(null);
      const [batchStep, setBatchStep] = useState(0);

      const [editingRecipe, setEditingRecipe] = useState(null);

      const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
      const daysList = DAYS_TRANSLATED[lang] || DAYS_TRANSLATED.en;

      // Sync Language Preference
      useEffect(() => {
        localStorage.setItem('macrochef_lang', lang);
      }, [lang]);

      useEffect(() => {
        localStorage.setItem('macrochef_checked', JSON.stringify(checkedShopping));
      }, [checkedShopping]);

      // LOAD DATA FROM INDEXEDDB ON MOUNT & UPDATE
      const loadFromDb = async () => {
        try {
          await db.open();
          
          // Seed fallback if DB empty
          const recipeCount = await db.recipes.count();
          if (recipeCount === 0) {
            await db.recipes.bulkAdd(STARTER_RECIPES);
            await db.planner.bulkAdd(DEFAULT_PLAN);
            await db.goals.add({ id: 'user_goals', calories: 2200, protein: 160, carbs: 220, fats: 70 });
          }

          const dbRecipes = await db.recipes.toArray();
          const dbPlanArr = await db.planner.toArray();
          const dbGoals = await db.goals.get('user_goals');

          setRecipes(dbRecipes);

          // Convert planner array to object map
          const planMap = {};
          dbPlanArr.forEach(item => {
            planMap[item.dayKey] = {
              Breakfast: item.Breakfast || '',
              Lunch: item.Lunch || '',
              Dinner: item.Dinner || '',
              Snack: item.Snack || ''
            };
          });
          setPlan(planMap);

          if (dbGoals) {
            setGoals({
              calories: dbGoals.calories,
              protein: dbGoals.protein,
              carbs: dbGoals.carbs,
              fats: dbGoals.fats
            });
          }
        } catch (err) {
          console.error("Dexie IndexedDB Error:", err);
        }
      };

      useEffect(() => {
        loadFromDb();
      }, []);

      // Lucide Icons Render Hook
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Localized String Extractor
      const getLocalized = (val) => {
        if (typeof val === 'object' && val !== null) {
          return val[lang] || val.en || '';
        }
        return val || '';
      };

      // Daily Calorie & Macro Calculations
      const getDailyTotals = (dayKey) => {
        const dayPlan = plan[dayKey] || {};
        let totals = { calories: 0, protein: 0, carbs: 0, fats: 0 };

        Object.values(dayPlan).forEach((recipeId) => {
          const rec = recipes.find((r) => r.id === recipeId);
          if (rec) {
            totals.calories += Number(rec.calories) || 0;
            totals.protein += Number(rec.protein) || 0;
            totals.carbs += Number(rec.carbs) || 0;
            totals.fats += Number(rec.fats) || 0;
          }
        });

        return totals;
      };

      // Recipe Count Frequency across weekly planner
      const recipePlanCounts = useMemo(() => {
        const counts = {};
        Object.values(plan).forEach((dayMeals) => {
          Object.values(dayMeals).forEach((recipeId) => {
            if (recipeId) {
              counts[recipeId] = (counts[recipeId] || 0) + 1;
            }
          });
        });
        return counts;
      }, [plan]);

      // Smart Shopping List Aggregation (Whole Packages + Waste Reduction)
      const aggregatedShoppingList = useMemo(() => {
        const map = {};

        Object.entries(recipePlanCounts).forEach(([recipeId, timesPlanned]) => {
          const rec = recipes.find((r) => r.id === recipeId);
          if (!rec) return;

          const scaleFactor = timesPlanned / (rec.servings || 1);

          rec.ingredients.forEach((ing) => {
            const ingName = getLocalized(ing.name);
            const key = ingName.toLowerCase().trim();
            const requiredAmount = ing.amount * scaleFactor;
            const pkgSize = ing.packageSize || ing.amount || 1;

            if (!map[key]) {
              map[key] = {
                name: ingName,
                totalRequired: 0,
                unit: ing.unit,
                packageSize: pkgSize,
                packageUnit: ing.packageUnit || ing.unit,
                recipesUsedIn: new Set()
              };
            }

            map[key].totalRequired += requiredAmount;
            map[key].recipesUsedIn.add(getLocalized(rec.name));
          });
        });

        return Object.values(map).map((item) => {
          const packagesNeeded = Math.ceil(item.totalRequired / item.packageSize);
          const totalBoughtAmount = packagesNeeded * item.packageSize;
          const leftoverAmount = Math.max(0, totalBoughtAmount - item.totalRequired);

          return {
            ...item,
            packagesNeeded,
            totalBoughtAmount,
            leftoverAmount,
            recipesUsedIn: Array.from(item.recipesUsedIn)
          };
        });
      }, [plan, recipes, recipePlanCounts, lang]);

      // DB UPDATES - MEAL ASSIGNMENT
      const handleAssignMeal = async (dayKey, mealType, recipeId) => {
        const updatedDay = { ...(plan[dayKey] || {}), [mealType]: recipeId };
        
        // Update React State
        setPlan((prev) => ({ ...prev, [dayKey]: updatedDay }));

        // Save to IndexedDB
        await db.planner.put({
          dayKey,
          ...updatedDay
        });
      };

      // DB UPDATES - CLEAR WEEK
      const handleClearWeek = async () => {
        const emptyPlanMap = {};
        const emptyArr = DAYS_KEYS.map(dayKey => {
          emptyPlanMap[dayKey] = {};
          return { dayKey };
        });

        setPlan(emptyPlanMap);
        await db.planner.clear();
        await db.planner.bulkAdd(emptyArr);
      };

      // DB UPDATES - SAVE / EDIT RECIPE
      const handleSaveRecipe = async (recipeData) => {
        if (editingRecipe) {
          await db.recipes.put(recipeData);
        } else {
          const newRec = { ...recipeData, id: `rec-${Date.now()}` };
          await db.recipes.add(newRec);
        }
        await loadFromDb();
        setShowRecipeModal(false);
        setEditingRecipe(null);

                              className={`cursor-pointer p-4 rounded-2xl border transition-all flex items-center justify-between ${
                                isChecked
                                  ? 'bg-slate-100/60 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 opacity-60'
                                  : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-emerald-300 shadow-sm'
                              }`}
                            >
                              <div className="flex items-center space-x-3">
                                <button className="text-emerald-500 focus:outline-none">
                                  <i data-lucide={isChecked ? "check-circle-2" : "circle"} class="w-5 h-5"></i>
                                </button>

                                <div>
                                  <span
                                    className={`font-semibold text-sm block ${
                                      isChecked
                                        ? 'line-through text-slate-400 dark:text-slate-500'
                                        : 'text-slate-800 dark:text-slate-100'
                                    }`}
                                  >
                                    {item.name}
                                  </span>
                                  <span className="text-xs text-slate-400 dark:text-slate-500">
                                    {t.usedIn}: {item.recipesUsedIn.join(', ')}
                                  </span>
                                </div>
                              </div>

                              <div className="text-right">
                                <div className="text-xs font-bold text-emerald-600 dark:text-emerald-400">
                                  {t.buy} {item.packagesNeeded} {t.pkg} ({item.packagesNeeded * item.packageSize} {item.packageUnit})
                                </div>
                                <div className="text-[11px] text-slate-400">
                                  {t.recipeNeeds}: {Math.round(item.totalRequired)} {item.unit}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {/* Zero Waste Metric Sidebar */}
                      <div className="bg-gradient-to-br from-teal-500 to-emerald-600 text-white p-6 rounded-2xl shadow-lg h-fit space-y-4">
                        <div className="flex items-center space-x-2">
                          <i data-lucide="sparkles" class="w-5 h-5 text-amber-300"></i>
                          <h3 className="font-bold text-base">{t.zeroWasteInsights}</h3>
                        </div>

                        <p className="text-xs text-teal-100 leading-relaxed">
                          {t.zeroWasteDesc}
                        </p>

                        <div className="space-y-2 pt-2">
                          {aggregatedShoppingList
                            .filter((i) => i.leftoverAmount > 0)
                            .map((item, idx) => (
                              <div key={idx} className="bg-white/15 backdrop-blur-md p-2.5 rounded-xl flex items-center justify-between text-xs">
                                <span className="font-medium text-white">{item.name}</span>
                                <span className="font-bold text-amber-200">
                                  +{Math.round(item.leftoverAmount)} {item.unit} {t.surplus}
                                </span>
                              </div>
                            ))}
                        </div>

                        <div className="pt-3 text-[11px] text-teal-100 border-t border-white/20 flex items-center justify-between">
                          <span>{t.totalUniqueItems}:</span>
                          <strong className="text-white text-xs">{aggregatedShoppingList.length}</strong>
                        </div>
                      </div>

                    </div>
                  ) : (
                    <div className="text-center py-16 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                      <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto mb-3 text-slate-300 dark:text-slate-600"></i>
                      <p className="text-sm font-semibold text-slate-600 dark:text-slate-300">
                        {t.shoppingEmpty}
                      </p>
                      <p className="text-xs text-slate-400 mt-1">
                        {t.shoppingEmptySub}
                      </p>
                    </div>
                  )}
                </div>
              )}

              {/* --- TAB 5: MACRO & GOALS TRACKER --- */}
              {activeTab === 'tracker' && (
                <div className="space-y-6 max-w-3xl mx-auto">
                  <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2 mb-1">
                      <i data-lucide="pie-chart" class="w-5 h-5 text-emerald-500"></i>
                      {t.macroGoalsTitle}
                    </h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">
                      {t.macroGoalsSub}
                    </p>

                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                          {t.dailyCalorieTarget}
                        </label>
                        <input
                          type="number"
                          value={goals.calories}
                          onChange={(e) => handleSaveGoals({ ...goals, calories: Number(e.target.value) })}
                          className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm font-bold text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                        />
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                            {t.proteinGoal}
                          </label>
                          <input
                            type="number"
                            value={goals.protein}
                            onChange={(e) => handleSaveGoals({ ...goals, protein: Number(e.target.value) })}
                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm font-bold text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                            {t.carbsGoal}
                          </label>
                          <input
                            type="number"
                            value={goals.carbs}
                            onChange={(e) => handleSaveGoals({ ...goals, carbs: Number(e.target.value) })}
                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm font-bold text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                            {t.fatsGoal}
                          </label>
                          <input
                            type="number"
                            value={goals.fats}
                            onChange={(e) => handleSaveGoals({ ...goals, fats: Number(e.target.value) })}
                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-sm font-bold text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                          />
                        </div>
                      </div>
                    </div>

                    <div className="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700">
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">
                        {t.macroDist}
                      </h3>

                      <div className="grid grid-cols-3 gap-3 text-center">
                        <div className="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/50 p-3 rounded-xl">
                          <span className="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase">{t.protein}</span>
                          <div className="text-lg font-bold text-slate-800 dark:text-slate-100">
                            {goals.protein * 4} kcal
                          </div>
                          <span className="text-[11px] text-slate-400">
                            {Math.round(((goals.protein * 4) / goals.calories) * 100)}% {t.ofDailyTotal}
                          </span>
                        </div>

                        <div className="bg-teal-50 dark:bg-teal-950/40 border border-teal-200 dark:border-teal-800/50 p-3 rounded-xl">
                          <span className="text-[10px] font-bold text-teal-600 dark:text-teal-400 uppercase">{t.carbs}</span>
                          <div className="text-lg font-bold text-slate-800 dark:text-slate-100">
                            {goals.carbs * 4} kcal
                          </div>
                          <span className="text-[11px] text-slate-400">
                            {Math.round(((goals.carbs * 4) / goals.calories) * 100)}% {t.ofDailyTotal}
                          </span>
                        </div>

                        <div className="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/50 p-3 rounded-xl">
                          <span className="text-[10px] font-bold text-amber-600 dark:text-amber-400 uppercase">{t.fats}</span>
                          <div className="text-lg font-bold text-slate-800 dark:text-slate-100">
                            {goals.fats * 9} kcal
                          </div>
                          <span className="text-[11px] text-slate-400">
                            {Math.round(((goals.fats * 9) / goals.calories) * 100)}% {t.ofDailyTotal}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* CREATE / EDIT RECIPE MODAL */}
            {showRecipeModal && (
              <RecipeFormModal
                lang={lang}
                t={t}
                editingRecipe={editingRecipe}
                onClose={() => setShowRecipeModal(false)}
                onSave={handleSaveRecipe}
              />
            )}

            {/* MOBILE BOTTOM NAV */}
            <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flex items-center justify-around py-2 px-1">
              {[
                { id: 'planner', label: t.planner, icon: 'calendar' },
                { id: 'recipes', label: t.recipes, icon: 'book-open' },
                { id: 'batch', label: t.batch, icon: 'utensils' },
                { id: 'shopping', label: t.shopping, icon: 'shopping-bag' },
                { id: 'tracker', label: t.tracker, icon: 'pie-chart' }
              ].map((tab) => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center space-y-1 py-1 px-2 rounded-xl transition-all ${
                      isActive
                        ? 'text-emerald-500 font-bold'
                        : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'
                    }`}
                  >
                    <i data-lucide={tab.icon} class="w-5 h-5"></i>
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </nav>
          </div>
        </div>
      );
    }

    // MODAL DIALOG COMPONENT FOR CREATING/EDITING RECIPES
    function RecipeFormModal({ lang, t, editingRecipe, onClose, onSave }) {
      const getLocalized = (val) => {
        if (typeof val === 'object' && val !== null) {
          return val[lang] || val.en || '';
        }
        return val || '';
      };

      const [formData, setFormData] = useState(() => {
        if (editingRecipe) {
          return {
            ...editingRecipe,
            name: getLocalized(editingRecipe.name),
            category: getLocalized(editingRecipe.category),
            ingredients: editingRecipe.ingredients.map((ing) => ({
              ...ing,
              name: getLocalized(ing.name)
            })),
            steps: getLocalized(editingRecipe.steps) || []
          };
        }
        return {
          name: '',
          category: 'Lunch',
          prepTime: '20 min',
          servings: 2,
          calories: 450,
          protein: 35,
          carbs: 40,
          fats: 12,
          ingredients: [
            { name: lang === 'pl' ? 'Pierś z Kurczaka' : 'Chicken Breast', amount: 300, unit: 'g', packageSize: 500, packageUnit: 'g' }
          ],
          steps: [lang === 'pl' ? 'Przygotuj składniki i ugotuj według zaleceń.' : 'Prepare ingredients and cook according to instructions.']
        };
      });

      const handleAddIngredient = () => {
        setFormData((prev) => ({
          ...prev,
          ingredients: [
            ...prev.ingredients,
            { name: '', amount: 100, unit: 'g', packageSize: 200, packageUnit: 'g' }
          ]
        }));
      };

      const handleRemoveIngredient = (index) => {
        setFormData((prev) => ({
          ...prev,
          ingredients: prev.ingredients.filter((_, i) => i !== index)
        }));
      };

      const handleIngredientChange = (index, field, value) => {
        setFormData((prev) => {
          const updated = [...prev.ingredients];
          updated[index] = { ...updated[index], [field]: value };
          return { ...prev, ingredients: updated };
        });
      };

      const handleAddStep = () => {
        setFormData((prev) => ({
          ...prev,
          steps: [...prev.steps, '']
        }));
      };

      const handleStepChange = (index, value) => {
        setFormData((prev) => {
          const updated = [...prev.steps];
          updated[index] = value;
          return { ...prev, steps: updated };
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) return;

        const formattedRecipe = {
          ...formData,
          name: { [lang]: formData.name, [lang === 'en' ? 'pl' : 'en']: formData.name },
          category: { [lang]: formData.category, [lang === 'en' ? 'pl' : 'en']: formData.category },
          ingredients: formData.ingredients.map((ing) => ({
            ...ing,
            name: { [lang]: ing.name, [lang === 'en' ? 'pl' : 'en']: ing.name }
          })),
          steps: { [lang]: formData.steps, [lang === 'en' ? 'pl' : 'en']: formData.steps }
        };

        onSave(formattedRecipe);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 my-8 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-700 mb-4">
              <h3 className="font-bold text-lg text-slate-900 dark:text-white">
                {editingRecipe ? t.editRecipe : t.addNewMealRecipe}
              </h3>
              <button
                onClick={onClose}
                className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm font-semibold p-1"
              >
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                  {t.recipeName}
                </label>
                <input
                  type="text"
                  required
                  value={formData.name}
                  onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  placeholder={lang === 'pl' ? 'np. Łosoś z Ryżem' : 'e.g. Teriyaki Salmon Bowl'}
                  className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 text-xs font-medium text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {t.category}
                  </label>
                  <select
                    value={formData.category}
                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs font-medium text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                  >
                    <option value="Breakfast">{t.breakfast}</option>
                    <option value="Lunch">{t.lunch}</option>
                    <option value="Dinner">{t.dinner}</option>
                    <option value="Snack">{t.snack}</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {t.prepTime}
                  </label>
                  <input
                    type="text"
                    value={formData.prepTime}
                    onChange={(e) => setFormData({ ...formData, prepTime: e.target.value })}
                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs font-medium text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                    {t.batchServings}
                  </label>
                  <input
                    type="number"
                    min="1"
                    value={formData.servings}
                    onChange={(e) => setFormData({ ...formData, servings: Number(e.target.value) })}
                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs font-medium text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-emerald-500"
                  />
                </div>
              </div>

              <div className="pt-2 border-t border-slate-100 dark:border-slate-700">
                <span className="block text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-2">
                  {t.macrosPerPortion}
                </span>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div>
                    <label className="block text-[11px] text-slate-500">Calories (kcal)</label>
                    <input
                      type="number"
                      value={formData.calories}
                      onChange={(e) => setFormData({ ...formData, calories: Number(e.target.value) })}
                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs font-medium text-slate-800 dark:text-slate-100"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500">{t.protein} (g)</label>
                    <input
                      type="number"
                      value={formData.protein}
                      onChange={(e) => setFormData({ ...formData, protein: Number(e.target.value) })}
                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs font-medium text-slate-800 dark:text-slate-100"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500">{t.carbs} (g)</label>
                    <input
                      type="number"
                      value={formData.carbs}
                      onChange={(e) => setFormData({ ...formData, carbs: Number(e.target.value) })}
                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs font-medium text-slate-800 dark:text-slate-100"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] text-slate-500">{t.fats} (g)</label>
                    <input
                      type="number"
                      value={formData.fats}
                      onChange={(e) => setFormData({ ...formData, fats: Number(e.target.value) })}
                      className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs font-medium text-slate-800 dark:text-slate-100"
                    />
                  </div>
                </div>
              </div>

              <div className="pt-2 border-t border-slate-100 dark:border-slate-700">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold text-slate-700 dark:text-slate-300">
                    {t.ingredientsPkgSizing}
                  </span>
                  <button
                    type="button"
                    onClick={handleAddIngredient}
                    className="text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:underline"
                  >
                    {t.addIngredient}
                  </button>
                </div>

                <div className="space-y-2">
                  {formData.ingredients.map((ing, idx) => (
                    <div key={idx} className="flex items-center gap-2 bg-slate-50 dark:bg-slate-900/60 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                      <input
                        type="text"
                        placeholder={lang === 'pl' ? 'Nazwa (np. Ryż)' : 'Name (e.g. Rice)'}
                        value={ing.name}
                        onChange={(e) => handleIngredientChange(idx, 'name', e.target.value)}
                        className="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100"
                      />
                      <input
                        type="number"
                        placeholder="Amt"
                        value={ing.amount}
                        onChange={(e) => handleIngredientChange(idx, 'amount', Number(e.target.value))}
                        className="w-16 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100"
                      />
                      <input
                        type="text"
                        placeholder="Unit"
                        value={ing.unit}
                        onChange={(e) => handleIngredientChange(idx, 'unit', e.target.value)}
                        className="w-14 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100"
                      />
                      <input
                        type="number"
                        placeholder="Pkg Size"
                        value={ing.packageSize}
                        onChange={(e) => handleIngredientChange(idx, 'packageSize', Number(e.target.value))}
                        className="w-20 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-1.5 text-xs text-slate-800 dark:text-slate-100"
                      />
                      <button
                        type="button"
                        onClick={() => handleRemoveIngredient(idx)}
                        className="text-rose-500 hover:text-rose-700 p-1"
                      >
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="pt-2 border-t border-slate-100 dark:border-slate-700">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold text-slate-700 dark:text-slate-300">
                    {t.cookingSteps}
                  </span>
                  <button
                    type="button"
                    onClick={handleAddStep}
                    className="text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:underline"
                  >
                    {t.addStep}
                  </button>
                </div>

                <div className="space-y-2">
                  {formData.steps.map((step, idx) => (
                    <div key={idx} className="flex items-center gap-2">
                      <span className="text-xs font-bold text-slate-400 w-4">{idx + 1}.</span>
                      <input
                        type="text"
                        value={step}
                        onChange={(e) => handleStepChange(idx, e.target.value)}
                        className="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-2 text-xs text-slate-800 dark:text-slate-100"
                      />
                    </div>
                  ))}
                </div>
              </div>

              <div className="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl"
                >
                  {t.cancel}
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 text-xs font-semibold bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl shadow-md transition-colors"
                >
                  {t.saveRecipe}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
