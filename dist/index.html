// File: i18n/context.js
// ==========================================
window.MacroChef = window.MacroChef || {};

(function () {
  const { createContext, createElement, useCallback, useContext, useEffect, useMemo, useRef, useState } = React;
  const I18nContext = createContext(null);

  function I18nProvider({ children, repository = window.MacroChef.repositories }) {
    const [settings, setSettings] = useState(null);
    const [loadError, setLoadError] = useState(false);
    const [saveError, setSaveError] = useState(false);
    const [saving, setSaving] = useState(false);
    const [attempt, setAttempt] = useState(0);
    const settingsRef = useRef(null);
    const queueRef = useRef(Promise.resolve());
    const versionRef = useRef(0);
    const pendingRef = useRef(false);

    useEffect(() => {
      let active = true;
      let subscription;
      async function load() {
        try {
          const defaults = {
            lang: localStorage.getItem('macrochef_lang') || 'pl',
            darkMode: localStorage.getItem('macrochef_dark') === 'true',
            colorTheme: localStorage.getItem('macrochef_color_theme') || 'emerald'
          };
          const initial = await repository.initializeSettings(defaults);
          if (!active) return;
          settingsRef.current = initial;
          setSettings(initial);
          setLoadError(false);
          subscription = repository.watchSettings().subscribe({
            next(value) {
              if (!active || pendingRef.current) return;
              if (!value) {
                console.error('Settings record is missing');
                setLoadError(true);
                return;
              }
              settingsRef.current = value;
              setSettings(value);
            },
            error(error) {
              console.error('Settings subscription error:', error);
              if (active) setLoadError(true);
            }
          });
        } catch (error) {
          console.error('Settings initialization error:', error);
          if (active) setLoadError(true);
        }
      }
      load();
      return () => {
        active = false;
        if (subscription) subscription.unsubscribe();
      };
    }, [repository, attempt]);

    const saveChanges = useCallback((changes) => {
      const next = { ...settingsRef.current, ...changes };
      settingsRef.current = next;
      setSettings(next);
      setSaveError(false);
      setSaving(true);
      pendingRef.current = true;
      const version = ++versionRef.current;
      queueRef.current = queueRef.current.then(async () => {
        try {
          const saved = await repository.saveSettings(next);
          if (version === versionRef.current) {
            settingsRef.current = saved;
            pendingRef.current = false;
            setSettings(saved);
            setSaving(false);
          }
        } catch (error) {
          console.error('Settings save error:', error);
          if (version === versionRef.current) {
            setSaveError(true);
            setSaving(false);
          }
        }
      });
    }, [repository]);
    const setLang = useCallback((lang) => saveChanges({ lang }), [saveChanges]);
    const setDarkMode = useCallback((darkMode) => saveChanges({ darkMode }), [saveChanges]);
    const setColorTheme = useCallback((colorTheme) => saveChanges({ colorTheme }), [saveChanges]);
    const lang = settings ? settings.lang : 'pl';
    const value = useMemo(() => ({
      lang,
      setLang,
      darkMode: settings && settings.darkMode,
      setDarkMode,
      colorTheme: settings && settings.colorTheme,
      setColorTheme,
      t: window.MacroChef.TRANSLATIONS[lang] || window.MacroChef.TRANSLATIONS.en,
      daysList: window.MacroChef.DAYS_TRANSLATED[lang] || window.MacroChef.DAYS_TRANSLATED.en
    }), [lang, setLang, settings && settings.darkMode, setDarkMode,
      settings && settings.colorTheme, setColorTheme]);

    if (loadError) {
      return createElement('div', { role: 'alert' },
        'Nie udało się wczytać ustawień / Could not load settings. ',
        createElement('button', { type: 'button', onClick: () => setAttempt((n) => n + 1) },
          'Spróbuj ponownie / Retry'));
    }
    if (!settings) return createElement('div', { role: 'status' }, 'Wczytywanie ustawień / Loading settings...');
    return createElement(I18nContext.Provider, { value },
      saving && createElement('div', { role: 'status', className: 'p-3 text-slate-500' },
        value.t.settingsSaving),
      saveError && createElement('div', {
        role: 'alert',
        className: 'p-3 text-red-600 dark:text-red-400'
      }, value.t.settingsSaveError, ' ',
      createElement('button', { type: 'button', className: 'underline', onClick: () => saveChanges({}) },
        value.t.retry)),
      children);
  }

  function useI18n() {
    const value = useContext(I18nContext);
    if (!value) throw new Error('useI18n must be used within I18nProvider');
    return value;
  }

  window.MacroChef.I18nProvider = I18nProvider;
  window.MacroChef.useI18n = useI18n;
})();

// Utility helpers for localization & strings
window.MacroChef = window.MacroChef || {};

window.MacroChef.helpers = {
  getLocalized(val, lang = 'en') {
    if (!val) return '';
    if (typeof val === 'object' && val !== null) {
      return val[lang] || val.en || Object.values(val)[0] || '';
    }
    return String(val);
  },

  // Meal order: breakfast, lunch, dinner, snack; unknown categories follow alphabetically
  compareMealCategories(a, b, lang = 'pl') {
    const mealRank = {
      'śniadanie': 0, breakfast: 0,
      obiad: 1, lunch: 1,
      kolacja: 2, dinner: 2,
      'przekąska': 3, snack: 3
    };
    const rank = (cat) => {
      const r = mealRank[String(cat).trim().toLowerCase()];
      return r === undefined ? 99 : r;
    };
    return rank(a) - rank(b) || String(a).localeCompare(String(b), lang);
  },

  toPascalCase(str) {
    if (!str) return '';
    return str
      .split('-')
      .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
      .join('');
  }
};

// Shared recipe image URL normalization and resilient fallback handling
window.MacroChef = window.MacroChef || {};

(function () {
  const DEFAULT_IMAGE_URL = 'images/no-recipe-image.svg';
  const CATEGORY_IMAGES = {
    breakfast: 'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=900&h=900&q=85',
    lunch: 'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&h=900&q=85',
    dinner: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=900&h=900&q=85',
    snack: 'https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?auto=format&fit=crop&w=900&h=900&q=85',
    fallback: 'https://images.unsplash.com/photo-1543362906-acfc16c67564?auto=format&fit=crop&w=900&h=900&q=85'
  };

  const normalizeCategory = (category) => {
    const value = category && typeof category === 'object'
      ? (category.en || category.pl || '')
      : (category || '');
    return String(value).trim().toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/ł/g, 'l');
  };

  const isUsableUrl = (value) => {
    if (typeof value !== 'string' || !value.trim()) return false;
    const url = value.trim();
    if (/^data:image\/(webp|png|jpeg|jpg);base64,/i.test(url)) return true;
    if (url.startsWith('/') || url.startsWith('./') || url.startsWith('../') || url.startsWith('images/')) return true;
    if (!/^https?:\/\//i.test(url) && !/^file:\/\//i.test(url)) return false;
    try {
      const parsed = new URL(url, window.location.href);
      return parsed.protocol === 'http:' || parsed.protocol === 'https:' || parsed.protocol === 'file:';
    } catch (error) {
      return false;
    }
  };

  const normalizeUrl = (value) => isUsableUrl(value) ? value.trim() : DEFAULT_IMAGE_URL;
  const categoryImage = (category) => CATEGORY_IMAGES[normalizeCategory(category)] || CATEGORY_IMAGES.fallback;
  const getUrl = (recipe) => normalizeUrl(recipe && (recipe.imageUrl || recipe.ImageUrl || recipe.image_url));
  const handleError = (event) => {
    const image = event.currentTarget;
    if (image.dataset.fallbackApplied === 'true') return;
    image.dataset.fallbackApplied = 'true';
    image.src = DEFAULT_IMAGE_URL;
  };

  window.MacroChef.recipeImages = {
    DEFAULT_IMAGE_URL,
    CATEGORY_IMAGES,
    categoryImage,
    getUrl,
    handleError,
    isUsableUrl,
    normalizeUrl
  };
})();

/**
 * Enhanced Recipe CSV Parser
 * Supports unlimited ingredients and Polish/English formats
 * Handles semicolon-delimited CSV with proper quote handling
 */
window.MacroChef = window.MacroChef || {};

(function () {
  const normalizeImageUrl = (value) => window.MacroChef.recipeImages
    ? window.MacroChef.recipeImages.normalizeUrl(value)
    : (typeof value === 'string' && value.trim()
      ? value.trim()
      : 'images/no-recipe-image.svg');

  const parseCSV = (text, lang = 'pl') => {
    // Remove BOM if present
    const cleanText = text.replace(/^\uFEFF/, '');
    
    // Split into lines first (handle both \r\n and \n)
    let lines = [];
    let currentLine = '';
    let inQuotes = false;

    for (let i = 0; i < cleanText.length; i++) {
      const char = cleanText[i];
      const nextChar = cleanText[i + 1];

      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          currentLine += '"';
          i++; // Skip next quote
        } else {
          inQuotes = !inQuotes;
        }
      } else if ((char === '\n' || char === '\r') && !inQuotes) {
        if (currentLine.trim()) {
          lines.push(currentLine);
        }
        currentLine = '';
        if (char === '\r' && nextChar === '\n') {
          i++; // Skip \r\n
        }
      } else {
        currentLine += char;
      }
    }
    if (currentLine.trim()) {
      lines.push(currentLine);
    }

    if (lines.length < 1) {
      throw new Error('CSV is empty');
    }

    // Parse header
    const headerLine = lines[0];
    const headers = parseCSVLine(headerLine);
    
    const expectedHeaders = lang === 'pl'
      ? ['nazwa', 'kategoria', 'czasPrzygotowania', 'porcje', 'kalorieNaPorcje', 
         'bialkoNaPorcje', 'weglowodanyNaPorcje', 'tluszczeNaPorcje']
      : ['name', 'category', 'prepTime', 'servings', 'caloriesPerServing',
         'proteinPerServing', 'carbsPerServing', 'fatsPerServing'];

    // Validate essential headers
    const headerMap = {};
    headers.forEach((h, i) => {
      headerMap[h.toLowerCase().replace(/\s+/g, '')] = i;
    });

    for (const required of expectedHeaders) {
      const cleanRequired = required.toLowerCase().replace(/\s+/g, '');
      if (!(cleanRequired in headerMap)) {
        throw new Error(`Missing required column: ${required}`);
      }
    }

    // Parse recipes
    const recipes = [];
    for (let lineIdx = 1; lineIdx < lines.length; lineIdx++) {
      try {
        const cells = parseCSVLine(lines[lineIdx]);
        const nameKey = 'nazwa';
        const nameIdx = headerMap[nameKey];
        
        if (cells.length === 0 || nameIdx === undefined || !cells[nameIdx]) {
          continue; // Skip empty rows
        }

        const recipe = parseRecipeRow(cells, headerMap, lang);
        recipes.push(recipe);
      } catch (err) {
        console.warn(`⚠️ Skipping line ${lineIdx + 1}: ${err.message}`);
      }
    }

    return recipes;
  };

  const parseCSVLine = (line) => {
    const cells = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      const nextChar = line[i + 1];

      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          current += '"';
          i++; // Skip next quote
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ';' && !inQuotes) {
        cells.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    cells.push(current.trim());

    return cells;
  };

  const parseRecipeRow = (cells, headerMap, lang) => {
    const get = (key) => {
      const cleanKey = key.toLowerCase().replace(/\s+/g, '');
      const idx = headerMap[cleanKey];
      return idx !== undefined ? cells[idx] : '';
    };

    const ingredients = parseIngredients(cells, headerMap);

    // Map category names
    const categoryMap = {
      breakfast: { en: 'Breakfast', pl: 'Śniadanie' },
      sniadanie: { en: 'Breakfast', pl: 'Śniadanie' },
      lunch: { en: 'Lunch', pl: 'Obiad' },
      obiad: { en: 'Lunch', pl: 'Obiad' },
      dinner: { en: 'Dinner', pl: 'Kolacja' },
      kolacja: { en: 'Dinner', pl: 'Kolacja' },
      snack: { en: 'Snack', pl: 'Przekąska' },
      przekaska: { en: 'Snack', pl: 'Przekąska' }
    };
    
    const categoryInput = (get('kategoria') || get('category')).toLowerCase().normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l').replace(/\s+/g, '');
    const categoryObj = categoryMap[categoryInput] || { en: 'Lunch', pl: 'Obiad' };

    const calories = parseFloat(get('kalorieNaPorcje') || get('caloriesPerServing')) || 0;
    const protein = parseFloat(get('bialkoNaPorcje') || get('proteinPerServing')) || 0;
    const carbs = parseFloat(get('weglowodanyNaPorcje') || get('carbsPerServing')) || 0;
    const fats = parseFloat(get('tluszczeNaPorcje') || get('fatPerServing')) || 0;

    const recipe = {
      id: window.crypto.randomUUID(),
      name: { en: (get('nazwa') || get('name')), pl: (get('nazwa') || get('name')) },
      category: categoryObj,
      prepTime: get('czasPrzygotowania') || get('prepTime'),
      servings: parseInt(get('porcje') || get('servings')) || 1,
      calories,
      protein,
      carbs,
      fats,
      imageUrl: normalizeImageUrl(
        get('imageUrl') || get('image') || get('zdjecie') || get('urlZdjecia')
      ),
      ingredients: ingredients,
      steps: { en: parseSteps(get('kroki') || get('steps')), pl: parseSteps(get('kroki') || get('steps')) },
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    return recipe;
  };

  const parseIngredients = (cells, headerMap) => {
    const ingredients = [];
    
    for (let i = 1; i <= 20; i++) {
      const namePl = `skladnik${i}nazwa`.toLowerCase().replace(/\s+/g, '');
      const nameEn = `ingredient${i}name`.toLowerCase().replace(/\s+/g, '');
      const ilosc = `skladnik${i}ilosc`.toLowerCase().replace(/\s+/g, '');
      const amount = `ingredient${i}amount`.toLowerCase().replace(/\s+/g, '');
      const jednostka = `skladnik${i}jednostka`.toLowerCase().replace(/\s+/g, '');
      const unit = `ingredient${i}unit`.toLowerCase().replace(/\s+/g, '');
      const rozmiar = `skladnik${i}rozmiaropakowania`.toLowerCase().replace(/\s+/g, '');
      const packageSize = `ingredient${i}packagesize`.toLowerCase().replace(/\s+/g, '');
      const jednostkaOpak = `skladnik${i}jednostkaopakowania`.toLowerCase().replace(/\s+/g, '');
      const packageUnit = `ingredient${i}packageunit`.toLowerCase().replace(/\s+/g, '');

      const nameIdx = headerMap[namePl] !== undefined ? headerMap[namePl] : headerMap[nameEn];
      if (nameIdx === undefined || !cells[nameIdx]) continue;

      const ingredientName = cells[nameIdx];
      const ingredient = {
        name: { en: ingredientName, pl: ingredientName },
        amount: parseFloat(cells[headerMap[ilosc] || headerMap[amount]] || 0),
        unit: cells[headerMap[jednostka] || headerMap[unit]] || '',
        packageSize: parseFloat(cells[headerMap[rozmiar] || headerMap[packageSize]] || 0),
        packageUnit: cells[headerMap[jednostkaOpak] || headerMap[packageUnit]] || ''
      };

      ingredients.push(ingredient);
    }

    return ingredients;
  };

  const parseSteps = (stepsText) => {
    if (!stepsText) return [];
    return stepsText.split('|').map(s => s.trim()).filter(s => s);
  };

  const createTemplate = (lang = 'pl') => {
    const headers = lang === 'pl'
      ? ['nazwa', 'kategoria', 'czasPrzygotowania', 'porcje', 'kalorieNaPorcje', 
         'bialkoNaPorcje', 'weglowodanyNaPorcje', 'tluszczeNaPorcje', 'urlZdjecia',
        'skladnik1Nazwa', 'skladnik1Ilosc', 'skladnik1Jednostka', 'skladnik1RozmiarOpakowania', 'skladnik1JednostkaOpakowania',
        'skladnik2Nazwa', 'skladnik2Ilosc', 'skladnik2Jednostka', 'skladnik2RozmiarOpakowania', 'skladnik2JednostkaOpakowania',
        'skladnik3Nazwa', 'skladnik3Ilosc', 'skladnik3Jednostka', 'skladnik3RozmiarOpakowania', 'skladnik3JednostkaOpakowania',
        'kroki']
      : ['name', 'category', 'prepTime', 'servings', 'caloriesPerServing', 
         'proteinPerServing', 'carbsPerServing', 'fatsPerServing', 'imageUrl',
        'ingredient1Name', 'ingredient1Amount', 'ingredient1Unit', 'ingredient1PackageSize', 'ingredient1PackageUnit',
        'ingredient2Name', 'ingredient2Amount', 'ingredient2Unit', 'ingredient2PackageSize', 'ingredient2PackageUnit',
        'ingredient3Name', 'ingredient3Amount', 'ingredient3Unit', 'ingredient3PackageSize', 'ingredient3PackageUnit',
        'steps'];
    
    const values = lang === 'pl'
      ? ['Przykładowy przepis', 'Obiad', '20 min', '2', '450', '35', '40', '12', '',
        'Pierś z kurczaka', '200', 'g', '500', 'g',
        'Ryż', '100', 'g', '1000', 'g',
        'Sól', '5', 'g', '100', 'g', 
        'Ugotuj ryż|Usmaż kurczaka|Podawaj na talerzu']
      : ['Example recipe', 'Lunch', '20 min', '2', '450', '35', '40', '12', '',
        'Chicken breast', '200', 'g', '500', 'g',
        'Rice', '100', 'g', '1000', 'g',
        'Salt', '5', 'g', '100', 'g',
        'Cook rice|Cook chicken|Serve on plate'];

    const quote = (value) => `"${String(value).replace(/"/g, '""')}"`;
    return `\uFEFF${[headers, values].map((row) => row.map(quote).join(';')).join('\r\n')}`;
  };

  // Import dedupe key: first 50 chars of name + category + per-serving macros.
  const recipeImportKey = (recipe) => {
    const text = (value, lang) => (value && typeof value === 'object' ? (value[lang] || value.pl || value.en || '') : (value || ''));
    const fold = (s) => String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l').replace(/\s+/g, '');
    const categoryAliases = { sniadanie: 'breakfast', obiad: 'lunch', kolacja: 'dinner', przekaska: 'snack' };
    const rawCategory = fold(text(recipe.category, 'en'));
    const num = (...values) => {
      const v = values.find((x) => x !== undefined && x !== null && x !== '');
      return Math.round((parseFloat(v) || 0) * 10) / 10;
    };
    return [
      String(text(recipe.name, 'pl')).trim().toLowerCase().slice(0, 50),
      categoryAliases[rawCategory] || rawCategory,
      num(recipe.calories, recipe.caloriesPerServing),
      num(recipe.protein, recipe.proteinPerServing),
      num(recipe.carbs, recipe.carbsPerServing),
      num(recipe.fats, recipe.fatPerServing, recipe.fatsPerServing)
    ].join('|');
  };

  // Matching rows overwrite the existing record (same id); others are added.
  const planRecipeImport = (parsedRecipes, existingRecipes = []) => {
    const byKey = new Map();
    existingRecipes.forEach((recipe) => {
      const key = recipeImportKey(recipe);
      if (!byKey.has(key)) byKey.set(key, recipe);
    });
    let added = 0;
    let updated = 0;
    const recipes = parsedRecipes.map((parsed) => {
      const key = recipeImportKey(parsed);
      const match = byKey.get(key);
      const recipe = match
        ? {
            ...parsed,
            imageUrl: normalizeImageUrl(parsed.imageUrl),
            id: match.id,
            createdAt: match.createdAt || parsed.createdAt
          }
        : {
            ...parsed,
            imageUrl: normalizeImageUrl(parsed.imageUrl),
            id: parsed.id || window.crypto.randomUUID()
          };
      if (match) updated++; else added++;
      byKey.set(key, recipe);
      return recipe;
    });
    return { recipes, total: parsedRecipes.length, added, updated };
  };

  window.MacroChef.recipeCsv = { 
    parseCSV, 
    parseCSVLine, 
    parseRecipeRow, 
    parseIngredients, 
    parseSteps,
    recipeImportKey,
    planRecipeImport,
    createTemplate 
  };
})();

// Pure calculations for macros and daily goals
window.MacroChef = window.MacroChef || {};

(function () {
const macroCalculations = {
  calculateBasalCalories(goals) {
    const age = Number(goals.age);
    const weight = Number(goals.weight);
    const height = Number(goals.height);
    if (!Number.isFinite(age) || age < 18 || age > 120 ||
        !Number.isFinite(weight) || weight <= 0 || weight > 500 ||
        !Number.isFinite(height) || height < 50 || height > 300 ||
        (goals.sex !== 'female' && goals.sex !== 'male')) {
      return null;
    }
    return 10 * weight + 6.25 * height - 5 * age + (goals.sex === 'female' ? -161 : 5);
  },

  calculateMaintenanceCalories(goals) {
    const basal = macroCalculations.calculateBasalCalories(goals);
    const activity = String(goals.activityPal);
    if (basal === null || !['1.25', '1.45', '1.65', '1.85', '2.2'].includes(activity)) {
      return null;
    }
    return Math.round(basal * Number(activity));
  },

  calculateRecommendedCalories(cpm, userGoal, goals) {
    if (cpm === null) return null;
    const adjustments = { weightLoss: -500, muscleGain: 300, maintenance: 0, healthyHabits: 0 };
    let minimum = 500;
    if (userGoal === 'weightLoss') {
      if (!goals) throw new TypeError('A valid profile is required for a weight-loss recommendation');
      const basal = macroCalculations.calculateBasalCalories(goals);
      if (basal === null) throw new TypeError('A valid profile is required for a weight-loss recommendation');
      minimum = Math.max(minimum, Math.ceil(basal));
    }
    return Math.max(minimum, cpm + (adjustments[userGoal] || 0));
  },

  getDailyTotals(dayKey, plan, recipes) {
    const dayPlan = (plan && plan[dayKey]) || {};
    const totals = { calories: 0, protein: 0, carbs: 0, fats: 0 };

    Object.values(dayPlan).forEach((recipeId) => {
      if (!recipeId) return;
      const rec = (recipes || []).find((r) => r.id === recipeId);
      if (rec) {
        totals.calories += Number(rec.calories) || 0;
        totals.protein += Number(rec.protein) || 0;
        totals.carbs += Number(rec.carbs) || 0;
        totals.fats += Number(rec.fats) || 0;
      }
    });

    return totals;
  },

  calculateMacrosForGoal(goals, cpm) {
    const calories = Number(goals.calories) || 2000;
    const weight = Number(goals.weight) || 70;
    const sex = goals.sex || 'male';
    const userGoal = goals.userGoal || '';

    let protein = 0;
    let fats = 0;
    let carbs = 0;

    if (userGoal === 'weightLoss') {
      // Weight loss: protein 2g/kg, fats 30% of calories, carbs fill remainder
      protein = Math.round(weight * 2);
      fats = Math.round((calories * 0.30) / 9);
      
      // Safety check for women: minimum 0.8g/kg
      if (sex === 'female' && fats < weight * 0.8) {
        fats = Math.round(weight * 0.8);
      }
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else if (userGoal === 'maintenance') {
      // Maintenance: protein 1.6-1.8g/kg (use 1.7), fats 30%, carbs fill remainder
      protein = Math.round(weight * 1.7);
      fats = Math.round((calories * 0.30) / 9);
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else if (userGoal === 'muscleGain') {
      // Muscle gain: protein 1.8g/kg, fats 20-25% (use 22%), carbs 50-55% (use 53%)
      protein = Math.round(weight * 1.8);
      fats = Math.round((calories * 0.22) / 9);
      
      const usedCalories = protein * 4 + fats * 9;
      carbs = Math.max(0, Math.round((calories - usedCalories) / 4));
    } else {
      // Healthy habits: no automatic adjustment, use input values
      protein = Number(goals.protein) || 0;
      carbs = Number(goals.carbs) || 0;
      fats = Number(goals.fats) || 0;
    }

    // Adjust carbs for rounding without producing negative grams.
    const calculatedCalories = protein * 4 + carbs * 4 + fats * 9;
    if (calculatedCalories !== calories && userGoal !== 'healthyHabits') {
      const difference = calories - (protein * 4 + fats * 9);
      carbs = Math.max(0, Math.round(difference / 4));
    }

    return { protein, carbs, fats };
  },

  calculateDistribution(goals, cpm) {
    const calories = Number(goals.calories) || 2000;
    let protein = Number(goals.protein) || 0;
    let carbs = Number(goals.carbs) || 0;
    let fats = Number(goals.fats) || 0;

    // If a goal is selected and we have CPM, recalculate macros
    if (goals.userGoal && goals.userGoal !== 'healthyHabits' && cpm) {
      const calculated = macroCalculations.calculateMacrosForGoal(goals, cpm);
      protein = calculated.protein;
      carbs = calculated.carbs;
      fats = calculated.fats;
    }

    const proteinKcal = protein * 4;
    const carbsKcal = carbs * 4;
    const fatsKcal = fats * 9;

    return {
      protein,
      carbs,
      fats,
      proteinKcal,
      carbsKcal,
      fatsKcal,
      proteinPercent: calories > 0 ? Math.round((proteinKcal / calories) * 100) : 0,
      carbsPercent: calories > 0 ? Math.round((carbsKcal / calories) * 100) : 0,
      fatsPercent: calories > 0 ? Math.round((fatsKcal / calories) * 100) : 0,
      totalKcal: proteinKcal + carbsKcal + fatsKcal
    };
  }
};
window.MacroChef.macroCalculations = Object.freeze(macroCalculations);
})();

// Aggregation engine for whole-package shopping lists & food waste reduction
window.MacroChef = window.MacroChef || {};

window.MacroChef.shoppingAggregator = {
  getRecipePlanCounts(plan) {
    const counts = {};
    if (!plan) return counts;
    Object.values(plan).forEach((dayMeals) => {
      if (!dayMeals) return;
      Object.values(dayMeals).forEach((recipeId) => {
        if (recipeId) {
          counts[recipeId] = (counts[recipeId] || 0) + 1;
        }
      });
    });
    return counts;
  },

  calculateShoppingList(plan, recipes, lang) {
    const { getLocalized } = window.MacroChef.helpers;
    const recipePlanCounts = this.getRecipePlanCounts(plan);
    const map = {};

    Object.entries(recipePlanCounts).forEach(([recipeId, timesPlanned]) => {
      const rec = (recipes || []).find((r) => r.id === recipeId);
      if (!rec || !rec.ingredients) return;

      const scaleFactor = timesPlanned / (rec.servings || 1);

      rec.ingredients.forEach((ing) => {
        const ingName = getLocalized(ing.name, lang);
        const key = ingName.toLowerCase().trim();
        const requiredAmount = (Number(ing.amount) || 0) * scaleFactor;
        const pkgSize = Number(ing.packageSize) || Number(ing.amount) || 1;

        if (!map[key]) {
          map[key] = {
            name: ingName,
            totalRequired: 0,
            unit: ing.unit || 'g',
            packageSize: pkgSize,
            packageUnit: ing.packageUnit || ing.unit || 'g',
            recipesUsedIn: new Set()
          };
        }

        map[key].totalRequired += requiredAmount;
        map[key].recipesUsedIn.add(getLocalized(rec.name, lang));
      });
    });

    return Object.values(map).map((item) => {
      const packagesNeeded = Math.ceil(item.totalRequired / item.packageSize) || 1;
      const totalBoughtAmount = packagesNeeded * item.packageSize;
      const leftoverAmount = Math.max(0, totalBoughtAmount - item.totalRequired);

      return {
        ...item,
        packagesNeeded,
        totalBoughtAmount,
        leftoverAmount,
        recipesUsedIn: Array.from(item.recipesUsedIn)
      };
    });
  }
};

window.MacroChef = window.MacroChef || {};

(function () {
  const client = window.MacroChef.supabaseClient;
  const cacheKey = 'macrochef-verified-session';
  const sessionKey = 'macrochef-supabase-session';
  const logoutKey = 'macrochef-local-signout';
  const roles = ['Admin', 'Tester', 'UserWithAdvertisement'];
  const listeners = new Set();
  let generation = 0;
  let autoRefreshStopped = false;

  async function stopRefresh() {
    autoRefreshStopped = true;
    await client.auth.stopAutoRefresh();
  }

  async function resumeRefresh() {
    if (!autoRefreshStopped) return;
    await client.auth.startAutoRefresh();
    autoRefreshStopped = false;
  }

  function reportRefreshError(error) {
    console.error('Supabase session refresh configuration failed:', error);
  }

  function notify(event = 'refresh') {
    listeners.forEach((listener) => listener(event));
  }

  function readCache() {
    const raw = localStorage.getItem(cacheKey);
    if (!raw) return null;
    let value;
    try {
      value = JSON.parse(raw);
    } catch (error) {
      throw new Error('Invalid cached account data', { cause: error });
    }
    if (!value || typeof value.userId !== 'string' || typeof value.email !== 'string' ||
        value.issuer !== client.supabaseUrl || value.tenantId !== client.supabaseUrl ||
        !roles.includes(value.role)) {
      throw new Error('Invalid cached account data');
    }
    return value;
  }

  async function getSessionAndRole() {
    if (!client) return null;
    if (localStorage.getItem(logoutKey)) return null;
    if (navigator.onLine === false) {
      const cached = readCache();
      return cached ? { ...cached, offline: true } : null;
    }
    const started = generation;
    const { data: sessionData, error: sessionError } = await client.auth.getSession();
    if (sessionError) throw sessionError;
    if (started !== generation) throw new Error('Session changed during verification');
    if (!sessionData.session) {
      if (started === generation) localStorage.removeItem(cacheKey);
      return null;
    }
    const { data: userData, error: userError } = await client.auth.getUser();
    if (userError) {
      if (started === generation && (userError.status === 401 || userError.status === 403)) {
        localStorage.removeItem(cacheKey);
        return null;
      }
      throw userError;
    }
    if (!userData.user || !userData.user.id || !userData.user.email) {
      throw new Error('Verified user is missing an ID or email');
    }
    const { data: profile, error: profileError } = await client.from('user_profiles')
      .select('role').eq('user_id', userData.user.id).single();
    if (profileError) throw profileError;
    if (!profile || !roles.includes(profile.role)) throw new Error('Invalid account role');
    if (started !== generation) throw new Error('Session changed during verification');
    const result = {
      userId: userData.user.id,
      email: userData.user.email,
      role: profile.role,
      issuer: client.supabaseUrl,
      tenantId: client.supabaseUrl
    };
    localStorage.setItem(cacheKey, JSON.stringify(result));
    return { ...result, offline: false };
  }

  function requireClient() {
    if (!client) throw new Error('Online accounts are unavailable');
    if (navigator.onLine === false) throw new Error('Internet connection required');
  }

  async function signUp(email, password) {
    requireClient();
    const { data, error } = await client.auth.signUp({ email, password });
    if (error) throw error;
    if (data.session) {
      localStorage.removeItem(logoutKey);
      await resumeRefresh();
      await getSessionAndRole();
      notify();
    }
    return data;
  }

  async function signIn(email, password) {
    requireClient();
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    localStorage.removeItem(logoutKey);
    await resumeRefresh();
    await getSessionAndRole();
    notify();
    return data;
  }

  async function signOut() {
    if (!client) return;
    if (navigator.onLine === false) {
      await stopRefresh();
      localStorage.removeItem(sessionKey);
      localStorage.removeItem(`${sessionKey}-code-verifier`);
    } else {
      const { error } = await client.auth.signOut({ scope: 'local' });
      if (error) throw error;
    }
    generation++;
    localStorage.setItem(logoutKey, '1');
    localStorage.removeItem(cacheKey);
    notify('changing');
    notify();
  }

  function subscribe(listener) {
    listeners.add(listener);
    return () => listeners.delete(listener);
  }

  if (client) {
    if (localStorage.getItem(logoutKey)) stopRefresh().catch(reportRefreshError);
    client.auth.onAuthStateChange((event) => {
      if (event === 'INITIAL_SESSION') return;
      if (event === 'SIGNED_OUT' && navigator.onLine === false) return;
      if (event === 'TOKEN_REFRESHED') return;
      generation++;
      if (event === 'SIGNED_OUT') {
        localStorage.setItem(logoutKey, '1');
        localStorage.removeItem(cacheKey);
        stopRefresh().catch(reportRefreshError);
      }
      notify('changing');
      window.setTimeout(notify, 0);
    });
    window.addEventListener('online', () => {
      if (!localStorage.getItem(logoutKey)) resumeRefresh().catch(reportRefreshError);
      notify();
    });
    window.addEventListener('storage', (event) => {
      if (event.key === cacheKey || event.key === sessionKey || event.key === logoutKey) {
        generation++;
        if ((event.key === sessionKey && event.newValue === null) ||
            (event.key === logoutKey && event.newValue)) {
          stopRefresh().catch(reportRefreshError);
          localStorage.removeItem(cacheKey);
        }
        if (event.key === logoutKey && event.newValue === null && navigator.onLine !== false) {
          resumeRefresh().catch(reportRefreshError);
        }
        notify('changing');
        notify();
      }
    });
  }

  window.MacroChef.auth = { signUp, signIn, signOut, getSessionAndRole, subscribe };
})();

    // Older builds seeded these demo recipes locally; the shared library now comes only from Supabase.
    async removeLegacyDemoRecipes() {
      await this.db.transaction('rw', this.db.recipes, this.db.SyncState, async () => {
        const syncedIds = new Set((await this.db.SyncState.toArray())
          .filter((state) => state.table === 'recipes')
          .map((state) => state.recordId));
        const demoIds = (await this.db.recipes.toArray())
          .filter((recipe) => {
            const name = recipe.name && typeof recipe.name === 'object' ? recipe.name.en : recipe.name;
            return LEGACY_DEMO_RECIPE_NAMES.has(name) && !syncedIds.has(recipe.id);
          })
          .map((recipe) => recipe.id);

    async seedProducts() {
      const catalog = window.MacroChef.LIDL_PRODUCTS || [];
      await this.db.transaction('rw', this.db.products, this.db.SyncState, async () => {
        const existing = await this.db.products.toArray();
        const syncedIds = new Set((await this.db.SyncState.toArray())
          .filter((state) => state.table === 'products')
          .map((state) => state.recordId));
        const managedProducts = existing.filter((product) =>
          !syncedIds.has(product.id) && (product.catalogSource === 'lidl-pl-official' ||
          (product.categoryName && typeof product.categoryName === 'object'))
        );
        const managedBySourceId = new Map(
          managedProducts
            .filter((product) => product.sourceProductId)
            .map((product) => [product.sourceProductId, product])
        );
        const retainedIds = new Set();

        for (const product of managedProducts) {
          if (product.catalogSource !== 'lidl-pl-official' || !product.sourceProductId) {
            await this.db.products.delete(product.id);
          }
        }

        for (const product of catalog) {
          const current = managedBySourceId.get(product.id);
          const updated = {
            ...product,
            id: current ? current.id : createId('product'),
            catalogSource: 'lidl-pl-official',
            sourceProductId: product.id
          };
          retainedIds.add(updated.id);
          if (!current || JSON.stringify(current) !== JSON.stringify(updated)) {
            await this.db.products.put(updated);
          }
        }

        const currentManaged = (await this.db.products.toArray())
          .filter((product) => product.catalogSource === 'lidl-pl-official' && !syncedIds.has(product.id));
        for (const product of currentManaged) {
          if (!retainedIds.has(product.id)) await this.db.products.delete(product.id);
        }
      });
    }

            }));
            if (JSON.stringify(normalizedIngredients) !== JSON.stringify(normalized.ingredients)) {

    async finishGuestMigration(data, accepted) {
      return this.mutations.transaction(
        [this.db.recipes, this.db.plannerEntries, this.db.migrationState],
        async ({ put, update }) => {
          if (await this.db.migrationState.get('guest-import')) return;
          if (accepted) {
            const ids = new Map();
            for (const recipe of data.recipes) {
              const copied = { ...recipe, id: createId('rec') };
              ids.set(recipe.id, copied.id);
              if (this.role === 'Tester' || this.role === 'UserWithAdvertisement') {
                await this.db.recipes.put(copied);
              } else {
                await put(this.db.recipes, copied);
              }
            }
            for (const source of data.plans) {
              const current = await this.db.plannerEntries.where('dayKey').equals(source.dayKey).first();
              const changes = {};
              slots.forEach((slot) => {
                if ((!current || !current[slot]) && source[slot] && !ids.has(source[slot])) {
                  throw new Error('Guest plan references a missing recipe');
                }
                if ((!current || !current[slot]) && ids.has(source[slot])) {
                  changes[slot] = ids.get(source[slot]);
                }
              });
              if (!Object.keys(changes).length) continue;
              if (current) {
                await update(this.db.plannerEntries, current.id, changes);
              } else {
                await put(this.db.plannerEntries, { id: createId('plan'), dayKey: source.dayKey, ...changes });
              }
            }
          }
          await this.db.migrationState.add({ id: 'guest-import', userId: this.userId });
        }
      );
    }

      });
    }

(function () {
  function validateScope(scope) {
    if (!scope || typeof scope !== 'object') throw new TypeError('Account scope is required');
    ['issuer', 'tenantId', 'userId'].forEach((key) => {
      if (typeof scope[key] !== 'string' || !scope[key].trim()) {
        throw new TypeError(`Account scope ${key} must be a non-empty string`);
      }
    });
  }

  async function createScopedRepository(scope) {
    validateScope(scope);
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error('Web Crypto is required to derive an account database name');
    }
    const identity = JSON.stringify([scope.issuer, scope.tenantId, scope.userId]);
    const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(identity));
    const suffix = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
    const databaseName = `MacroChef-account-${suffix}`;
    return {
      repository: new window.MacroChef.DexieCalorieRepository(databaseName, {
        seedDefaults: true, userId: scope.userId, role: scope.role
      }),
      shoppingStorageKey: `macrochef_checked_${suffix}`
    };
  }

  window.MacroChef.createScopedRepository = createScopedRepository;
})();

      let abort;
      const stopped = new Promise((resolve, reject) => {
        abort = () => reject(new DOMException('Synchronization stopped', 'AbortError'));
        signal.addEventListener('abort', abort, { once: true });
      });
      try {
        return await Promise.race([promise, stopped]);
      } finally {
        signal.removeEventListener('abort', abort);
      }
    }

    async request(table, params, method = 'GET', body) {
      this.checkActive();
      const { client } = this.scope;
      const url = new URL(`/rest/v1/${table}`, client.supabaseUrl);
      Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
      const response = await fetch(url.href, {
        method,
        headers: {
          apikey: client.supabaseKey,
          Authorization: `Bearer ${this.token}`,
          'Content-Type': 'application/json',
          Prefer: method === 'GET' ? 'count=exact' : 'return=representation'
        },
        body: body === undefined ? undefined : JSON.stringify(body),
        signal: this.controller.signal,
        cache: 'no-store'
      });
      this.checkActive();
      if (!response.ok) throw new Error(`Supabase ${table}: HTTP ${response.status}`);
      const data = await response.json();
      this.checkActive();
      return { status: response.status, data, range: response.headers.get('content-range') };
    }

    async readAll(table) {
      const rows = [];
      let total;
      do {
        const params = { select: '*', order: 'id.asc', limit: '1000', offset: String(rows.length) };
        if (table === 'planner' || table === 'goals') params.user_id = `eq.${this.scope.userId}`;
        const response = await this.request(table, params);
        const match = response.range && response.range.match(/\/(\d+)$/);
        if (!match || !Array.isArray(response.data)) throw new Error(`Invalid ${table} response`);
        total = Number(match[1]);
        if (!response.data.length && rows.length < total) throw new Error(`Incomplete ${table} response`);
        rows.push(...response.data);
      } while (rows.length < total);
      return rows;
    }

    async readRemote() {
      const result = {};
      const states = await this.scope.repository.db.SyncState.toArray();
      for (const [local, remote] of Object.entries(remoteTables)) {
        result[local] = await this.readAll(remote);
        const ids = new Set(result[local].map((row) => row.id));
        for (const state of states.filter((item) => item.table === local && !ids.has(item.recordId))) {
          const params = { select: '*', id: `eq.${state.recordId}` };
          if (remote === 'planner' || remote === 'goals') params.user_id = `eq.${this.scope.userId}`;
          const response = await this.request(remote, params);
          if (!Array.isArray(response.data) || response.data.length > 1) {
            throw new Error(`Invalid ${remote} record response`);
          }
          if (response.data.length) result[local].push(response.data[0]);
        }
        for (const row of result[local]) {
          if (!row || typeof row.id !== 'string' || !row.id ||
              typeof row.updated_at !== 'string' || Number.isNaN(Date.parse(row.updated_at)) ||
              (local !== 'products' && (!row.data || typeof row.data !== 'object' || Array.isArray(row.data))) ||
              (local === 'plannerEntries' && typeof row.day_key !== 'string') ||
              ((local === 'plannerEntries' || local === 'goals') && row.user_id !== this.scope.userId)) {
            throw new Error(`Invalid ${remote} record`);
          }
        }
      }
      return result;
    }

    async sync() {
      if (navigator.onLine === false) {
        this.setStatus('offline');
        return;
      }
      this.setStatus('syncing');
      const { data, error } = await this.abortable(this.scope.client.auth.getSession());
      this.checkActive();
      if (error) throw error;
      const session = data && data.session;
      if (!session || !session.access_token || !session.user || session.user.id !== this.scope.userId) {
        throw new Error('Active session does not match the synchronization account');
      }
      const verified = await this.abortable(this.scope.client.auth.getUser(session.access_token));
      this.checkActive();
      if (verified.error) throw verified.error;
      if (!verified.data || !verified.data.user || verified.data.user.id !== this.scope.userId) {
        throw new Error('Verified token does not match the synchronization account');
      }
      this.token = session.access_token;
      let remote = await this.readRemote();
      const db = this.scope.repository.db;
      const queue = await db.OutboxQueue.toArray();
      queue.sort((a, b) => (a.sequence || 0) - (b.sequence || 0) || a.timestamp - b.timestamp);
      const conflicts = [];
      const blocked = new Set();
      for (const queued of queue) {
        this.checkActive();
        const entry = await db.OutboxQueue.get(queued.id);
        if (!entry) continue;
        if (!remoteTables[entry.table]) {
          conflicts.push(`Unsupported queued table: ${entry.table}`);
          continue;
        }
        const key = `${entry.table}:${entry.payload.id}`;
        if (blocked.has(key)) continue;
        try {
          await this.push(entry, remote);
        } catch (error) {
          if (this.stopped) throw error;
          blocked.add(key);
          conflicts.push(error.message);
        }
      }
      remote = await this.readRemote();
      await this.pull(remote, conflicts);
      this.checkActive();
      this.setStatus(conflicts.length ? 'conflict' : 'synced', conflicts.join('; ') || null);
    }

    async push(entry, remote) {
      const db = this.scope.repository.db;
      const table = entry.table;
      const id = entry.payload.id;
      if (!['create', 'update', 'delete'].includes(entry.action)) {
        throw new Error(`Invalid queued action: ${table}/${id}`);
      }
      if (!entry.sequence) throw new Error(`Legacy queued change requires review: ${table}/${id}`);
      const current = remote[table].find((row) => row.id === id);
      if (entry.baseUpdatedAt && (!current || current.updated_at !== entry.baseUpdatedAt)) {
        throw new Error(`Server version changed: ${table}/${id}`);
      }
      if (!entry.baseUpdatedAt && current && entry.action !== 'create') {
        throw new Error(`Missing server baseline: ${table}/${id}`);
      }
      let record;
      if (entry.action !== 'delete') {
        if (entry.action === 'create') record = entry.payload;
        else if (entry.payload.value) record = entry.payload.value;
        else if (entry.payload.changes && current) record = applyChanges(fromRemote(table, current), entry.payload.changes);
        else if (entry.payload.changes && entry.snapshot) record = applyChanges(entry.snapshot, entry.payload.changes);
        else throw new Error(`Invalid queued change: ${table}/${id}`);
        if (table === 'plannerEntries') {
          const known = new Set(remote.recipes.map((row) => row.id));
          if (slots.some((slot) => record[slot] && !known.has(record[slot]))) {
            throw new Error(`Plan references local-only recipes: ${record.dayKey}`);
          }
        }
        if (table === 'plannerEntries' && remote[table].some((row) => row.id !== id && row.day_key === record.dayKey)) {
          throw new Error(`Another server plan exists: ${record.dayKey}`);
        }
        if (table === 'goals' && remote[table].some((row) => row.id !== id)) {
          throw new Error('Another server goals record exists');
        }
      }
      const payload = record && toRemote(table, record, this.scope.userId);
      if (current && !entry.baseUpdatedAt && entry.action === 'create') {
        const comparable = { ...current };
        delete comparable.updated_at;
        if (!same(comparable, payload)) throw new Error(`Server record already exists: ${table}/${id}`);
      }
      if (entry.action === 'delete' && !current) throw new Error(`Cannot confirm deletion: ${table}/${id}`);
      const params = { select: '*' };
      let method;
      if (!current) {
        method = 'POST';
      } else {
        method = entry.action === 'delete' ? 'DELETE' : 'PATCH';
        params.id = `eq.${id}`;
        params.updated_at = `eq.${current.updated_at}`;
        if (table !== 'products' && table !== 'recipes') params.user_id = `eq.${this.scope.userId}`;
      }
      const response = await this.request(remoteTables[table], params, method, method === 'DELETE' ? undefined : payload);
      if (![200, 201].includes(response.status) || !Array.isArray(response.data) ||
          response.data.length !== 1 || response.data[0].id !== id ||
          typeof response.data[0].updated_at !== 'string' ||
          Number.isNaN(Date.parse(response.data[0].updated_at)) ||
          (table !== 'products' && table !== 'recipes' && response.data[0].user_id !== this.scope.userId)) {
        throw new Error(`Write not acknowledged: ${table}/${id}`);
      }
      const acknowledged = response.data[0];
      await db.transaction('rw', db.OutboxQueue, db.SyncState, async () => {
        this.checkActive();
        if (entry.action === 'delete') await db.SyncState.delete(`${table}:${id}`);
        else await db.SyncState.put({ id: `${table}:${id}`, table, recordId: id, updatedAt: acknowledged.updated_at });
        await db.OutboxQueue.delete(entry.id);
        const pending = await db.OutboxQueue.toArray();
        for (const later of pending) {
          if (later.table === table && later.payload.id === id && later.sequence > entry.sequence &&
              later.baseUpdatedAt === entry.baseUpdatedAt) {
            await db.OutboxQueue.update(later.id, { baseUpdatedAt: entry.action === 'delete' ? null : acknowledged.updated_at });
          }
        }
      });
      const index = remote[table].findIndex((row) => row.id === id);
      if (index >= 0) remote[table].splice(index, 1);
      if (entry.action !== 'delete') remote[table].push(acknowledged);
    }

    async pull(remote, conflicts) {
      const db = this.scope.repository.db;
      await db.transaction('rw', db.products, db.recipes, db.plannerEntries, db.goals, db.OutboxQueue, db.SyncState, async () => {
        this.checkActive();
        const queued = await db.OutboxQueue.toArray();
        const states = await db.SyncState.toArray();
        for (const [table, rows] of Object.entries(remote)) {
          const seen = new Set(rows.map((row) => row.id));
          for (const state of states.filter((item) => item.table === table && !seen.has(item.recordId))) {
            if (queued.some((item) => item.table === table && item.payload.id === state.recordId)) {
              conflicts.push(`Server deleted a locally changed record: ${table}/${state.recordId}`);
              continue;
            }
            await db.table(table).delete(state.recordId);
            await db.SyncState.delete(state.id);
          }
          for (const row of rows) {
            this.checkActive();
            if (queued.some((item) => item.table === table && item.payload.id === row.id)) continue;
            const value = fromRemote(table, row);
            if (table === 'plannerEntries' && slots.some((slot) =>
              value[slot] && !remote.recipes.some((recipe) => recipe.id === value[slot]))) {
              conflicts.push(`Server plan references unavailable recipes: ${value.dayKey}`);
              continue;
            }
            if (table === 'plannerEntries' || table === 'goals') {
              const others = table === 'plannerEntries'
                ? await db.plannerEntries.where('dayKey').equals(value.dayKey).toArray()
                : await db.goals.toArray();
              if (others.some((item) => item.id !== row.id)) {
                conflicts.push(`Local and server records differ: ${table}/${row.id}`);
                continue;
              }
            }
            const existing = await db.table(table).get(row.id);
            const state = await db.SyncState.get(`${table}:${row.id}`);
            if (existing && !state && !same(existing, value)) {
              conflicts.push(`Local record has no server baseline: ${table}/${row.id}`);
              continue;
            }
            await db.table(table).put(value);
            await db.SyncState.put({ id: `${table}:${row.id}`, table, recordId: row.id, updatedAt: row.updated_at });
          }
        }
      });
    }
  }

  window.MacroChef.AppSyncManager = AppSyncManager;
})();

// React 18 external-store hook for Dexie liveQuery observables
window.MacroChef = window.MacroChef || {};

(function () {
  const createExternalStore = (observable, initialData) => {
    let snapshot = { data: initialData, loading: true, error: null };
    let subscription = null;
    const listeners = new Set();

    const notify = () => {
      listeners.forEach((listener) => listener());
    };

    return {
      getSnapshot() {
        return snapshot;
      },

      subscribe(listener) {
        listeners.add(listener);
        if (!subscription) {
          try {
            subscription = observable.subscribe({
              next(data) {
                snapshot = { data, loading: false, error: null };
                notify();
              },
              error(error) {
                snapshot = { ...snapshot, loading: false, error };
                notify();
              }
            });
          } catch (error) {
            snapshot = { ...snapshot, loading: false, error };
            notify();
          }
        }

        return () => {
          listeners.delete(listener);
          if (listeners.size === 0 && subscription) {
            subscription.unsubscribe();
            subscription = null;
          }
        };
      }
    };
  };

  const useRepositoryQuery = (createObservable, dependencies, initialData) => {
    const observable = React.useMemo(createObservable, dependencies);
    const store = React.useMemo(
      () => createExternalStore(observable, initialData),
      [observable, initialData]
    );
    return React.useSyncExternalStore(store.subscribe, store.getSnapshot, store.getSnapshot);
  };

  window.MacroChef.useRepositoryQuery = useRepositoryQuery;
})();

// Safe, reliable Lucide Icon React component
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  function Icon({ name, className = 'w-4 h-4', ...props }) {
    const spanRef = React.useRef(null);

    React.useEffect(() => {
      if (!spanRef.current) return;

      if (window.lucide && window.lucide.icons) {
        const { toPascalCase } = window.MacroChef.helpers;
        const pascalName = toPascalCase(name);
        const iconDef = window.lucide.icons[pascalName] || window.lucide.icons[name];

        if (iconDef && typeof iconDef.toSvg === 'function') {
          spanRef.current.innerHTML = iconDef.toSvg({ class: className });
          return;
        }
      }

      // Fallback with isolated createIcons root
      spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons({ root: spanRef.current });
      }
    }, [name, className]);

    return (
      <span
        ref={spanRef}
        className="inline-flex items-center justify-center shrink-0 pointer-events-none"
        {...props}
      />
    );
  }

  window.MacroChef.components.Icon = Icon;
})();

window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  function AuthModal({ session, onClose }) {
    const { t } = window.MacroChef.useI18n();
    const [register, setRegister] = React.useState(false);
    const [email, setEmail] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [error, setError] = React.useState('');
    const [message, setMessage] = React.useState('');
    const [busy, setBusy] = React.useState(false);

    async function submit(event) {
      event.preventDefault();
      setBusy(true);
      setError('');
      setMessage('');
      try {
        const result = register
          ? await window.MacroChef.auth.signUp(email.trim(), password)
          : await window.MacroChef.auth.signIn(email.trim(), password);
        setPassword('');
        if (register && !result.session) setMessage(t.authConfirmEmail);
      } catch (err) {
        console.error('Authentication failed:', err);
        if (!window.MacroChef.supabaseClient) setError(t.authUnavailable);
        else if (navigator.onLine === false) setError(t.authOfflineError);
        else if (err.code === 'invalid_credentials') setError(t.authInvalidCredentials);
        else if (err.code === 'user_already_exists') setError(t.authAlreadyRegistered);
        else if (err.code === 'email_not_confirmed') setError(t.authConfirmEmail);
        else setError(t.authError);
      } finally {
        setBusy(false);
      }
    }

    async function signOut() {
      setBusy(true);
      setError('');
      try {
        await window.MacroChef.auth.signOut();
      } catch (err) {
        console.error('Sign-out failed:', err);
        setError(t.authSignOutError);
        setBusy(false);
      }
    }

    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div role="dialog" aria-modal="true" aria-labelledby="auth-title" className="w-full max-w-md rounded-2xl bg-white dark:bg-slate-800 p-6 shadow-xl">
          <div className="flex items-center justify-between mb-4">
            <h2 id="auth-title" className="text-xl font-bold">{t.authTitle}</h2>
            <button type="button" onClick={onClose} aria-label={t.authClose}>✕</button>
          </div>
          {session ? (
            <div className="space-y-4">
              <p>{t.authEmail}: {session.email}</p>
              <p>{t.authRole}: {t[`authRole${session.role}`]}</p>
              {session.offline && <p role="status">{t.authOfflineSession}</p>}
              <button type="button" disabled={busy} onClick={signOut} className="rounded-lg bg-emerald-600 px-4 py-2 text-white disabled:opacity-50">{t.authSignOut}</button>
            </div>
          ) : (
            <form onSubmit={submit} className="space-y-4">
              <label className="block">{t.authEmail}
                <input className="block w-full rounded-lg border p-2 text-slate-900" type="email" autoComplete="email" required value={email} onChange={(event) => setEmail(event.target.value)} />
              </label>
              <label className="block">{t.authPassword}
                <input className="block w-full rounded-lg border p-2 text-slate-900" type="password" autoComplete={register ? 'new-password' : 'current-password'} minLength="6" required value={password} onChange={(event) => setPassword(event.target.value)} />
              </label>
              <button type="submit" disabled={busy} className="rounded-lg bg-emerald-600 px-4 py-2 text-white disabled:opacity-50">{register ? t.authSignUp : t.authSignIn}</button>
              <button type="button" disabled={busy} className="block underline" onClick={() => { setRegister(!register); setError(''); setMessage(''); }}>
                {register ? t.authSwitchSignIn : t.authSwitchSignUp}
              </button>
            </form>
          )}
          {error && <p role="alert" className="mt-4 text-red-600">{error}</p>}
          {message && <p role="status" className="mt-4">{message}</p>}
        </div>
      </div>
    );
  }

  window.MacroChef.components.AuthModal = AuthModal;
})();

// Recipe Picker Modal Component for selecting recipes from the library into the meal schedule
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { Icon } = window.MacroChef.components;
  const { getLocalized } = window.MacroChef.helpers;

  function matchesCategory(recipeCat, targetCatKey) {
    if (!targetCatKey || targetCatKey === 'all') return true;
    if (!recipeCat) return false;
    const enVal = (typeof recipeCat === 'object' ? recipeCat.en : recipeCat) || '';
    const plVal = (typeof recipeCat === 'object' ? recipeCat.pl : recipeCat) || '';
    const targetLower = targetCatKey.toLowerCase();
    return (
      enVal.toLowerCase() === targetLower ||
      plVal.toLowerCase() === targetLower ||
      (targetLower === 'breakfast' && (enVal.toLowerCase().includes('breakfast') || plVal.toLowerCase().includes('śniadanie') || plVal.toLowerCase().includes('sniadanie'))) ||
      (targetLower === 'lunch' && (enVal.toLowerCase().includes('lunch') || plVal.toLowerCase().includes('obiad'))) ||
      (targetLower === 'dinner' && (enVal.toLowerCase().includes('dinner') || plVal.toLowerCase().includes('kolacja'))) ||
      (targetLower === 'snack' && (enVal.toLowerCase().includes('snack') || plVal.toLowerCase().includes('przekąska') || plVal.toLowerCase().includes('przekaska')))
    );
  }

  function RecipePickerModal({
    slotInfo,
    recipes,
    onSelectRecipe,
    onClearSlot,
    onClose,
    onCreateRecipe
  }) {
    const { t, lang } = window.MacroChef.useI18n();
    // Categories list for tabs
    const categoryOptions = [
      { key: 'all', label: t.allCategories || 'Wszystkie' },
      { key: 'Breakfast', label: t.breakfast || 'Śniadanie' },
      { key: 'Lunch', label: t.lunch || 'Obiad' },
      { key: 'Dinner', label: t.dinner || 'Kolacja' },
      { key: 'Snack', label: t.snack || 'Przekąska' }
    ];

    // Determine initial category based on slot
    const [selectedCategory, setSelectedCategory] = React.useState(() => {
      if (slotInfo && slotInfo.slotKey) {
        const hasMatching = recipes.some((r) => matchesCategory(r.category, slotInfo.slotKey));
        if (hasMatching) {
          return slotInfo.slotKey;
        }
      }
      return 'all';
    });

    const [searchQuery, setSearchQuery] = React.useState('');

    // Close on Escape key
    React.useEffect(() => {
      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          onClose();
        }
      };
      window.addEventListener('keydown', handleKeyDown);
      return () => window.removeEventListener('keydown', handleKeyDown);
    }, [onClose]);

    // Filter recipes
    const filteredRecipes = React.useMemo(() => {
      return (recipes || []).filter((rec) => {
        // Category check
        if (!matchesCategory(rec.category, selectedCategory)) {
          return false;
        }

        // Search check
        if (searchQuery.trim()) {
          const query = searchQuery.toLowerCase().trim();
          const nameEn = (typeof rec.name === 'object' ? rec.name.en : rec.name) || '';
          const namePl = (typeof rec.name === 'object' ? rec.name.pl : rec.name) || '';
          const categoryName = getLocalized(rec.category, lang).toLowerCase();

          const matchesName = nameEn.toLowerCase().includes(query) || namePl.toLowerCase().includes(query) || categoryName.includes(query);
          
          const matchesIngredients = (rec.ingredients || []).some((ing) => {
            const ingEn = (typeof ing.name === 'object' ? ing.name.en : ing.name) || '';
            const ingPl = (typeof ing.name === 'object' ? ing.name.pl : ing.name) || '';
            return ingEn.toLowerCase().includes(query) || ingPl.toLowerCase().includes(query);
          });

          return matchesName || matchesIngredients;
        }

        return true;
      });
    }, [recipes, selectedCategory, searchQuery, lang]);

    // Count per category
    const categoryCounts = React.useMemo(() => {
      const counts = { all: (recipes || []).length };
      categoryOptions.forEach((cat) => {
        if (cat.key !== 'all') {
          counts[cat.key] = (recipes || []).filter((r) => matchesCategory(r.category, cat.key)).length;
        }
      });
      return counts;
    }, [recipes]);

    return (
      <div
        className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-slate-900/60 backdrop-blur-sm animate-fade-in"
        onClick={(e) => {

        }}
      >

          {/* Header */}

                <Icon name="book-open" className="w-5 h-5" />
              </div>
              <div>
                <h2 className="text-lg sm:text-xl font-bold text-slate-900 dark:text-white flex flex-wrap items-center gap-2">

                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  {t.selectRecipeSub || 'Przeglądaj bibliotekę przepisów i wybierz posiłek dla tego slotu.'}
                </p>
              </div>
            </div>

            <button
              onClick={onClose}
              className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60 rounded-xl transition-colors"
              title={t.cancel || 'Zamknij'}
            >
              <Icon name="x" className="w-5 h-5" />
            </button>
          </div>

          {/* Search & Categories Bar */}
          <div className="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-700/60 space-y-3 bg-white dark:bg-slate-800">
            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">

                  <Icon name="search" className="w-4 h-4" />
                </div>
                <input

                  className="w-full pl-10 pr-4 py-2 text-xs sm:text-sm bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:text-slate-100 placeholder-slate-400"

                />
                {searchQuery && (

            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">

          target.isContentEditable
        )) return;
        if (event.key === 'ArrowLeft') {

        const count = (firstLine.match(new RegExp(candidate === '\t' ? '\\t' : `\\${candidate}`, 'g')) || []).length;
        const selectedCount = (firstLine.match(new RegExp(selected === '\t' ? '\\t' : `\\${selected}`, 'g')) || []).length;

// ==========================================
// Admin Users Management - Full CRUD + Bulk Operations
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { useState, useEffect } = React;

  function AdminUsers({ repository, session }) {
    const [users, setUsers] = useState([]);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [notice, setNotice] = useState('');
    const [selected, setSelected] = useState(new Set());
    const [filterRole, setFilterRole] = useState('');
    const [bulkAction, setBulkAction] = useState('');
    const [bulkNewRole, setBulkNewRole] = useState('');
    const t = window.MacroChef.TRANSLATIONS[localStorage.getItem('macrochef_lang') === 'en' ? 'en' : 'pl'];

    const roles = ['Admin', 'Tester', 'UserWithAdvertisement'];

    // Load all users
    useEffect(() => {
      async function loadUsers() {
        setLoading(true);
        setError('');
        try {
          if (!window.MacroChef.supabaseClient) throw new Error('Supabase not available');
          const { data, error: err } = await window.MacroChef.supabaseClient
            .from('user_profiles')
            .select('user_id, email, role, created_at')
            .order('created_at', { ascending: false });
          
          if (err) throw err;
          setUsers(data || []);
        } catch (err) {
          setError(err.message || 'Failed to load users');
          console.error('Load users error:', err);
        } finally {
          setLoading(false);
        }
      }
      loadUsers();
    }, []);

    const currentUserId = session && session.userId;
    const isSelf = (user) => user.user_id === currentUserId;
    const deleteBlockedReason = (user) => {
      if (isSelf(user)) return t.cannotDeleteSelf || 'You cannot delete your own account';
      if (user.role === 'Admin') return t.demoteAdminBeforeDelete || 'Change the Admin role before deleting this account';
      return '';
    };

    const rpc = async (fn, params) => {
      if (!window.MacroChef.supabaseClient) throw new Error('Supabase not available');
      const { error: err } = await window.MacroChef.supabaseClient.rpc(fn, params);
      if (err) throw err;
    };

    const applyRole = async (userId, newRole) => {
      await rpc('admin_set_user_role', { target_user: userId, new_role: newRole });
      setUsers(prev => prev.map(u => u.user_id === userId ? { ...u, role: newRole } : u));
    };

    const removeUser = async (userId) => {
      await rpc('admin_delete_user', { target_user: userId });
      setUsers(prev => prev.filter(u => u.user_id !== userId));
      setSelected(prev => {
        const newSet = new Set(prev);
        newSet.delete(userId);
        return newSet;
      });
    };

    const updateUserRole = async (userId, newRole) => {
      setError('');
      setNotice('');
      try {
        await applyRole(userId, newRole);
        setNotice(t.userRoleUpdated || 'Role updated');
      } catch (err) {
        setError(err.message);
      }
    };

    const deleteUser = async (user) => {
      setError('');
      setNotice('');
      const blocked = deleteBlockedReason(user);
      if (blocked) {
        setError(blocked);
        return;
      }
      if (!window.confirm(`${t.confirmDeleteUser || 'Delete this account permanently?'}\n${user.email}`)) return;
      try {
        await removeUser(user.user_id);
        setNotice(t.userDeleted || 'Account deleted');
      } catch (err) {
        setError(err.message);
      }
    };

    // Bulk operations
    const executeBulkAction = async () => {
      setError('');
      setNotice('');
      if (selected.size === 0) {
        setError(t.selectItems || 'Select users first');
        return;
      }

      const targets = users.filter(u => selected.has(u.user_id));
      const failures = [];
      let done = 0;

      if (bulkAction === 'changeRole' && bulkNewRole) {
        for (const user of targets) {
          try {
            await applyRole(user.user_id, bulkNewRole);
            done++;
          } catch (err) {
            failures.push(`${user.email}: ${err.message}`);
          }
        }
      } else if (bulkAction === 'delete') {
        const deletable = targets.filter(u => !deleteBlockedReason(u));
        targets.filter(u => deleteBlockedReason(u)).forEach(u => failures.push(`${u.email}: ${deleteBlockedReason(u)}`));
        if (deletable.length === 0) {
          setError(failures.join('\n'));
          return;
        }
        const message = `${t.confirmDeleteUser || 'Delete this account permanently?'} (${deletable.length})\n${deletable.map(u => u.email).join('\n')}`;
        if (!window.confirm(message)) return;
        for (const user of deletable) {
          try {
            await removeUser(user.user_id);
            done++;
          } catch (err) {
            failures.push(`${user.email}: ${err.message}`);
          }
        }
      } else {
        return;
      }

      if (done > 0) setNotice(`${bulkAction === 'delete' ? (t.userDeleted || 'Account deleted') : (t.userRoleUpdated || 'Role updated')}: ${done}`);
      if (failures.length) setError(failures.join('\n'));
      setSelected(new Set());
      setBulkAction('');
      setBulkNewRole('');
    };

    const filteredUsers = filterRole
      ? users.filter(u => u.role === filterRole)
      : users;

    return (
      <div className="space-y-4">
        {error && (
          <div className="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4">
            <p className="text-red-700 dark:text-red-400 text-sm whitespace-pre-line">{error}</p>
          </div>
        )}
        {notice && (
          <div className="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-lg p-4">
            <p className="text-emerald-700 dark:text-emerald-300 text-sm">{notice}</p>
          </div>
        )}

        {/* Controls */}
        <div className="flex flex-col sm:flex-row gap-4">
          {/* Filter */}
          <select
            value={filterRole}
            onChange={(e) => setFilterRole(e.target.value)}
            className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white"
          >
            <option value="">{t.allRoles || 'All Roles'}</option>
            {roles.map(role => (
              <option key={role} value={role}>{role}</option>
            ))}
          </select>

          {/* Bulk Actions */}
          {selected.size > 0 && (
            <div className="flex gap-2 items-center">
              <span className="text-sm text-slate-600 dark:text-slate-400">
                {selected.size} {t.selected || 'selected'}
              </span>
              <select
                value={bulkAction}
                onChange={(e) => setBulkAction(e.target.value)}
                className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white"
              >
                <option value="">{t.action || 'Action...'}</option>
                <option value="changeRole">{t.changeRole || 'Change Role'}</option>
                <option value="delete">{t.deleteUsers || 'Delete Users'}</option>
              </select>

              {bulkAction === 'changeRole' && (
                <select
                  value={bulkNewRole}
                  onChange={(e) => setBulkNewRole(e.target.value)}
                  className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white"
                >
                  <option value="">{t.selectRole || 'Select role...'}</option>
                  {roles.map(role => (
                    <option key={role} value={role}>{role}</option>
                  ))}
                </select>
              )}

              <button
                onClick={executeBulkAction}
                disabled={!bulkAction || (bulkAction === 'changeRole' && !bulkNewRole)}
                className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-400 text-white rounded-lg font-medium transition"
              >
                {t.apply || 'Apply'}
              </button>

              <button
                onClick={() => {
                  setSelected(new Set());
                  setBulkAction('');
                  setBulkNewRole('');
                }}
                className="px-4 py-2 bg-slate-300 dark:bg-slate-600 hover:bg-slate-400 dark:hover:bg-slate-500 text-slate-900 dark:text-white rounded-lg font-medium transition"
              >
                {t.cancel || 'Cancel'}
              </button>
            </div>
          )}
        </div>

        {/* Users Table */}
        {loading ? (
          <div className="text-center py-8 text-slate-600 dark:text-slate-400">
            {t.loading || 'Loading...'}
          </div>
        ) : filteredUsers.length === 0 ? (
          <div className="text-center py-8 text-slate-600 dark:text-slate-400">
            {t.noUsers || 'No users found'}
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-100 dark:bg-slate-700 border-b border-slate-300 dark:border-slate-600">
                <tr>
                  <th className="px-4 py-3 text-left">
                    <input
                      type="checkbox"
                      checked={selected.size === filteredUsers.length && filteredUsers.length > 0}
                      onChange={(e) => {
                        if (e.target.checked) {
                          setSelected(new Set(filteredUsers.map(u => u.user_id)));
                        } else {
                          setSelected(new Set());
                        }
                      }}
                      className="cursor-pointer"
                    />
                  </th>
                  <th className="px-4 py-3 text-left text-slate-700 dark:text-slate-300 font-semibold">{t.email || 'Email'}</th>
                  <th className="px-4 py-3 text-left text-slate-700 dark:text-slate-300 font-semibold">{t.role || 'Role'}</th>
                  <th className="px-4 py-3 text-center text-slate-700 dark:text-slate-300 font-semibold">{t.actions || 'Actions'}</th>
                </tr>
              </thead>
              <tbody>
                {filteredUsers.map(user => (
                  <tr key={user.user_id} className="border-b border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                    <td className="px-4 py-3">
                      <input
                        type="checkbox"
                        checked={selected.has(user.user_id)}
                        onChange={(e) => {
                          const newSet = new Set(selected);
                          if (e.target.checked) {
                            newSet.add(user.user_id);
                          } else {
                            newSet.delete(user.user_id);
                          }
                          setSelected(newSet);
                        }}
                        className="cursor-pointer"
                      />
                    </td>
                    <td className="px-4 py-3 text-slate-900 dark:text-white">{user.email}</td>
                    <td className="px-4 py-3">
                      <select
                        value={user.role}
                        disabled={isSelf(user)}
                        title={isSelf(user) ? (t.cannotChangeOwnRole || 'You cannot change your own role') : ''}
                        onChange={(e) => updateUserRole(user.user_id, e.target.value)}
                        className="px-2 py-1 border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm disabled:opacity-60 disabled:cursor-not-allowed"
                      >
                        {roles.map(role => (
                          <option key={role} value={role}>{role}</option>
                        ))}
                      </select>
                    </td>
                    <td className="px-4 py-3 text-center space-x-2">
                      <button
                        onClick={() => deleteUser(user)}
                        disabled={!!deleteBlockedReason(user)}
                        title={deleteBlockedReason(user)}
                        className="px-3 py-1 bg-red-500 hover:bg-red-600 disabled:bg-slate-400 disabled:cursor-not-allowed text-white rounded text-xs font-medium transition"
                      >
                        {t.delete || 'Delete'}
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {/* Summary */}
        <div className="text-sm text-slate-600 dark:text-slate-400 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg">
          {t.totalUsers || 'Total Users'}: <span className="font-semibold text-slate-900 dark:text-white">{filteredUsers.length}</span>
        </div>
      </div>
    );
  }

  window.MacroChef.components.AdminUsers = AdminUsers;
})();
