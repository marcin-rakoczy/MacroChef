window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { useState, useEffect } = React;

  function AdminRecipes({ repository, session }) {
    const [recipes, setRecipes] = useState([]);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [success, setSuccess] = useState('');
    const [importSummary, setImportSummary] = useState(null);
    const [imageProgress, setImageProgress] = useState(null);
    const [selected, setSelected] = useState(new Set());
    const [searchQuery, setSearchQuery] = useState('');
    const [selectedCategory, setSelectedCategory] = useState(null); // null = all
    const [page, setPage] = useState(0);
    const RECIPES_PER_PAGE = 25;
    const importInputRef = React.useRef(null);
    const t = window.MacroChef.TRANSLATIONS[localStorage.getItem('macrochef_lang') === 'en' ? 'en' : 'pl'];

    // Load all recipes
    useEffect(() => {
      async function loadRecipes() {
        setLoading(true);
        setError('');
        try {
          if (!repository) {
            throw new Error('Repository not available');
          }
          if (typeof repository.getAllRecipes !== 'function') {
            throw new Error('getAllRecipes method not available on repository');
          }
          const all = await repository.getAllRecipes();
          console.log('Loaded recipes:', all);
          setRecipes(all || []);
        } catch (err) {
          const errorMsg = err.message || 'Failed to load recipes';
          setError(errorMsg);
          console.error('Load recipes error:', err);
        } finally {
          setLoading(false);
        }
      }
      loadRecipes();
    }, [repository]);

    // Reset page when search or category changes
    useEffect(() => {
      setPage(0);
    }, [searchQuery, selectedCategory]);

    const lang = localStorage.getItem('macrochef_lang') === 'en' ? 'en' : 'pl';
    const getLocalized = window.MacroChef.helpers.getLocalized;

    const categoryStats = React.useMemo(() => {
      const stats = {};
      recipes.forEach((recipe) => {
        const cat = getLocalized(recipe.category, lang);
        stats[cat] = (stats[cat] || 0) + 1;
      });
      const categories = Object.keys(stats).sort((a, b) => window.MacroChef.helpers.compareMealCategories(a, b, lang));
      return { all: recipes.length, categories, stats };
    }, [recipes, lang]);

    // Filter recipes by search query and selected category
    const filteredRecipes = recipes.filter(recipe => {
      const query = searchQuery.toLowerCase();
      const name = getLocalized(recipe.name, lang).toLowerCase();
      const matchesCategory = !selectedCategory || getLocalized(recipe.category, lang) === selectedCategory;
      return name.includes(query) && matchesCategory;
    });

    const totalPages = Math.ceil(filteredRecipes.length / RECIPES_PER_PAGE);
    const startIndex = page * RECIPES_PER_PAGE;
    const paginatedRecipes = filteredRecipes.slice(startIndex, startIndex + RECIPES_PER_PAGE);

    // Delete recipe
    const deleteRecipe = async (recipeId) => {
      if (!window.confirm(t.confirmDelete || 'Are you sure?')) return;
      try {
        await repository.deleteRecipe(recipeId);
        setRecipes(recipes.filter(r => r.id !== recipeId));
        setSelected(prev => {
          const newSet = new Set(prev);
          newSet.delete(recipeId);
          return newSet;
        });
        setSuccess((t.deleted || 'Deleted') + ' 1 ' + (t.recipe || 'recipe'));
        setTimeout(() => setSuccess(''), 3000);
      } catch (err) {
        setError(err.message);
      }
    };

    // Bulk delete recipes
    const bulkDelete = async () => {
      if (selected.size === 0) {
        setError(t.selectItems || 'Select recipes first');
        return;
      }
      if (!window.confirm(`Delete ${selected.size} recipes?`)) return;

      try {
        for (const recipeId of selected) {
          await repository.deleteRecipe(recipeId);
        }
        setRecipes(recipes.filter(r => !selected.has(r.id)));
        setSelected(new Set());
        setSuccess(`${selected.size} ${t.recipesDeleted || 'recipes deleted'}`);
        setTimeout(() => setSuccess(''), 3000);
      } catch (err) {
        setError(err.message);
      }
    };

    // Import recipes from CSV
    const handleImportCSV = async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      setLoading(true);
      setError('');
      setSuccess('');
      setImportSummary(null);

      try {
        const text = await file.text();
        
        // Use advanced CSV parser that handles:
        // - Polish semicolon-delimited format
        // - Unlimited ingredients (1-20+)
        // - Quote escaping and multiline text
        // - Case-insensitive headers
        const parsedRecipes = window.MacroChef.recipeCsv.parseCSV(text);
        
        if (!Array.isArray(parsedRecipes) || parsedRecipes.length === 0) {
          throw new Error(t.noRecipesInCSV || 'No recipes found in CSV file');
        }

        const existing = (await repository.getAllRecipes()) || [];
        const plan = window.MacroChef.recipeCsv.planRecipeImport(parsedRecipes, existing);
        const processed = await window.MacroChef.recipeImageAI.processBatch(plan.recipes, {
          onProgress: (current, total) => setImageProgress({ current, total }),
          onStatus: () => {}
        });
        for (const recipe of processed) {
          await repository.saveRecipe(recipe);
        }

        const saved = new Map(processed.map((r) => [r.id, r]));
        setRecipes([
          ...existing.map((r) => saved.get(r.id) || r),
          ...processed.filter((r) => !existing.some((e) => e.id === r.id))
        ]);
        setImportSummary({ total: plan.total, added: plan.added, updated: plan.updated });
        event.target.value = '';
      } catch (err) {
        setError(err.message || (t.importError || 'Failed to import recipes'));
        console.error('Import error:', err);
      } finally {
        setImageProgress(null);
        setLoading(false);
      }
    };

    // Download CSV template
    const handleDownloadTemplate = () => {
      const templateContent = `nazwa;kategoria;czasPrzygotowania;porcje;kalorieNaPorcje;bialkoNaPorcje;weglowodanyNaPorcje;tluszczeNaPorcje;urlZdjecia;kroki;skladnik1Nazwa;skladnik1Ilosc;skladnik1Jednostka;skladnik1WielkoscOpakowania;skladnik1CenaOpakowania;skladnik1Notatka
Jajecznica ze Szpinakiem;Śniadanie;10;1;250;20;5;15;;"Rozgrzej masło na patelni|Dodaj szpinak i czosnek|Wlej ubite jajka|Mieszaj aż do usztywnięcia";Jajko;2;szt;300g;15.99zł;"Jajka omega-3"`;;
      const blob = new Blob([templateContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', 'macrochef-recipes-template.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    return (
      <div className="space-y-4">
        {error && (
          <div className="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4">
            <p className="text-red-700 dark:text-red-400 text-sm">{error}</p>
          </div>
        )}

        {success && (
          <div className="bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg p-4">
            <p className="text-green-700 dark:text-green-400 text-sm">{success}</p>
          </div>
        )}

        {importSummary && (
          <div className="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-lg p-4 flex items-start justify-between gap-4">
            <div className="text-sm text-emerald-800 dark:text-emerald-300">
              <p className="font-semibold mb-1">{t.importSummaryTitle || 'Import summary'}</p>
              <p>
                {t.importSummaryTotal || 'Rows in file'}: <strong>{importSummary.total}</strong>
                {' · '}{t.importSummaryAdded || 'Added'}: <strong>{importSummary.added}</strong>
                {' · '}{t.importSummaryUpdated || 'Updated'}: <strong>{importSummary.updated}</strong>
              </p>
            </div>
            <button
              type="button"
              onClick={() => setImportSummary(null)}
              aria-label={t.close || 'Close'}
              className="text-emerald-700 dark:text-emerald-300 hover:text-emerald-900 text-lg leading-none"
            >
              ×
            </button>
          </div>
        )}

        {imageProgress && (
          <div role="status" aria-live="polite" className="bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-800 rounded-lg p-3 text-sm font-medium text-indigo-700 dark:text-indigo-300">
            {t.processingRecipeImages}: {imageProgress.current}/{imageProgress.total}
          </div>
        )}

        {/* Controls */}
        <div className="flex flex-col sm:flex-row gap-4 items-center justify-between">
          {/* Search Box - Left Side */}
          <input
            type="text"
            placeholder={t.search || 'Search recipes...'}
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-slate-800 dark:text-white flex-1"
          />

          <div className="flex items-center gap-4">
            {/* Bulk Delete */}
            {selected.size > 0 && (
              <button
                onClick={bulkDelete}
                className="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition"
              >
                {t.deleteSelected || `Delete ${selected.size} Recipes`}
              </button>
            )}

            {selected.size > 0 && (
              <button
                onClick={() => setSelected(new Set())}
                className="px-4 py-2 bg-slate-300 dark:bg-slate-600 hover:bg-slate-400 dark:hover:bg-slate-500 text-slate-900 dark:text-white rounded-lg font-medium transition"
              >
                {t.cancel || 'Cancel'}
              </button>
            )}

            {/* Import CSV Button - Right Side */}
            <button
              type="button"
              onClick={() => importInputRef.current && importInputRef.current.click()}
              className="flex items-center justify-center gap-2 bg-white dark:bg-slate-800 hover:bg-emerald-50 dark:hover:bg-slate-700 text-emerald-700 dark:text-emerald-300 font-semibold text-xs px-4 py-2.5 rounded-xl border border-emerald-300 dark:border-emerald-700 transition-all whitespace-nowrap"
            >
              <div className="flex flex-col items-center gap-0.5">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
                <div className="w-3 h-0.5 bg-current"></div>
              </div>
              <span>{t.importRecipes || 'Import Recipes'}</span>
            </button>
            <input
              ref={importInputRef}
              type="file"
              accept=".csv,text/csv"
              className="hidden"
              onChange={handleImportCSV}
            />
          </div>
        </div>

        {/* Import Help Section - Right Aligned */}
        <div className="flex flex-col sm:flex-row gap-4 sm:justify-end">
          <div className="space-y-2 text-right">
            <button
              type="button"
              onClick={handleDownloadTemplate}
              className="text-[11px] font-medium text-slate-500 hover:text-emerald-600 dark:text-slate-400 dark:hover:text-emerald-300 underline underline-offset-2"
            >
              {t.downloadRecipeCsvTemplate || 'Download CSV template'}
            </button>
            <p className="text-[10px] text-slate-400 dark:text-slate-500">
              {t.recipeImportHint || 'One recipe per row; separate steps with |. For each ingredient add 5 columns, e.g. ingredient3Name–ingredient3PackageUnit.'}
            </p>
          </div>
        </div>

        {/* Category Filters */}
        <div className="flex flex-wrap gap-2">
          {[null, ...categoryStats.categories].map((cat) => (
            <button
              key={cat === null ? '__all' : cat}
              type="button"
              onClick={() => setSelectedCategory(cat)}
              className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors ${
                selectedCategory === cat
                  ? 'bg-emerald-500 text-white'
                  : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
              }`}
            >
              {cat === null ? (t.allCategories || 'Wszystkie kategorie') : cat}{' '}
              <span className="ml-1">{cat === null ? categoryStats.all : categoryStats.stats[cat]}</span>
            </button>
          ))}
        </div>

        {/* Recipes Table */}
        {loading ? (
          <div className="text-center py-8 text-slate-600 dark:text-slate-400">
            {t.loading || 'Loading...'}
          </div>
        ) : filteredRecipes.length === 0 ? (
          <div className="text-center py-8 text-slate-600 dark:text-slate-400">
            {searchQuery ? (t.noRecipes || 'No recipes found') : (t.noRecipes || 'No recipes found')}
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-100 dark:bg-slate-700 border-b border-slate-300 dark:border-slate-600">
                <tr>
                  <th className="px-4 py-3 text-left">
                    <input
                      type="checkbox"
                      checked={paginatedRecipes.length > 0 && paginatedRecipes.every(r => selected.has(r.id))}
                      onChange={(e) => {
                        if (e.target.checked) {
                          const newSet = new Set(selected);
                          paginatedRecipes.forEach(r => newSet.add(r.id));
                          setSelected(newSet);
                        } else {
                          const newSet = new Set(selected);
                          paginatedRecipes.forEach(r => newSet.delete(r.id));
                          setSelected(newSet);
                        }
                      }}
                      className="cursor-pointer"
                    />
                  </th>
                  <th className="px-4 py-3 text-left text-slate-700 dark:text-slate-300 font-semibold">{t.name || 'Name'}</th>
                  <th className="px-4 py-3 text-left text-slate-700 dark:text-slate-300 font-semibold">{t.category || 'Category'}</th>
                  <th className="px-4 py-3 text-center text-slate-700 dark:text-slate-300 font-semibold">{t.calories || 'Calories'}</th>
                  <th className="px-4 py-3 text-center text-slate-700 dark:text-slate-300 font-semibold">{t.protein || 'Protein'}</th>
                  <th className="px-4 py-3 text-center text-slate-700 dark:text-slate-300 font-semibold">{t.carbs || 'Carbs'}</th>
                  <th className="px-4 py-3 text-center text-slate-700 dark:text-slate-300 font-semibold">{t.fat || 'Fat'}</th>
                  <th className="px-4 py-3 text-center text-slate-700 dark:text-slate-300 font-semibold">{t.actions || 'Actions'}</th>
                </tr>
              </thead>
              <tbody>
                {paginatedRecipes.map(recipe => (
                  <tr key={recipe.id} className="border-b border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                    <td className="px-4 py-3">
                      <input
                        type="checkbox"
                        checked={selected.has(recipe.id)}
                        onChange={(e) => {
                          const newSet = new Set(selected);
                          if (e.target.checked) {
                            newSet.add(recipe.id);
                          } else {
                            newSet.delete(recipe.id);
                          }
                          setSelected(newSet);
                        }}
                        className="cursor-pointer"
                      />
                    </td>
                    <td className="px-4 py-3 text-slate-900 dark:text-white font-medium">
                      <div className="flex items-center gap-3 min-w-0">
                        <img
                          src={window.MacroChef.recipeImages.getUrl(recipe)}
                          onError={window.MacroChef.recipeImages.handleError}
                          alt={getLocalized(recipe.name, lang)}
                          loading="lazy"
                          className="w-11 h-11 shrink-0 aspect-square object-cover rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-100"
                        />
                        <span className="truncate">{getLocalized(recipe.name, lang)}</span>
                      </div>
                    </td>
                    <td className="px-4 py-3 text-slate-900 dark:text-white">
                      {window.MacroChef.helpers.getLocalized(recipe.category, localStorage.getItem('macrochef_lang') === 'en' ? 'en' : 'pl') || '-'}
                    </td>
                    <td className="px-4 py-3 text-center text-slate-700 dark:text-slate-300">{Math.round(recipe.caloriesPerServing || recipe.calories || 0)}</td>
                    <td className="px-4 py-3 text-center text-slate-700 dark:text-slate-300">{Math.round(recipe.proteinPerServing || recipe.protein || 0)}g</td>
                    <td className="px-4 py-3 text-center text-slate-700 dark:text-slate-300">{Math.round(recipe.carbsPerServing || recipe.carbs || 0)}g</td>
                    <td className="px-4 py-3 text-center text-slate-700 dark:text-slate-300">{Math.round(recipe.fatPerServing || recipe.fats || 0)}g</td>
                    <td className="px-4 py-3 text-center">
                      <button
                        onClick={() => deleteRecipe(recipe.id)}
                        className="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded text-xs font-medium transition"
                      >
                        {t.delete || 'Delete'}
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {/* Pagination Controls */}
        {filteredRecipes.length > 0 && (
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg">
            <div className="text-sm text-slate-600 dark:text-slate-400">
              {t.showing || 'Showing'}: {startIndex + 1} - {Math.min(startIndex + RECIPES_PER_PAGE, filteredRecipes.length)} {t.of || 'of'} {filteredRecipes.length} {t.recipes || 'recipes'} | {t.page || 'Page'} {page + 1} {t.of || 'of'} {totalPages}
              {searchQuery && <span className="ml-2 text-slate-700 dark:text-slate-300">({t.found || 'Found'}: {filteredRecipes.length})</span>}
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setPage(Math.max(0, page - 1))}
                disabled={page === 0}
                className="px-4 py-2 bg-slate-300 dark:bg-slate-600 hover:bg-slate-400 dark:hover:bg-slate-500 disabled:opacity-50 disabled:cursor-not-allowed text-slate-900 dark:text-white rounded-lg font-medium transition"
              >
                ← {t.previous || 'Previous'}
              </button>
              <button
                onClick={() => setPage(Math.min(totalPages - 1, page + 1))}
                disabled={page >= totalPages - 1}
                className="px-4 py-2 bg-slate-300 dark:bg-slate-600 hover:bg-slate-400 dark:hover:bg-slate-500 disabled:opacity-50 disabled:cursor-not-allowed text-slate-900 dark:text-white rounded-lg font-medium transition"
              >
                {t.next || 'Next'} →
              </button>
            </div>
          </div>
        )}

        {/* Summary */}
        <div className="text-sm text-slate-600 dark:text-slate-400 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg">
          {t.totalRecipes || 'Total Recipes'}: <span className="font-semibold text-slate-900 dark:text-white">{recipes.length}</span>
        </div>
      </div>
    );
  }

  window.MacroChef.components.AdminRecipes = AdminRecipes;
})();

// Admin Products Management - Import + Bulk Operations
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { useState, useEffect } = React;

  function AdminProducts({ repository, session }) {
    // Define constants FIRST, before any hooks
    const PRODUCTS_PER_PAGE = 25;
    
    // All useState hooks MUST come before any non-hook code
    const [products, setProducts] = useState([]);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [success, setSuccess] = useState('');
    const [selected, setSelected] = useState(new Set());
    const [editingId, setEditingId] = useState(null);
    const [editValues, setEditValues] = useState({});
    const [page, setPage] = useState(0);
    const [searchQuery, setSearchQuery] = useState('');
    
    // NOW you can do non-hook initialization
    const lang = localStorage.getItem('macrochef_lang') === 'en' ? 'en' : 'pl';
    const importInputRef = React.useRef(null);
    const defaultTranslations = {
      importProducts: 'Import Products',
      loading: 'Loading...',
      noProducts: 'No products',
      name: 'Name',
      shop: 'Shop',
      price: 'Price',
      category: 'Category',
      calories: 'Calories',
      protein: 'Protein',
      carbs: 'Carbs',
      fat: 'Fat',
      actions: 'Actions',
      delete: 'Delete',
      edit: 'Edit',
      save: 'Save',
      cancel: 'Cancel',
      selectItems: 'Select items',
      confirmDelete: 'Are you sure?',
      editSelected: 'Edit Selected',
      deleteSelected: 'Delete Selected',
      editProducts: 'Edit Products',
      productsUpdated: 'Products updated',
      productsDeleted: 'Products deleted',
      productsImported: 'Products imported',
      importProductsHelp: 'CSV format: name, price, calories, protein, carbs, fat, shop, category',
      totalProducts: 'Total Products',
      search: 'Search by name or category...',
      page: 'Page'
    };
    
    const langTranslations = window.MacroChef?.TRANSLATIONS?.[lang];
    const t = langTranslations || defaultTranslations;

    // Load all products
    useEffect(() => {
      async function loadProducts() {
        setLoading(true);
        setError('');
        setPage(0);
        try {
          if (!repository) {
            throw new Error('Repository not available');
          }
          if (typeof repository.getAllProducts !== 'function') {
            throw new Error('getAllProducts method not available on repository');
          }
          const all = await repository.getAllProducts();
          console.log('[AdminProducts] Loaded products count:', all ? all.length : 0, 'Products:', all);
          if (!Array.isArray(all)) {
            throw new Error(`getAllProducts returned non-array: ${typeof all}`);
          }
          setProducts(all || []);
        } catch (err) {
          const errorMsg = err.message || 'Failed to load products';
          setError(errorMsg);
          console.error('[AdminProducts] Load products error:', err);
        } finally {
          setLoading(false);
        }
      }
      loadProducts();
    }, [repository]);

    // Delete product
    const deleteProduct = async (productId) => {
      if (!window.confirm(t.confirmDelete || 'Are you sure?')) return;
      try {
        await repository.deleteProduct(productId);
        setProducts(products.filter(p => p.id !== productId));
        setSelected(prev => {
          const newSet = new Set(prev);
          newSet.delete(productId);
          return newSet;
        });
      } catch (err) {
        setError(err.message);
      }
    };

    // Bulk delete products
    const bulkDelete = async () => {
      if (selected.size === 0) {
        setError(t.selectItems || 'Select products first');
        return;
      }
      if (!window.confirm(`Delete ${selected.size} products?`)) return;

      try {
        for (const productId of selected) {
          await repository.deleteProduct(productId);
        }
        setProducts(products.filter(p => !selected.has(p.id)));
        setSelected(new Set());
        setSuccess(`${selected.size} ${t.productsDeleted || 'products deleted'}`);
        setTimeout(() => setSuccess(''), 3000);
      } catch (err) {
        setError(err.message);
      }
    };

    // Bulk edit - update values
    const bulkEdit = async () => {
      if (selected.size === 0) {
        setError(t.selectItems || 'Select products first');
        return;
      }

      try {
        for (const productId of selected) {
          const product = products.find(p => p.id === productId);
          if (!product) continue;

          const updated = { ...product };
          if (editValues.price !== undefined) updated.price = parseFloat(editValues.price);
          if (editValues.calories !== undefined) updated.calories = parseFloat(editValues.calories);
          if (editValues.protein !== undefined) updated.protein = parseFloat(editValues.protein);
          if (editValues.carbs !== undefined) updated.carbs = parseFloat(editValues.carbs);
          if (editValues.fat !== undefined) updated.fat = parseFloat(editValues.fat);

          await repository.saveProduct(updated);
        }

        // Reload products
        const all = await repository.getAllProducts();
        setProducts(all || []);
        setSelected(new Set());
        setEditingId(null);
        setEditValues({});
        setSuccess(`${selected.size} ${t.productsUpdated || 'products updated'}`);
        setTimeout(() => setSuccess(''), 3000);
      } catch (err) {
        setError(err.message);
      }
    };

    // Import products from CSV
    const handleImportCSV = async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      setLoading(true);
      setError('');
      setSuccess('');

      try {
        const text = await file.text();
        const lines = text.trim().split('\n');
        
        if (lines.length < 2) {
          throw new Error('CSV must have header and at least one product');
        }

        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const nameIdx = headers.indexOf('name');
        const priceIdx = headers.indexOf('price');
        const caloriesIdx = headers.indexOf('calories');
        const proteinIdx = headers.indexOf('protein');
        const carbsIdx = headers.indexOf('carbs');
        const fatIdx = headers.indexOf('fat');
        const shopIdx = headers.indexOf('shop');
        const categoryIdx = headers.indexOf('category');

        if (nameIdx === -1) throw new Error('CSV must have "name" column');

        const newProducts = [];
        for (let i = 1; i < lines.length; i++) {
          const cells = lines[i].split(',').map(c => c.trim());
          if (!cells[nameIdx]) continue;

          const product = {
            id: window.crypto.randomUUID(),
            userId: session.userId,
            name: cells[nameIdx],
            price: parseFloat(cells[priceIdx]) || 0,
            calories: parseFloat(cells[caloriesIdx]) || 0,
            protein: parseFloat(cells[proteinIdx]) || 0,
            carbs: parseFloat(cells[carbsIdx]) || 0,
            fat: parseFloat(cells[fatIdx]) || 0,
            shop: cells[shopIdx] || 'Unknown',
            category: cells[categoryIdx] || 'Other',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };

          await repository.saveProduct(product);
          newProducts.push(product);
        }

        setProducts([...products, ...newProducts]);
        setSuccess(`${newProducts.length} ${t.productsImported || 'products imported'}`);
        setTimeout(() => setSuccess(''), 3000);
        event.target.value = '';
      } catch (err) {
        setError(err.message);
      } finally {
        setLoading(false);
      }
    };

    // Download CSV template
    const handleDownloadTemplate = () => {
      const templateContent = `Nazwa,Cena,Kalorie,Białko,Węglowodany,Tłuszcze,Sklep,Kategoria
Jajko,2.50,78,6,0.56,5.30,Lidl,Nabiał`;
      const blob = new Blob([templateContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', 'macrochef-products-template.csv');
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      const productShop = (product.shop || '').toLowerCase();
      
      return query === '' || productName.includes(query) || 
             productCategory.includes(query) || 
             productShop.includes(query);
    });

    // Calculate pagination
    const totalPages = Math.ceil(filteredProducts.length / PRODUCTS_PER_PAGE);
    const startIdx = page * PRODUCTS_PER_PAGE;

                      >

                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>

          </div>

        {/* Summary & Pagination */}

            )}

          {filteredProducts.length > PRODUCTS_PER_PAGE && (

    };

    const handleSaveGoals = (changes) => {
      const newGoals = { ...(goalsDraftRef.current || storedGoals), ...changes };
      goalsDraftRef.current = newGoals;
      setGoalsDraft(newGoals);
      setGoalsSaveError(false);
      setGoalsSaving(true);
      const version = ++goalsSaveVersion.current;
      goalsSaveQueue.current = goalsSaveQueue.current.then(async () => {
        try {
          await repositories.saveGoals(newGoals);
          if (version === goalsSaveVersion.current) {
            setSavedGoalsVersion(version);
            setGoalsSaving(false);
          }
        } catch (error) {
          console.error('Failed to save goals:', error);
          if (version === goalsSaveVersion.current) {
            setGoalsSaveError(true);
            setGoalsSaving(false);
          }
        }
      });
    };

    const handleStartBatchCooking = (recipe) => {
      setSelectedBatchRecipe(recipe);
      setBatchStep(0);
      setActiveTab('batch');
    };

    const handleToggleShoppingCheck = (name) => {
      setCheckedShopping((prev) => ({
        ...prev,
        [name]: !prev[name]
      }));
    };

    return (
      <div className={darkMode ? 'dark' : ''}>
        <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 pb-24 md:pb-0">
          {/* Header */}
          <Header
            darkMode={darkMode}
            setDarkMode={setDarkMode}
            colorTheme={colorTheme}
            setColorTheme={setColorTheme}
            session={session}
            onSignOut={onSignOut}
            syncStatus={syncStatus}
          />
          <AdBanner role={role} />

          {/* Main Layout Container */}
          <main className="w-full max-w-7xl mx-auto px-4 pt-6 flex-1">
            {/* Desktop Tabs */}
            <Navigation
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              isMobile={false}
              session={session}
            />

            {/* Tab 1: Weekly Planner */}
            {activeTab === 'planner' && (
              <MealPlanner
                daysKeys={DAYS_KEYS}
                plan={plan}
                recipes={recipes}
                goals={goals}
                onAssignMeal={handleAssignMeal}
                onCreateRecipe={canManageRecipes ? handleCreateRecipe : undefined}
              />
            )}

            {/* Tab 2: Recipe Library */}
            {activeTab === 'recipes' && (
              <RecipeLibrary
                recipes={recipes}
                canManageRecipes={canManageRecipes}
                onCreateRecipe={handleCreateRecipe}
                onEditRecipe={handleEditRecipe}
                onDeleteRecipe={handleDeleteRecipe}
                onImportRecipes={handleImportRecipes}
                onStartBatchCooking={handleStartBatchCooking}
              />
            )}

            {/* Tab 3: Batch Cooking */}
            {activeTab === 'batch' && (
              <BatchCooking
                recipes={recipes}
                selectedRecipe={selectedBatchRecipe}
                onSelectRecipe={setSelectedBatchRecipe}
                batchStep={batchStep}
                setBatchStep={setBatchStep}
              />
            )}

            {/* Tab 4: Smart Shopping List */}
            {activeTab === 'shopping' && (
              <ShoppingList
                shoppingList={aggregatedShoppingList}
                checkedShopping={checkedShopping}
                onToggleCheck={handleToggleShoppingCheck}
                onUncheckAll={() => setCheckedShopping({})}
              />
            )}

            {/* Tab 5: Macro & Goals Tracker */}
            {activeTab === 'tracker' && (
              appData.error ? (
                <p role="alert" className="text-red-600 dark:text-red-400">{t.goalsLoadError}</p>
              ) : !appData.data ? (
                <p role="status">{t.goalsLoading}</p>
              ) : (
                <>
                  {goalsSaving && (
                    <p role="status" className="max-w-3xl mx-auto mb-4 text-slate-500">
                      {t.goalsSaving}
                    </p>
                  )}
                  {goalsSaveError && (
                    <div role="alert" className="max-w-3xl mx-auto mb-4 text-red-600 dark:text-red-400">
                      {t.goalsSaveError}{' '}
                      <button type="button" className="underline" onClick={() => handleSaveGoals({})}>
                        {t.retry}
                      </button>
                    </div>
                  )}
                  <MacroTracker
                    goals={goals}
                    onSaveGoals={handleSaveGoals}
                  />
                </>
              )
            )}

            {/* Tab 6: Admin Panel (Admin only) */}
            {activeTab === 'admin' && session?.role === 'Admin' && (
              <AdminPanel
                repository={repositories}
                session={session}
              />
            )}
          </main>

          {/* Modal Dialog */}
          {showRecipeModal && canManageRecipes && (
            <RecipeModal
              repository={repositories}
              editingRecipe={editingRecipe}
              onClose={() => {
                setShowRecipeModal(false);
                setEditingRecipe(null);
              }}
              onSave={handleSaveRecipe}
            />
          )}
          {window.MacroChef.ENV === 'PROD' && (
            <footer className="hidden md:block w-full border-t border-slate-200 dark:border-slate-800 mt-8">
              <div className="max-w-7xl mx-auto px-4 py-4 text-center text-xs text-slate-400 dark:text-slate-500">
                MacroChef • {t.version || 'Version'} {window.MacroChef.APP_VERSION || '0.0.0'}
              </div>
            </footer>
          )}

          {/* Mobile Bottom Navigation */}
          <Navigation
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            isMobile={true}
            session={session}
          />
        </div>
      </div>
    );
  }

  window.MacroChef.App = App;
})();

// ==========================================
window.MacroChef = window.MacroChef || {};
window.MacroChef.components = window.MacroChef.components || {};

(function () {
  const { useEffect, useRef, useState } = React;

  function SessionApp() {
    const [active, setActive] = useState(null);
    const [target, setTarget] = useState(null);
    const [error, setError] = useState(null);
    const [attempt, setAttempt] = useState(0);
    const [authLoading, setAuthLoading] = useState(false);
    const [authError, setAuthError] = useState('');
    const activeRef = useRef(null);
    const wantedRef = useRef(null);
    const latestSession = useRef(null);
    const sequence = useRef(0);

    useEffect(() => {
      let disposed = false;
      async function refresh() {
        const request = ++sequence.current;
        try {
          const session = await window.MacroChef.auth.getSessionAndRole();
          if (disposed || request !== sequence.current) return;
          latestSession.current = session;
          setError(null);
          const key = session ? JSON.stringify([session.issuer, session.tenantId, session.userId]) : 'guest';
          if (wantedRef.current === key) {
            setActive((previous) => previous ? { ...previous, session } : previous);
            return;
          }
          wantedRef.current = key;
          setActive(null);
          setTarget({ key, session });
        } catch (err) {
          if (disposed || request !== sequence.current) return;
          console.error('Account verification failed:', err);
          setError('authLoadError');
        }
      }
      const unsubscribe = window.MacroChef.auth.subscribe((event) => {
        if (event === 'changing') {
          sequence.current++;
          wantedRef.current = null;
          if (activeRef.current && activeRef.current.syncManager) activeRef.current.syncManager.stop();
          setActive(null);
          setTarget({ suspended: true });
        } else {
          refresh();
        }
      });
      refresh();
      return () => {
        disposed = true;
        sequence.current++;
        unsubscribe();
      };
    }, [attempt]);

    useEffect(() => {
      if (!target) return;
      let cancelled = false;
      let next;
      const stale = () => cancelled || wantedRef.current !== target.key;
      async function open() {
        try {
          if (activeRef.current) {
            const previous = activeRef.current;
            activeRef.current = null;
            if (previous.syncManager) await previous.syncManager.stop();
            previous.repository.close();
          }
          if (target.suspended) return;
          next = target.session
            ? await window.MacroChef.createScopedRepository(target.session)
            : { repository: new window.MacroChef.DexieCalorieRepository(), shoppingStorageKey: 'macrochef_checked' };
          if (stale()) {
            next.repository.close();
            return;
          }
          await next.repository.initialize();
          if (stale()) {
            next.repository.close();
            return;
          }
          if (target.session) await next.repository.seedProducts();
          if (stale()) {
            next.repository.close();
            return;
          }
          if (target.session && !await next.repository.hasGuestMigrationDecision()) {
            if (stale()) {
              next.repository.close();
              return;
            }
            let data = { recipes: [], plans: [] };
            if (await window.MacroChef.guestDatabaseExists()) {
              const guest = new window.MacroChef.DexieCalorieRepository('MacroChefDB', { seedDefaults: false });
              try {
                await guest.initialize();
                data = await guest.getGuestMigrationData();
              } finally {
                guest.close();
              }
            }
            if (stale()) {
              next.repository.close();
              return;
            }
            const hasData = data.recipes.length > 0 || data.plans.some((plan) =>
              ['Breakfast', 'Lunch', 'Dinner', 'Snack'].some((slot) => plan[slot]));
            const lang = (data.lang || localStorage.getItem('macrochef_lang')) === 'en' ? 'en' : 'pl';
            const accepted = hasData && window.confirm(window.MacroChef.TRANSLATIONS[lang].authMigrationPrompt);
            await next.repository.finishGuestMigration(data, accepted);
          }
          if (stale()) {
            next.repository.close();
            return;
          }
          if (target.session) {
            next.syncManager = new window.MacroChef.AppSyncManager();
            next.syncManager.start({
              repository: next.repository,
              userId: target.session.userId,
              client: window.MacroChef.supabaseClient
            });
          }
          activeRef.current = next;
          setActive({ ...next, key: target.key, session: latestSession.current });
        } catch (err) {
          if (next) next.repository.close();
          if (!stale()) {
            console.error('Account repository initialization failed:', err);
            wantedRef.current = null;
            setError(err.message === 'Guest plan references a missing recipe'
              ? 'authGuestDataError'
              : 'authDataError');
          }
        }
      }
      open();
      return () => {
        cancelled = true;
        if (next && activeRef.current !== next) {
          if (next.syncManager) next.syncManager.stop().then(() => next.repository.close());
          else next.repository.close();
        }
      };
    }, [target]);

    useEffect(() => () => {
      if (activeRef.current) {
        const previous = activeRef.current;
        if (previous.syncManager) previous.syncManager.stop().then(() => previous.repository.close());
        else previous.repository.close();
      }
    }, []);

    const handleSignIn = async (email, password, isSignUp) => {
      setAuthLoading(true);
      setAuthError('');
      try {
        if (isSignUp) {
          await window.MacroChef.auth.signUp(email, password);
        } else {
          await window.MacroChef.auth.signIn(email, password);
        }
      } catch (err) {
        setAuthError(err.message || (isSignUp ? 'Sign up failed' : 'Sign in failed'));
        setAuthLoading(false);
        throw err;
      }
    };

    const handleSignOut = async () => {
      try {
        await window.MacroChef.auth.signOut();
      } catch (err) {
        console.error('Sign-out failed:', err);
        setError('authSignOutError');
      }
    };

    // Loading state - show nothing until we determine auth status
    if (!target) {
      return <div style={{ display: 'none' }}></div>;
    }

    // Get AuthGate component
    const { AuthGate } = window.MacroChef.components;

    // If unauthenticated, show auth gate (no session)
    if (!target.session) {
      if (AuthGate) {
        return (
          <AuthGate
            isAuthenticated={false}
            session={null}
            onSignOut={handleSignOut}
            authenticatedContent={null}
          />
        );
      }
    }

    // If authenticated and active repository is ready, show app wrapped in AuthGate
    if (active && target.session) {
      const appContent = (
        <window.MacroChef.I18nProvider key={active.key} repository={active.repository}>
          {error && <p role="alert">Nie udało się zweryfikować sesji / Could not verify the session. <button type="button" onClick={() => setAttempt((n) => n + 1)}>Retry / Spróbuj ponownie</button></p>}
          <window.MacroChef.App repositories={active.repository} shoppingStorageKey={active.shoppingStorageKey} session={active.session} syncManager={active.syncManager} onSignOut={handleSignOut} />
        </window.MacroChef.I18nProvider>
      );

      if (AuthGate) {
        return (
          <AuthGate
            isAuthenticated={true}
            session={active.session}
            onSignOut={handleSignOut}
            authenticatedContent={appContent}
          />
        );
      }
      return appContent;
    }

    // Loading state while setting up repository
    return <div style={{ display: 'none' }}></div>;
  }

  window.MacroChef.components.SessionApp = SessionApp;
})();

// Application Bootstrapper & Service Worker Registration
(function () {
  const { SessionApp } = window.MacroChef.components;

  // Mount React App
  const rootElement = document.getElementById('root');
  if (rootElement && SessionApp) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(React.createElement(SessionApp));
  }

  // Register PWA Service Worker for offline capability
  if ('serviceWorker' in navigator) {
    const registerServiceWorker = () => {
      navigator.serviceWorker
        .register('./sw.js')
        .then((reg) => {
          console.log('[MacroChef PWA] Service Worker registered successfully:', reg.scope);
        })
        .catch((err) => {
          console.warn('[MacroChef PWA] Service Worker registration failed:', err);
        });
    };
    if (document.readyState === 'complete') {
      registerServiceWorker();
    } else {
      window.addEventListener('load', registerServiceWorker);
    }
  }
})();

  </script>
