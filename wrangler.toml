name = "macrochef"
type = "javascript"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = false
compatibility_date = "2026-11-14"

# Build configuration
build = { command = "npm run build", cwd = "." }
main = "dist/index.html"

# Routes for Cloudflare Pages
routes = [
  { pattern = "test.macrochef.pl/*", zone_name = "macrochef.pl" }
]

# Environment variables for different branches
[env.production]
name = "macrochef-prod"
route = "macrochef.pl/*"
vars = { ENV = "PROD" }

[env.test]
name = "macrochef-test"
route = "test.macrochef.pl/*"
vars = { ENV = "TEST" }

[env.feature]
name = "macrochef-feature"
route = "feature-*.test.macrochef.pl/*"
vars = { ENV = "TEST" }

# Disable automatic minification (we handle it ourselves)
minify = false

# Enable caching for static assets
[env.production.build]
cwd = "."
command = "npm run build"

[env.test.build]
cwd = "."
command = "npm run build"

[env.feature.build]
cwd = "."
command = "npm run build"

# Comment: 
# 1. Replace YOUR_CLOUDFLARE_ACCOUNT_ID with your actual Cloudflare account ID
# 2. Cloudflare Pages automatically handles deployments from GitHub
# 3. Branch deployments use format: branch-name.test.macrochef.pl
# 4. Main production deploys to macrochef.pl via GitHub Pages (not Cloudflare)
